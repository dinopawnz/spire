<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mudwater Spire - host remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Classic host-remote look (as in the original Skyreach / Left Behind remotes). Each game sets the palette + title font. */
:root {
  --bg: #0a0d1c; --panel: #121733; --edge: #262d57; --sky: #6fd3ff; --gold: #ffd23f; --ink: #eef1ff; --muted: #9aa3cc;
  --safe: #4dff95; --danger: #ff4a5a; --well: #0b0f26; --btn: #232a55; --glow1: #3a2a6a; --glow2: #141a3a; --h2: var(--sky);
  --title: "Bebas Neue", Impact, sans-serif; --title-w: 400; --title-ls: .06em; --h2-size: 22px;
  --go: #145c34; --stop: #6a1a22; --warn: #6a4a10; --skyb: #174a6a; --lit: #8a6a10; --lit-glow: rgba(255,210,63,.45);
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--bg); }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse 80% 50% at 50% -10%, var(--glow1) 0%, transparent 70%), linear-gradient(180deg, var(--glow2) 0%, var(--bg) 60%);
  background-attachment: fixed;
  color: var(--ink); font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 1.4;
}
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 18px 40px; }
header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { margin: 0; font-family: var(--title); font-weight: var(--title-w); font-size: 44px; letter-spacing: var(--title-ls); color: var(--gold); text-shadow: 0 0 18px var(--lit-glow); line-height: 1; text-transform: uppercase; }
.tag { color: var(--muted); }
.link { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #3a4170; flex: none; }
.dot.on { background: var(--safe); box-shadow: 0 0 10px var(--safe); } .dot.wait { background: var(--gold); } .dot.bad { background: var(--danger); }
.link input { font: inherit; font-size: 15px; background: var(--well); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 9px 11px; min-width: 0; }
#url { flex: 1 1 360px; } #pin { width: 90px; text-align: center; letter-spacing: .2em; }
.link label { color: var(--muted); font-size: 15px; }
input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.link button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 20px; background: var(--gold); color: #2a2204; }
.link button.off { background: var(--edge); color: var(--ink); }
.state { width: 100%; font-size: 15px; color: var(--muted); } .state.bad { color: var(--danger); }
main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
h2 { font-family: var(--title); font-weight: var(--title-w); font-size: var(--h2-size); letter-spacing: .08em; margin: 0 0 10px; color: var(--h2); text-transform: uppercase; }
h2 .note { font-family: "Rajdhani", sans-serif; font-size: 15px; letter-spacing: 0; text-transform: none; margin-left: 6px; }
h3 { font-size: 15px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
h3 .now { color: var(--gold); margin-left: 6px; }
.note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.note b { color: var(--ink); }
.chip { display: inline-block; padding: 2px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; letter-spacing: .06em; background: var(--btn); text-transform: uppercase; }
.chip.lobby { background: #1d2a55; color: var(--sky); } .chip.up { background: #173a24; color: var(--safe); } .chip.play { background: #4a3a10; color: var(--gold); }
.chip.count { background: #5a2a10; color: #ffb06a; } .chip.pause { background: #3a3a48; color: #fff; } .chip.bad { background: #5a1a24; color: var(--danger); }
.statusline { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.big { font-family: var(--title); font-size: 44px; line-height: 1; letter-spacing: .04em; }
.bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; margin-top: 6px; }
.bar b { display: block; height: 100%; width: 0; transition: width .4s; background: var(--gold); }
.event { margin-top: 10px; padding: 8px 10px; background: var(--well); border-radius: 8px; font-weight: 600; letter-spacing: .03em; min-height: 2.2em; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 13px; font-weight: 700; letter-spacing: .08em; padding: 2px 8px; border-radius: 6px; background: #2a2f5a; color: var(--ink); text-transform: uppercase; }
.badge.warn { background: #4a3410; color: var(--gold); } .badge.grn { background: #143a22; color: var(--safe); } .badge.bad { background: #4a1418; color: var(--danger); }
.stats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-top: 10px; }
.stat { background: var(--well); border-radius: 10px; padding: 8px 10px; }
.stat span { display: block; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.stat b { font-family: var(--title); font-size: 30px; font-weight: var(--title-w); line-height: 1.1; }
.grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.grid.narrow { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.btn { font: inherit; font-weight: 700; font-size: 16px; color: var(--ink); border: 0; border-radius: 8px; cursor: pointer; padding: 10px 8px; min-height: 52px;
  background: var(--btn); box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); transition: transform .06s, filter .15s; line-height: 1.2; }
.btn:hover { filter: brightness(1.2); }
.btn:active, .btn.hit { transform: translateY(2px); filter: brightness(1.5); }
.btn small { display: block; font-size: 12px; font-weight: 500; opacity: .75; }
.b-go { background: var(--go); } .b-stop { background: var(--stop); } .b-warn { background: var(--warn); } .b-sky { background: var(--skyb); }
.btn.lit { background: var(--lit); box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), 0 0 14px var(--lit-glow); }
.btn.big1 { min-height: 64px; font-size: 18px; }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.stepper .lab { min-width: 150px; font-weight: 700; letter-spacing: .06em; }
.stepper .btn { min-width: 56px; min-height: 44px; }
.stepper .val { min-width: 54px; text-align: center; font-family: var(--title); font-size: 30px; line-height: 1; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--edge); white-space: nowrap; }
td { padding: 5px 6px; border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent); vertical-align: middle; white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tm { font-weight: 700; padding: 1px 8px; border-radius: 6px; font-size: 13px; letter-spacing: .06em; background: var(--btn); color: var(--muted); text-transform: uppercase; }
.mini { font: inherit; font-size: 13px; font-weight: 700; border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; background: var(--btn); color: var(--ink); margin: 1px; }
.mini:hover { filter: brightness(1.3); } .mini.lit { outline: 2px solid var(--gold); } .mini.stop { background: var(--stop); } .mini.go { background: var(--go); }
.mini.hit { filter: brightness(1.6); }
select.mini { padding: 3px 4px; }
.empty { color: var(--muted); padding: 10px 2px; }
.log { background: var(--well); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); height: 220px; overflow-y: auto; }
.log p { margin: 0 0 3px; } .log .bad { color: var(--danger); } .log .ok { color: var(--ink); }
.sayrow { display: flex; gap: 8px; } .sayrow input { flex: 1; font: inherit; background: var(--well); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.locked main .needs { opacity: .5; }
@media (prefers-reduced-motion: reduce) { .btn, .bar b { transition: none; } }

:root { --bg: #070d0a; --panel: #0f1a14; --edge: #23402e; --gold: #f2c45a; --ink: #eef6ea; --muted: #9fb8a4; --sky: #7fe0c8; --safe: #7ef0a8; --danger: #ff6a5a;
  --well: #0a130e; --btn: #1a3324; --glow1: #1f4a2e; --glow2: #0c1a12; --h2: #7fe0c8; --lit: #8a6a14; --lit-glow: rgba(242,196,90,.5);
  --title: "Cinzel", Georgia, serif; --title-w: 700; --title-ls: .05em; --h2-size: 20px; --go: #1f6038; --stop: #7a2a1a; --warn: #7a5a14; --skyb: #1a5a4a; }
h1 { font-size: 40px; color: #f7dc94; text-shadow: 0 0 22px rgba(120,220,160,.45); }
.chip.idle { background: #23302a; color: var(--muted); } .chip.over { background: #4a3a10; color: var(--gold); }
.build-on { background: #1f6038 !important; } .build-off { background: #5a221a !important; }
td.hero { color: var(--gold); font-weight: 700; }
.lifts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 8px; }
.liftcard { background: var(--well); border-radius: 10px; padding: 10px 12px; }
.liftcard .nm { font-family: var(--title); font-size: 18px; color: var(--sky); }
.liftcard .st { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
details.cheat { background: var(--well); border-radius: 10px; padding: 8px 12px; }
details.cheat summary { cursor: pointer; font-weight: 700; color: var(--gold); }
details.cheat dl { margin: 8px 0 0; } details.cheat dt { color: var(--sky); font-weight: 700; margin-top: 8px; } details.cheat dd { margin: 2px 0 0 0; }
</style>
</head>
<body>
<script>
/* ==========================================================================
   Host-remote core, classic look.
   Joins the game's MML document the same way the world does (networked-dom-v0.1,
   a JSON websocket), finds the hidden remote board by its ids, "clicks" its keys
   (PIN first, then commands with a number typed on the arg keys) - or, for games
   with a typed host prompt, types "<PIN> <command>" into it - and shows what the
   game sends back on the board's data-* attributes.
   ========================================================================== */
(function () {
  "use strict";
  function h(tag, props) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
      else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (let i = 2; i < arguments.length; i++) add(e, arguments[i]);
    return e;
  }
  function add(e, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach((x) => add(e, x)); return; }
    e.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  function setText(e, t) { t = t === undefined || t === null ? "" : String(t); if (e.textContent !== t) e.textContent = t; }
  function clock(ms) {
    if (!(ms >= 0)) return "--:--";
    const s = Math.ceil(ms / 1000), m = Math.floor(s / 60), r = s % 60;
    return m >= 60 ? Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") + ":" + String(r).padStart(2, "0") : m + ":" + String(r).padStart(2, "0");
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } return null; }
  // reuse rows by key so their buttons survive the once-a-second refresh
  function keyed(container, items, keyOf, create, update) {
    const map = container._keyed || (container._keyed = new Map());
    const seen = new Set(); let prev = null;
    items.forEach((it, i) => {
      const k = String(keyOf(it, i)); seen.add(k);
      let row = map.get(k);
      if (!row) { row = create(it, i); map.set(k, row); }
      update(row, it, i);
      const want = prev ? prev.nextSibling : container.firstChild;
      if (row.el !== want) container.insertBefore(row.el, want);
      prev = row.el;
    });
    map.forEach((row, k) => { if (!seen.has(k)) { row.el.remove(); map.delete(k); } });
  }
  const BADWORDS = /LOCKED - TYPE|WRONG|^NO |\bNO |NOT |UNKNOWN|PICK |ALREADY|CAN'T|NOBODY|NOTHING|TRY:|ERROR|MUST|ONLY /;

  window.Remote = { h, setText, clock, keyed, start };

  function start(cfg) {
    const R = { cfg, data: {}, dataAt: {}, h, setText, clock, keyed };
    const KEY = cfg.key + "-remote-";
    let ws = null, want = false, retry = 0, retryT = 0;
    let unlocked = false, unlockT = 0, unlocking = false;
    let nodes = new Map(), byId = new Map(), boardNode = null, boardAttrs = null, sawSnapshot = false;
    let ackSeen = -1;
    let offset = 0, renderQueued = false;

    // ---------------- page ----------------
    document.title = cfg.title + " - host remote";
    const dot = h("span", { class: "dot" });
    const urlIn = h("input", { id: "url", type: "text", spellcheck: "false", autocomplete: "off", placeholder: "wss://… the same address your world uses for " + cfg.title, "aria-label": cfg.title + " document address" });
    const pinIn = h("input", { id: "pin", type: "text", inputmode: "numeric", autocomplete: "off", "aria-label": "Host code" });
    const goBtn = h("button", { id: "go", type: "button", text: "Connect" });
    const stateEl = h("div", { class: "state", text: "Not connected." });
    const logEl = h("div", { class: "log" });
    R.left = h("section"); R.right = h("aside");
    const wrap = h("div", { class: "wrap locked" },
      h("header", null, h("h1", { text: cfg.title }), h("div", { class: "tag", text: cfg.tag || "Host remote. Run the game from anywhere while you play." })),
      h("section", { class: "link", "aria-label": "Connection" }, dot, urlIn, h("label", { for: "pin", text: "PIN" }), pinIn, goBtn, stateEl),
      h("main", null, R.left, R.right));
    document.body.appendChild(wrap);
    const qs = new URLSearchParams(location.search);
    urlIn.value = qs.get("url") || store(KEY + "url") || "";
    pinIn.value = qs.get("pin") || store(KEY + "pin") || cfg.pin || "";
    goBtn.addEventListener("click", () => (want ? disconnect() : connect()));
    [urlIn, pinIn].forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter" && !want) connect(); }));

    let lastLog = "", lastLogAt = 0;
    function log(msg, kind, dedupe) {
      if (dedupe && msg === lastLog && Date.now() - lastLogAt < 4000) return;      // the game's event line often repeats its reply
      lastLog = msg; lastLogAt = Date.now();
      const p = h("p", { class: kind || "", text: new Date().toLocaleTimeString() + "  " + msg });
      const near = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
      logEl.appendChild(p);
      while (logEl.childNodes.length > 300) logEl.removeChild(logEl.firstChild);
      if (near) logEl.scrollTop = logEl.scrollHeight;
    }
    function setState(text, kind) { stateEl.textContent = text; stateEl.className = "state" + (kind === "bad" ? " bad" : ""); dot.className = "dot" + (kind ? " " + kind : ""); }
    function setGo() { goBtn.textContent = want ? "Disconnect" : "Connect"; goBtn.className = want ? "off" : ""; wrap.classList.toggle("locked", !unlocked); }
    R.log = log;
    R.event = (t) => log(t, "", true);           // the game's own event line, skipped if it just said the same

    // ---------------- connection ----------------
    function normUrl(u) {
      u = u.trim();
      if (/^https?:\/\//i.test(u)) u = u.replace(/^http/i, "ws");
      if (!/^wss?:\/\//i.test(u)) u = "wss://" + u;
      return u;
    }
    function connect() {
      if (!urlIn.value.trim()) { setState("Paste the wss:// address your world uses for " + cfg.title + " first.", "bad"); urlIn.focus(); return; }
      if (!/^[0-9]+$/.test(pinIn.value.trim())) { setState("Type the PIN - the game's host code (numbers only).", "bad"); pinIn.focus(); return; }
      store(KEY + "url", urlIn.value.trim()); store(KEY + "pin", pinIn.value.trim());
      want = true; retry = 0; open(normUrl(urlIn.value));
    }
    function disconnect() {
      want = false; clearTimeout(retryT); clearTimeout(unlockT);
      if (ws) { const s = ws; ws = null; try { s.close(); } catch (e) {} }
      unlocked = false; setGo(); setState("Not connected."); log("Disconnected.");
    }
    function open(u) {
      clearTimeout(retryT);
      if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
      nodes = new Map(); byId = new Map(); boardNode = null; boardAttrs = null; sawSnapshot = false; unlocked = false; unlocking = false;
      setGo(); setState(retry ? "Reconnecting…" : "Connecting…", "wait");
      log("Connecting to " + u);
      let sock;
      try { sock = new WebSocket(u, "networked-dom-v0.1"); }
      catch (e) { setState("That isn't a usable address: " + e.message, "bad"); want = false; setGo(); return; }
      ws = sock;
      sock.onopen = () => { if (ws === sock) { retry = 0; log("Connected (networked-dom-v0.1)."); } };
      sock.onmessage = (ev) => { if (ws !== sock) return; let m; try { m = JSON.parse(ev.data); } catch (e) { return; } (Array.isArray(m) ? m : [m]).forEach(onMsg); };
      sock.onclose = (ev) => {
        if (ws !== sock) return;
        ws = null; unlocked = false; setGo();
        if (!want) return;
        retry++;
        const wait = Math.min(10000, 1000 * Math.pow(1.6, retry));
        const msg = sawSnapshot ? "Lost the connection - trying again in " + Math.round(wait / 1000) + " s." :
          "Couldn't reach " + cfg.title + " (" + (ev.code || "no answer") + "). Is the address right, and is the game deployed? Trying again in " + Math.round(wait / 1000) + " s.";
        setState(msg, "bad"); log(msg, "bad");
        retryT = setTimeout(() => { if (want) open(u); }, wait);
      };
    }
    function send(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; }

    // ---------------- mirror: ids, plus the board's attributes ----------------
    function addNode(n, parent) {
      if (!n || n.type !== "element") { if (n) nodes.set(n.nodeId, { parent, kids: [] }); return; }
      const id = n.attributes && n.attributes.id;
      const rec = { parent, kids: [], id: id || null };
      nodes.set(n.nodeId, rec);
      if (id) byId.set(id, n.nodeId);
      if (id === cfg.boardId) { boardNode = n.nodeId; boardAttrs = Object.assign({}, n.attributes); boardAppeared(); }
      (n.children || []).forEach((c) => { rec.kids.push(c.nodeId); addNode(c, n.nodeId); });
    }
    function dropNode(id) {
      const rec = nodes.get(id); if (!rec) return;
      rec.kids.forEach(dropNode);
      if (rec.id && byId.get(rec.id) === id) byId.delete(rec.id);
      if (id === boardNode) { boardNode = null; boardAttrs = null; }
      nodes.delete(id);
    }
    function onMsg(m) {
      switch (m.type) {
        case "snapshot":
          nodes = new Map(); byId = new Map(); boardNode = null; boardAttrs = null; sawSnapshot = true;
          addNode(m.snapshot, null);
          log("Got the " + cfg.title + " document (" + nodes.size + " parts).");
          afterSnapshot(); break;
        case "childrenChanged": {
          const p = nodes.get(m.nodeId);
          (m.removedNodes || []).forEach((id) => { dropNode(id); if (p) p.kids = p.kids.filter((k) => k !== id); });
          (m.addedNodes || []).forEach((c) => { addNode(c, m.nodeId); if (p) p.kids.push(c.nodeId); });
          break;
        }
        case "attributeChange": {
          const rec = nodes.get(m.nodeId); if (!rec) break;
          if (m.attribute === "id") { if (rec.id) byId.delete(rec.id); rec.id = m.newValue; if (m.newValue) byId.set(m.newValue, m.nodeId); }
          if (m.nodeId === boardNode) {
            if (m.newValue === null) delete boardAttrs[m.attribute]; else boardAttrs[m.attribute] = m.newValue;
            if (m.attribute.startsWith("data-")) dataChanged(m.attribute.slice(5), m.newValue);
          }
          break;
        }
        case "ping": send({ type: "pong", pong: m.ping }); break;
        case "error": log("Document error: " + m.message, "bad"); break;
        case "warning": log("Document warning: " + m.message); break;
      }
    }
    function afterSnapshot() {
      if (cfg.mode === "prompt") {
        if (!byId.has(cfg.promptId)) { setState("Connected, but this document has no " + cfg.title + " host prompt. Is it the right address (" + cfg.doc + ")?", "bad"); return; }
      } else if (boardNode === null) {
        setState("Connected, but this document has no " + cfg.title + " remote board. Is it the right address (" + cfg.doc + ")?", "bad"); return;
      }
      unlock();
    }
    function boardAppeared() { for (const k in boardAttrs) if (k.startsWith("data-")) dataChanged(k.slice(5), boardAttrs[k], true); }
    function dataChanged(k, v, initial) {
      if (k === "ack") { onAck(v, initial); return; }
      let val = v;
      if (typeof v === "string") { try { val = JSON.parse(v); } catch (e) { val = v; } }
      R.data[k] = val; R.dataAt[k] = Date.now();
      if (val && typeof val === "object" && typeof val.now === "number") offset = val.now - Date.now();
      queueRender();
    }

    // ---------------- unlocking ----------------
    function unlock() {
      const pin = pinIn.value.trim();
      unlocking = true;
      setState("Connected - unlocking with the PIN…", "wait");
      if (cfg.mode === "prompt") prompt(cfg.promptId, pin + " remote");
      else { click(cfg.prefix + "-key-C", true); for (const d of pin) click(cfg.prefix + "-key-" + d, true); }
      clearTimeout(unlockT);
      unlockT = setTimeout(() => {
        if (unlocked) return;
        unlocking = false;
        setState("Connected, but the game didn't unlock. Check the PIN is the host code in " + cfg.doc + " (" + cfg.pin + " unless you changed it), then reconnect.", "bad");
        log("Not unlocked - check the PIN.", "bad");
      }, 5000);
    }
    function gotUnlocked() {
      unlocked = true; unlocking = false; clearTimeout(unlockT); setGo();
      setState("Connected and unlocked - you're running " + cfg.title + ".", "on");
      log("PIN accepted - you're in control.", "ok");
      queueRender();
    }
    function onAck(v, initial) {
      let a; try { a = JSON.parse(v); } catch (e) { return; }
      if (!a) return;
      const list = (a.l && a.l.length ? a.l : [{ n: a.n, t: a.t }]);
      if (initial && ackSeen < 0) {           // what was there before we came: not ours
        ackSeen = a.n;
        if (cfg.mode === "prompt" && unlocking && list.some((x) => /^UNLOCKED/.test(String(x.t)))) gotUnlocked();
        return;
      }
      list.filter((x) => x.n > ackSeen).sort((p, q) => p.n - q.n).forEach((x) => {
        const t = String(x.t);
        if (!unlocked && /^UNLOCKED/.test(t)) { if (unlocking) gotUnlocked(); return; }
        if (!unlocked && /WRONG (PIN|CODE)/.test(t)) {
          if (unlocking) { unlocking = false; clearTimeout(unlockT); setState("Connected, but that PIN is wrong. Fix it, then reconnect.", "bad"); log("Wrong PIN.", "bad"); }
          return;
        }
        if (unlocked) log(t, BADWORDS.test(t.replace(/^[A-Z0-9]+: /, "")) ? "bad" : "ok");
      });
      ackSeen = Math.max(ackSeen, a.n);
    }

    // ---------------- sending ----------------
    function click(id, quiet) {
      const nid = byId.get(id);
      if (nid === undefined) { if (!quiet) log("This version of the game has no '" + id + "' button.", "bad"); return false; }
      return send({ type: "event", nodeId: nid, name: "click", bubbles: true, params: {} });
    }
    function prompt(id, value) {
      const nid = byId.get(id);
      if (nid === undefined) { log("The host prompt is missing from this document.", "bad"); return false; }
      return send({ type: "event", nodeId: nid, name: "prompt", bubbles: true, params: { value } });
    }
    R.cmd = function (name, arg) {
      if (!unlocked) { log("Not unlocked yet.", "bad"); return false; }
      const p = cfg.prefix;
      click(p + "-arg-C", true);
      if (arg !== undefined && arg !== null && arg !== "") {
        const s = String(arg);
        if (!/^[0-9]+$/.test(s)) { log("That needs a whole number.", "bad"); return false; }

      if (!unlocked) { log("Not unlocked yet.", "bad"); return false; }
      return prompt(cfg.promptId, pinIn.value.trim() + " " + text);
    };
    R.serverNow = () => Date.now() + offset;
    R.age = (k) => (R.dataAt[k] ? Date.now() - R.dataAt[k] : 0);

    function hit(b) { b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 160); }
    R.panel = function (parent, title, note) {
      const n = h("span", { class: "note", text: note || "" });

      parent.appendChild(p); p.note = n; return p;

    R.h3 = function (parent, text) { const now = h("span", { class: "now" }); const e = h("h3", null, text, now); parent.appendChild(e); e.now = now; return e; };
    R.note = function (parent, parts) { const p = h("p", { class: "note" }); (Array.isArray(parts) ? parts : [parts]).forEach((x) => p.append(x && x.b ? h("b", { text: x.b }) : x)); parent.appendChild(p); return p; };
    R.grid = function (parent, cls) { const g = h("div", { class: "grid " + (cls || "") }); parent.appendChild(g); return g; };
    // a big button: label + small line. o.cls = b-go / b-stop / b-warn / b-sky / big1, o.confirm = question to ask first
    R.btn = function (parent, label, sub, fn, o) {
      o = o || {};
      const subEl = h("small", { text: sub || "" });
      const b = h("button", { class: "btn " + (o.cls || ""), type: "button", title: o.title }, h("span", { text: label }), sub !== null ? subEl : null);
      b.addEventListener("click", () => {
        if (o.confirm) { const q = typeof o.confirm === "function" ? o.confirm() : o.confirm; if (q && !window.confirm(q)) return; }
        if (fn() !== false) hit(b);
      });
      b.sub = subEl; b.lab = b.firstChild;
      if (parent) parent.appendChild(b);
      return b;
    };
    R.lit = function (b, on) { b.classList.toggle("lit", !!on); };
    R.mini = function (parent, label, fn, o) {
      o = o || {};
      const b = h("button", { class: "mini " + (o.cls || ""), type: "button", text: label, title: o.title });
      b.addEventListener("click", () => { if (o.confirm) { const q = typeof o.confirm === "function" ? o.confirm() : o.confirm; if (q && !window.confirm(q)) return; } if (fn() !== false) hit(b); });
      if (parent) parent.appendChild(b);
      return b;
    };
    // a row of value buttons; the current value is lit. values: [value, label, sub]
    R.choices = function (parent, title, values, fn, fmt) {
      const head = R.h3(parent, title);
      const g = R.grid(parent, "narrow");
      const bs = values.map(([v, label, sub]) => { const b = R.btn(g, label, sub || "", () => fn(v)); b.v = v; return b; });
      return {
        set(cur) {
          let any = false;
          bs.forEach((b) => { const on = b.v === cur; R.lit(b, on); any = any || on; });
          setText(head.now, cur === undefined || cur === null || any ? "" : "now " + (fmt ? fmt(cur) : cur));
        },
      };
    };
    // label  [-]  value  [+]  (with an optional reset)
    R.stepper = function (parent, label, dec, inc, reset, o) {
      o = o || {};
      const val = h("span", { class: "val" });
      const row = h("div", { class: "stepper" }, h("span", { class: "lab", text: label }),
        R.btn(null, "−", null, dec, { cls: o.cls }), val, R.btn(null, "+", null, inc, { cls: o.cls }));
      if (reset) row.appendChild(R.btn(null, "Reset", null, reset));
      if (o.sub) row.appendChild(h("span", { class: "note", style: { margin: 0 }, text: o.sub }));
      parent.appendChild(row);
      return { set(v) { setText(val, v); } };
    };
    R.stats = function (parent, pairs) {
      const box = h("div", { class: "stats" }); const cells = {};
      pairs.forEach(([k, label]) => { const b = h("b", { text: "-" }); cells[k] = b; box.appendChild(h("div", { class: "stat" }, h("span", { text: label }), b)); });
      parent.appendChild(box); return cells;
    };
    R.table = function (parent, heads, emptyText) {
      const tb = h("tbody");
      const empty = h("tr", null, h("td", { colspan: heads.length, class: "empty", text: emptyText || "Nobody yet." }));
      parent.appendChild(h("div", { class: "tablewrap" }, h("table", null, h("thead", null, h("tr", null, heads.map((t) => h("th", { text: t })))), tb)));
      const rows = h("tbody"); // keyed rows live in tb; the empty row is shown when there are none
      return {
        tb, rows,
        render(items, keyOf, create, update) {
          if (!items.length) { if (tb._keyed) { tb._keyed.forEach((r) => r.el.remove()); tb._keyed.clear(); } if (!empty.parentNode) tb.appendChild(empty); return; }
          if (empty.parentNode) empty.remove();
          keyed(tb, items, keyOf, create, update);
        },
      };
    };

    // ---------------- render loop ----------------
    function queueRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; doRender(); }); }

    R.refresh = queueRender;
    setInterval(doRender, 500);
    window.__remote = R;
    cfg.build && cfg.build(R);
    // the log goes last on the right
    const lp = R.panel(R.right, "Log"); lp.appendChild(logEl);
    if (!urlIn.value) log("Paste the wss:// address and press Connect.");
    if (qs.get("url") && qs.get("auto") !== "0" && pinIn.value) connect();
    return R;
  }
})();

      R.btn(g, "START", "deal 5 cards to everyone on a team, 3 minutes", () => R.say("royale start"), { cls: "b-go big1" });
      R.btn(g, "END NOW", "stop the clock and crown the winner", () => R.say("royale stop"), { cls: "b-warn", confirm: "End Mud Royale now?" });
      R.btn(g, "NEW GAME", "clear the board, teams open again", () => R.say("royale open"), { cls: "b-sky" });
      R.btn(g, "EMPTY TEAMS", "everyone has to pick a team again", () => R.say("royale clear"), { cls: "b-sky", confirm: "Empty all four teams?" });
      R.btn(g, "TEAM COUNTS", "how many on each team + squares", () => R.say("royale"), { cls: "b-sky" });
      R.note(p, "Players walk onto a team pad (Gators, Crawdads, Bullfrogs, Catfish) and can switch until you press START. The big board over the middle and each pad show how many players are on each team. After START everyone on a team gets 5 Mudwater cards on the YOUR HAND boards (plus a new card every 10 seconds): click a card, then a square. A higher number beside an enemy card captures it. When the board is full, players upgrade: a card with a higher total can go on top of any card. The game always runs the full 3 minutes; the most squares wins.");

      p = R.panel(R.left, "Mudwater Escape", "game 3 - floor 4, six teams, four rooms each");
      g = R.grid(p);
      R.btn(g, "START", "lock the start doors, the clock starts", () => R.say("escape start"), { cls: "b-go big1" });
      R.btn(g, "NEW GAME", "fresh codes + cards, start doors open again", () => R.say("escape open"), { cls: "b-sky" });
      R.btn(g, "END - OPEN ALL DOORS", "stop the game and let everyone out", () => R.say("escape end"), { cls: "b-warn", confirm: "End Mudwater Escape and open every door?" });
      R.btn(g, "EMPTY TEAMS", "everyone has to pick a door again", () => R.say("escape clear"), { cls: "b-sky", confirm: "Empty all six teams?" });
      R.btn(g, "RAFFLE", "pick a random player from the winning team", () => R.say("escape raffle"), { cls: "b-go" });
      R.btn(g, "PROGRESS", "players + room for every team", () => R.say("escape"), { cls: "b-sky" });
      ui.escNow = R.note(p, "");
      const eg = R.grid(p, "narrow");
      [["red", "#e5533d"], ["gold", "#f2b632"], ["green", "#56d364"], ["blue", "#3d8bfd"], ["purple", "#b06cf0"], ["orange", "#ff8c2e"]].forEach(([k, c]) => {
        const hb = R.btn(eg, "HINT " + k.toUpperCase(), "a visual hint in the room they're in", () => R.say("escape hint " + k), { cls: "b-sky" }); hb.style.borderLeft = "6px solid " + c;
        const sb = R.btn(eg, "SKIP " + k.toUpperCase(), "open their current door (if they're stuck)", () => R.say("escape skip " + k), { cls: "b-warn", confirm: "Skip " + k + "'s current room?" }); sb.style.borderLeft = "6px solid " + c;
      });
      R.note(p, "Players walk in through one of the six coloured doors (three on each side of floor 4, where the lifts and stairs arrive) and can switch until you press START; then the start doors lock. Every door is a code lock (keypad: type the code, press OK; a wrong code locks that keypad for 30 seconds). Rooms: 1 CRITTER SUMS (picture sums in 8 chests, 2 are fake; the painting gives the order) - 2 SWAMP CIPHER (decode the Warden's message with the 6 key pieces from the chests, then count things in the room) - a stair up - 3 WITCH'S EYE (the floating paint only lines up into the 4-digit code from one hidden spot, a different one of 3 each game; nothing marks it) - 4 WARDEN'S RIDDLE (logic puzzle: which stool did each pet sit on). The first team into the VICTORY HALL (upstairs in the middle) wins. You can watch rooms 2 and 4 through the glass from the middle corridor and the Victory Hall. Every team gets different puzzles every game. HINTS: room 1 opens and marks the 2 fake sums; room 2 shows half the message; room 3 puts a beam on the hidden spot for 30 s; room 4 tells one pet's stool (press again for another). SKIP opens their current door.");

      p = R.panel(R.left, "The art wall", "the big canvas in the roof's back-left corner");
      g = R.grid(p);
      R.btn(g, "CLEAR WALL", "wipe all the paint and names", () => R.say("art clear"), { cls: "b-warn", confirm: "Wipe the whole art wall?" });
      R.btn(g, "LOCK WALL", "nobody can paint or sign", () => R.say("art lock"), { cls: "b-sky" });
      R.btn(g, "UNLOCK WALL", "painting allowed again", () => R.say("art unlock"), { cls: "b-go" });
      R.btn(g, "ART WALL CHECK", "shows what the last click on the wall sent", () => R.say("art"), { cls: "b-sky" });
      R.note(p, "Players pick a paint pot on one of the two tables, then click the canvas to paint small dots where they click (the pink block is the eraser; the wall keeps the newest 5000 dots). Names typed at the lectern go on the board along the top.");

      p = R.panel(R.left, "If people lag", "nobody loses progress");
      g = R.grid(p);
      ui.liteB = R.btn(g, "LITE MODE", "drop the decorative pieces", () => R.say(ui.lite ? "lite off" : "lite on"), { cls: "b-sky big1" });
      R.btn(g, "REFRESH", "re-send every sign + effect to everyone", () => R.say("refresh"), { cls: "b-warn big1" });

      p = R.panel(R.left, "The answers", "for you only");
      p.append(h("details", { class: "cheat" }, h("summary", { text: "How the games work" }), h("dl", null,
        h("dt", { text: "Mud Match" }), h("dd", { text: "400 portraits of #62 The Founder along the ramp round the Hall of Fakes. 399 are forgeries: a number, a colour, a letter, the year, the earring... One is real. 4 rounds - the first finder each round is a finalist, and the portraits are reshuffled before every round, so nobody can learn the spot." }),
        h("dt", { text: "The vault" }), h("dd", { text: "100 portraits of #100 Black Flag on ten screens. Only finalists can click them. First correct click wins. Everyone else watches through the glass." }),
        h("dt", { text: "The lifts" }), h("dd", { text: "Players call a cage with the glowing button beside its door, and pick a floor on the brass panel inside. A cage only moves when somebody calls it or presses a floor." }))));

      p = R.panel(R.right, "Players"); ui.pp = p;
      ui.pl = R.table(p, ["#", "Player", "Where", "Hall", "Wait"], "Nobody here yet.");
      R.note(p, ["Players show their guest-book name once they sign the book on the porch. ", { b: "Make finalist" }, " puts someone into the finals by hand; ", { b: "Remove finalist" }, " takes them out (the vault door shuts for them)."]);
    },
    render(R) {
      const G = R.data.game; if (!G) return;
      ui.built = !!G.built; ui.lite = !!G.lite;
      setText(ui.buildB.lab, G.built ? "LIVE BUILD: ON" : "LIVE BUILD: OFF");
      setText(ui.buildB.sub, G.built ? "press to fold back into the placer cube" : "press to raise the whole tower");
      ui.buildB.classList.toggle("build-on", !!G.built); ui.buildB.classList.toggle("build-off", !G.built);
      setText(ui.buildNote, G.built ? "The Spire is up." : "Only the placer cube is in the world. Press LIVE BUILD when it's placed.");
      setText(ui.liteB.lab, G.lite ? "LITE MODE: ON" : "LITE MODE: OFF"); R.lit(ui.liteB, !!G.lite);
      ui.npcMode.set(G.npcMode);
      if (G.esc && ui.escNow) { const E = G.esc; setText(ui.escNow, (E.ph === "live" ? "RUNNING " + Math.floor(E.secs / 60) + ":" + String(E.secs % 60).padStart(2, "0") + " - " : E.ph === "open" ? "DOORS OPEN (joining) - " : "ENDED - ") + E.teams.map((t) => t[0].toUpperCase() + " " + t[2] + "p " + (t[3] > 3 ? "OUT" : "room " + (t[3] + 1))).join(" | ") + (E.order.length ? "   ORDER: " + E.order.join(", ").toUpperCase() : "")); }
      ui.bgm = G.music !== false; setText(ui.musicAllB.lab, ui.bgm ? "MUSIC: ON" : "MUSIC: OFF"); R.lit(ui.musicAllB, ui.bgm); setText(ui.songNow, (ui.bgm && G.song ? "Now playing: " + G.song : "") + (typeof G.musicVol === "number" ? "   -   volume " + G.musicVol + "%" : ""));
      ui.band = G.instruments !== false; setText(ui.bandB.lab, ui.band ? "INSTRUMENTS: ON" : "INSTRUMENTS: OFF"); setText(ui.bandB.sub, ui.band ? "press to stop anyone playing them (trolls)" : "press to let players play again"); R.lit(ui.bandB, !ui.band);
      ui.music = !!G.liftMusic; setText(ui.musicB.lab, G.liftMusic ? "ELEVATOR MUSIC: ON" : "ELEVATOR MUSIC: OFF"); R.lit(ui.musicB, !!G.liftMusic);
      setText(ui.talkNow, (G.talking || []).length ? "Talking now: " + G.talking.map((k) => (NPCLINES.find((x) => x[0] === k) || [0, k])[1]).join(", ") : "");
      const ph = PH[G.ph] || [G.ph || "-", ""];
      setText(ui.phase, G.built ? ph[0] : "NOT BUILT"); ui.phase.className = "chip " + (G.built ? ph[1] : "bad");
      setText(ui.big, G.ph === "hunt" ? clock(G.huntSecs * 1000 + R.age("game")) : G.built ? (G.inside || 0) : (G.online || 0));
      setText(ui.what, G.ph === "hunt" ? "round " + G.round + " of " + (G.rounds || 4) : G.built ? "in the Spire" : "in the world");
      const st = { inside: G.inside || 0, left: G.left !== undefined ? G.left : "-", fin: (G.fin || 0) + " / " + (G.finMax || 4), winner: G.winner || "-" };
      for (const k in ui.st) setText(ui.st[k], st[k]);
      ui.inV = G.inVault || 0; ui.nFin = G.fin || 0;
      setText(ui.finList, ((G.finalists || []).length ? "Finalists: " + G.finalists.map((n, i) => (i + 1) + ". " + n).join("   ") + "   -   inside the glass room: " + ui.inV + " / " + ui.nFin : "No finalists yet.") + (G.ready ? "   -   ALL FOUND: PRESS START THE FINALS" : ""));
      R.lit(ui.finB, !!G.ready); R.lit(ui.nextB, G.ph === "between"); R.lit(ui.autoB, !!G.auto);
      ui.door = !!G.vaultDoor; setText(ui.doorB.lab, ui.door ? "LOCK THE VAULT DOOR" : "OPEN THE VAULT DOOR"); setText(ui.doorB.sub, ui.door ? "the door is OPEN for the finalists - press to lock it for everyone" : "LOCKED for everyone - press to let the finalists (only) in"); R.lit(ui.doorB, ui.door);
      const fk = (G.finIds || []).join(",") + "|" + (G.finalists || []).join(",");
      if (fk !== ui.finKeys) { ui.finKeys = fk; ui.finBox.textContent = ""; (G.finIds || []).forEach((pid, i) => R.btn(ui.finBox, "REMOVE " + (G.finalists[i] || "#" + pid), "take them out of the finals", () => R.say("hall unfinalist " + pid), { cls: "b-stop", confirm: "Take " + (G.finalists[i] || "#" + pid) + " out of the finals?" })); }
      setText(ui.intr, (G.intruders || []).length ? "NOT A FINALIST BUT INSIDE THE GLASS ROOM: " + G.intruders.join(", ") + " - they can't pick anything, but you may want to ask them to leave." : "");
      setText(ui.autoB.lab, G.auto ? "AUTO NEXT ROUND: ON" : "AUTO NEXT ROUND: OFF");
      setText(ui.nextB.sub, G.ph === "between" ? (G.nextIn >= 0 ? "round " + (G.round + 1) + " starts by itself in " + G.nextIn + " s - or press now" : "round " + (G.round + 1) + " is waiting for you") : G.ph === "hunt" ? "round " + G.round + " of " + (G.rounds || 4) + " is on" : "skip the countdown - start the next round");
      const Ls = G.lifts || {};
      for (const id in ui.liftCards) { const s = Ls[id]; setText(ui.liftCards[id], s ? (s.busy && !s.open ? "moving" : "at the " + (FLOOR[s.at] || s.at) + (s.open ? ", doors open" : "")) + (s.req.length ? " - called to " + s.req.map((k) => FLOOR[k]).join(", ") : "") : "-"); }
      // (v55, owner: "I am the only person in the building and yet my remote says there are 8 other players") the count now says how
      // many are actually in the building; connections the game has never seen near the building (other people elsewhere in the
      // Otherside world, or extra connections) are listed last as "never seen here"
      const PA = R.data.players || [], seen = PA.filter((q) => q[2] !== "?"), P = seen.concat(PA.filter((q) => q[2] === "?")), ghosts = PA.length - seen.length;
      setText(ui.pp.note, (G.inside || 0) + " in the building" + (ghosts ? "  -  " + ghosts + " more connected but never seen here" : ""));
      ui.pl.render(P, (q) => q[0], () => {
        const r = { el: h("tr"), id: h("td", { class: "num" }), nm: h("td"), z: h("td"), hall: h("td", { class: "hero" }), w: h("td", { class: "num" }), a: h("td") };
        r.fb = R.mini(r.a, "Make finalist", () => R.say(r.fin ? "hall unfinalist " + r.pid : "finalist " + r.pid), { confirm: () => (r.fin ? "Take this player OUT of the finals?" : "Put this player into the finals?") });
        r.el.append(r.id, r.nm, r.z, r.hall, r.w, r.a); return r;
      }, (r, q) => {
        r.pid = q[0]; setText(r.id, "#" + q[0]); setText(r.nm, q[1]); setText(r.z, ZONE[q[2]] || q[2]);
        setText(r.hall, q[5] ? "CHAMPION" : q[3] ? "FINALIST" : ""); setText(r.w, q[4] ? q[4] + " s" : "");
        r.fin = !!q[3]; if (r.fb) setText(r.fb, r.fin ? "Remove finalist" : "Make finalist");
      });
    },
  });
})();
</script>
