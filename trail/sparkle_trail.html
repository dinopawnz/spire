<!--
  SPARKLE TRAIL  v5  -  Otherside MML
  The ORIGINAL look (glowing rainbow ribbon full of twinkling stars + the golden swirl with orbiting stars at your feet), now it bends
  along the exact path you walk and the end of it melts away after about a second.

  HOW IT FOLLOWS YOU: Otherside tells a build every spot you step on when you walk on something the build owns, so this lays a big
  INVISIBLE FLOOR (100 x 100 m) where you place it. Place it on flat ground.
  Click the glowing star in the middle -> the trail is yours. Click again to change colour: rainbow -> gold -> ice -> rose -> off.

  LIGHT ON THE WORLD: every picture is loaded once at the start and reused (nothing pops in), the trail only updates when you've moved,
  at most 4 times a second, and sends nothing at all while you stand still.
  PLACE ONLY ONE COPY: every copy you place follows you separately - remove old copies and older versions first.
-->
<m-group id="root"></m-group>

<script>
  const BASE = "https://raw.githubusercontent.com/dinopawnz/spire/handoff-v14/trail/";
  const VER = "?v=5";
  const ROOT = document.getElementById("root");
  const SIZE = 100;                // invisible floor, metres each way
  const LIFE = 1100;               // how long each piece of trail lasts before it has melted away (ms)
  const NPIECE = 8;                // ribbon pieces kept loaded and reused round and round
  const MOVE = 0.35;               // a new piece once you've moved this far (m)
  const GLIDE = 260;               // the swirl glides to each new spot over this long (ms)
  const COLOURS = ["rainbow", "gold", "ice", "rose"];
  let owner = null, colour = -1, steps = 0, noPos = 0, at = null, pieceI = 0, rigAnims = [];

  const r3 = (v) => Math.round(v * 1000) / 1000;
  const T0 = Date.now();
  const now = () => { try { if (document.timeline && typeof document.timeline.currentTime === "number") return document.timeline.currentTime; } catch (e) {} return Date.now() - T0; };
  function el(tag, attrs, parent) {
    const n = document.createElement(tag);
    for (const k in attrs) n.setAttribute(k, typeof attrs[k] === "number" ? String(r3(attrs[k])) : String(attrs[k]));
    (parent || ROOT).appendChild(n);
    return n;
  }
  function loop(target, attr, a, b, ms, opts) {
    const o = opts || {};
    const x = { attr, start: a, end: b, duration: Math.round(ms), loop: "true" };
    if (o.pingPong) x["ping-pong"] = "true";
    if (o.easing) x.easing = o.easing;
    if (o.delay) x["start-time"] = -Math.round(o.delay);
    return el("m-attr-anim", x, target);
  }
  function once(target, attr, a, b, ms, easing) {        // a one-off animation starting right now
    const x = { attr, start: r3(a), end: r3(b), duration: Math.round(ms), "start-time": Math.round(now()) };
    if (easing) x.easing = easing;
    return el("m-attr-anim", x, target);
  }
  const pic = (name) => BASE + name + ".png" + VER;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const col = () => COLOURS[Math.max(0, colour)];
  const IMG = { collide: "false", "cast-shadows": "false" };

  // ---------------- the invisible floor that feels your footsteps
  const floor = el("m-cube", { y: -0.05, width: SIZE, height: 0.1, depth: SIZE, color: "#000000", visible: "false", collide: "true", "collision-interval": 250, "cast-shadows": "false" });

  // ---------------- ribbon pieces, each full of twinkling stars (loaded once, reused). A piece "melts" by shrinking to nothing,
  // which takes its stars with it - so one set of 3 shrink animations per step does the whole job.
  const PIECES = [];
  for (let i = 0; i < NPIECE; i++) {
    const g = el("m-group", { y: -50 });                       // parked out of sight until first used
    const melt = el("m-group", { sx: 0, sy: 0, sz: 0 }, g);
    const a = el("m-group", { y: 0.3, ry: 90 }, melt), b = el("m-group", { y: 0.58, ry: 90 }, melt);
    const imgs = [el("m-image", Object.assign({ width: 1.6, height: 1.0, rx: -90, emissive: 1.3 }, IMG), a),
                  el("m-image", Object.assign({ width: 1.6, height: 0.62, emissive: 1.3 }, IMG), b)];
    const stars = [];
    for (let k = 0; k < 3; k++) {                              // stars bobbing and twinkling inside the piece
      const s = el("m-group", { x: rnd(-0.35, 0.35), z: rnd(-0.6, 0.6) }, melt);
      loop(s, "y", rnd(0.15, 0.4), rnd(0.6, 1.0), rnd(700, 1200), { pingPong: true, easing: "easeInOutSine", delay: rnd(0, 1200) });
      const tw = el("m-group", {}, s); const sc = rnd(0.7, 1.2);
      loop(tw, "sx", sc * 0.45, sc, rnd(250, 500), { pingPong: true, delay: rnd(0, 500) });
      loop(tw, "sy", sc * 0.45, sc, rnd(250, 500), { pingPong: true, delay: rnd(0, 500) });
      [0, 90].forEach((ry) => stars.push(el("m-image", Object.assign({ width: 0.3, height: 0.3, ry, emissive: 2 }, IMG), tw)));
    }
    PIECES.push({ g, melt, imgs, stars, anims: [], k: i % 8 });
  }

  // ---------------- the golden swirl at your feet, with stars circling round you (the original)
  const rig = el("m-group", { visible: "false" });
  const feet = el("m-group", { y: 0.04 }, rig);
  const swirl = el("m-group", {}, feet); loop(swirl, "ry", 0, 360, 4000);
  el("m-image", Object.assign({ src: pic("swirl"), width: 1.5, height: 1.5, rx: -90, emissive: 1.2 }, IMG), swirl);
  const orbit = el("m-group", {}, feet); loop(orbit, "ry", 360, 0, 3200);
  const orbitStars = [];
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3, g = el("m-group", { x: Math.sin(a) * 0.6, z: Math.cos(a) * 0.6 }, orbit);
    loop(g, "y", 0.1, 0.9, rnd(1000, 1500), { pingPong: true, easing: "easeInOutSine", delay: k * 250 });
    [0, 90].forEach((ry) => orbitStars.push(el("m-image", Object.assign({ src: pic("star_gold"), width: 0.22, height: 0.22, ry, emissive: 2 }, IMG), g)));
  }

  // ---------------- the star you click (in the middle of where you placed it)
  const hub = el("m-group", { y: 1.2 });
  const spin = el("m-group", {}, hub); loop(spin, "ry", 0, 360, 5000);
  const hubPics = [0, 90].map((ry) => el("m-image", Object.assign({ width: 0.7, height: 0.7, ry, emissive: 2 }, IMG), spin));
  const hubHit = el("m-cube", { width: 0.8, height: 0.8, depth: 0.8, color: "#ffffff", opacity: 0, collide: "false", "cast-shadows": "false" }, hub);
  const sign = el("m-label", Object.assign({ y: 0.8, width: 2.8, height: 0.45, "font-size": 18, alignment: "center", color: "#1a1030", "font-color": "#ffe6a8", emissive: 0.4, content: "CLICK THE STAR FOR SPARKLES" }, IMG), hub);
  const setSign = () => sign.setAttribute("content", owner === null ? "CLICK THE STAR FOR SPARKLES" : "SPARKLES ON (" + col().toUpperCase() + ") - STEPS FELT: " + steps + (noPos ? " (" + noPos + " WITHOUT A SPOT)" : ""));

  function paint() {    // put the current colour's pictures on everything (only when the colour changes)
    const c = col();
    PIECES.forEach((p) => { p.imgs.forEach((im) => im.setAttribute("src", pic("piece_" + c + "_" + p.k))); p.stars.forEach((s) => s.setAttribute("src", pic("star_" + c))); });
    orbitStars.forEach((s) => s.setAttribute("src", pic("star_" + (c === "gold" ? "rainbow" : "gold"))));
    hubPics.forEach((p) => p.setAttribute("src", pic("star_" + (colour < 0 ? "gold" : c))));
  }
  paint();

  hubHit.addEventListener("click", (e) => {
    const id = e.detail && e.detail.connectionId;
    if (id === undefined) return;
    if (id !== owner) { owner = id; colour = Math.max(colour, 0); steps = 0; noPos = 0; }
    else { colour++; if (colour >= COLOURS.length) { owner = null; colour = -1; rig.setAttribute("visible", "false"); at = null; } }
    paint(); setSign();
  });

  // ---------------- a new piece of ribbon from where you were to where you are, then it melts away
  function piece(a, b) {
    const p = PIECES[pieceI]; pieceI = (pieceI + 1) % NPIECE;
    const dx = b.x - a.x, dz = b.z - a.z, len = Math.min(Math.hypot(dx, dz), 4) + 0.6;   // a little overlap so the pieces join up
    p.g.setAttribute("x", r3((a.x + b.x) / 2)); p.g.setAttribute("y", r3((a.y + b.y) / 2)); p.g.setAttribute("z", r3((a.z + b.z) / 2));
    p.g.setAttribute("ry", r3(Math.atan2(dx, dz) * 180 / Math.PI));
    p.imgs.forEach((im) => im.setAttribute("width", r3(len)));
    const fresh = [once(p.melt, "sx", 1, 0, LIFE, "easeInQuad"), once(p.melt, "sy", 1, 0, LIFE, "easeInQuad"), once(p.melt, "sz", 1, 0.3, LIFE, "easeInQuad")];
    const old = p.anims; p.anims = fresh; old.forEach((x) => x.remove());          // new on first, then old off
  }

  // ---------------- the swirl glides after you; each step leaves a piece of ribbon behind
  function follow(p) {
    if (at && Math.hypot(p.x - at.x, p.z - at.z) < MOVE) return;     // standing still = nothing sent at all
    if (!at) { at = p; rig.setAttribute("x", r3(p.x)); rig.setAttribute("y", r3(p.y)); rig.setAttribute("z", r3(p.z)); rig.setAttribute("visible", "true"); return; }
    const from = at; at = p;
    if (Math.hypot(p.x - from.x, p.z - from.z) < 8) piece(from, p);   // (a huge jump, like a teleport, doesn't draw a giant streak)
    const fresh = [once(rig, "x", from.x, p.x, GLIDE), once(rig, "z", from.z, p.z, GLIDE)];
    rigAnims.forEach((x) => x.remove()); rigAnims = fresh;
    setTimeout(() => { if (at === p) { rig.setAttribute("x", r3(p.x)); rig.setAttribute("z", r3(p.z)); rig.setAttribute("y", r3(p.y)); } }, GLIDE + 20);
  }

  // ---------------- footsteps
  function stepped(id, e) {
    if (owner === null || id !== owner) return;
    const d = e && e.detail; if (!d) return;
    steps++; if (steps % 20 === 1) setSign();
    const q = d.position || (d.elementRelative && d.elementRelative.position) || (d.documentRelative && d.documentRelative.position);
    if (!q || typeof q.x !== "number" || isNaN(q.x)) { noPos++; if (noPos % 20 === 1) setSign(); return; }
    follow({ x: q.x, y: Math.max(0, q.y), z: q.z });
  }
  ["collisionstart", "collisionmove"].forEach((ev) => floor.addEventListener(ev, (e) => stepped(e.detail && e.detail.connectionId, e)));
  window.addEventListener("disconnected", (e) => { if (e.detail && e.detail.connectionId === owner) { owner = null; colour = -1; rig.setAttribute("visible", "false"); at = null; paint(); setSign(); } });
</script>
