<!--
  SPARKLE TRAIL  v2  -  Otherside MML
  Otherside doesn't tell a build where players are, but it DOES tell it every spot a player steps on when they walk on something the
  build owns. So this build lays a big INVISIBLE FLOOR (100 x 100 m) right on the ground where you place it, and leaves sparkles
  wherever you step on it, with a golden swirl that follows your feet.

  HOW TO USE: place it on flat ground. Click the glowing star in the middle -> the sparkles follow YOU.
  Click the star again to change colour (rainbow -> gold -> ice -> rose -> off). Whoever clicked last owns the trail.
  The little sign over the star says whether it is getting your footsteps (handy for testing).
-->
<m-group id="root"></m-group>

<script>
  const BASE = "https://raw.githubusercontent.com/dinopawnz/spire/handoff-v14/trail/";
  const VER = "?v=2";
  const ROOT = document.getElementById("root");
  const SIZE = 100;                   // invisible floor, metres each way
  const LIFE = 1600;                  // how long each sparkle lasts (ms)
  const COLOURS = ["rainbow", "gold", "ice", "rose"];
  let owner = null, colour = -1, steps = 0, noPos = 0, last = null, lastDrop = null, swirlAt = null, swirlAnims = [];

  const r3 = (v) => Math.round(v * 1000) / 1000;
  const T0 = Date.now();
  const now = () => { try { if (document.timeline && typeof document.timeline.currentTime === "number") return document.timeline.currentTime; } catch (e) {} return Date.now() - T0; };
  function el(tag, attrs, parent) {
    const n = document.createElement(tag);
    for (const k in attrs) n.setAttribute(k, typeof attrs[k] === "number" ? String(r3(attrs[k])) : String(attrs[k]));
    (parent || ROOT).appendChild(n);
    return n;
  }
  function once(target, attr, a, b, ms, easing) {      // a one-off animation starting right now
    const x = { attr, start: a, end: b, duration: Math.round(ms), "start-time": Math.round(now()) };
    if (easing) x.easing = easing;
    return el("m-attr-anim", x, target);
  }
  function loop(target, attr, a, b, ms, pingPong, delay) {
    const x = { attr, start: a, end: b, duration: Math.round(ms), loop: "true" };
    if (pingPong) { x["ping-pong"] = "true"; x.easing = "easeInOutSine"; }
    if (delay) x["start-time"] = -Math.round(delay);
    return el("m-attr-anim", x, target);
  }
  const pic = (name) => BASE + name + ".png" + VER;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const col = () => COLOURS[Math.max(0, colour)];

  // ---------------- the invisible floor that feels your footsteps
  const floor = el("m-cube", { y: -0.05, width: SIZE, height: 0.1, depth: SIZE, color: "#000000", visible: "false", collide: "true", "collision-interval": 100, "cast-shadows": "false" });

  // ---------------- the star you click (in the middle of where you placed it)
  const hub = el("m-group", { y: 1.2 });
  const spin = el("m-group", {}, hub); loop(spin, "ry", 0, 360, 5000);
  const hubPics = [0, 90].map((ry) => el("m-image", { src: pic("star_gold"), width: 0.7, height: 0.7, ry, emissive: 2, collide: "false", "cast-shadows": "false" }, spin));
  const hubHit = el("m-cube", { width: 0.8, height: 0.8, depth: 0.8, color: "#ffffff", opacity: 0, collide: "false", "cast-shadows": "false" }, hub);
  const sign = el("m-label", { y: 0.8, width: 2.6, height: 0.45, "font-size": 18, alignment: "center", color: "#1a1030", "font-color": "#ffe6a8", emissive: 0.4, collide: "false", content: "CLICK THE STAR FOR SPARKLES" }, hub);
  const setSign = () => sign.setAttribute("content", owner === null ? "CLICK THE STAR FOR SPARKLES" : "SPARKLES ON (" + col().toUpperCase() + ") - STEPS FELT: " + steps + (noPos ? " (" + noPos + " WITHOUT A SPOT)" : ""));

  hubHit.addEventListener("click", (e) => {
    const id = e.detail && e.detail.connectionId;
    if (id === undefined) return;
    if (id !== owner) { owner = id; colour = 0; steps = 0; noPos = 0; last = null; lastDrop = null; }
    else { colour++; if (colour >= COLOURS.length) { owner = null; colour = -1; hideSwirl(); } }
    hubPics.forEach((p) => p.setAttribute("src", pic("star_" + col())));
    setSign();
  });

  // ---------------- the golden swirl that follows your feet
  const swirl = el("m-group", { y: 0.06, visible: "false" });
  const sw = el("m-group", {}, swirl); loop(sw, "ry", 0, 360, 4000);
  el("m-image", { src: pic("swirl"), width: 1.4, height: 1.4, rx: -90, emissive: 1.2, collide: "false", "cast-shadows": "false" }, sw);
  const orbit = el("m-group", {}, swirl); loop(orbit, "ry", 360, 0, 3200);
  for (let k = 0; k < 5; k++) {
    const a = k * Math.PI * 2 / 5, g = el("m-group", { x: Math.sin(a) * 0.55, z: Math.cos(a) * 0.55 }, orbit);
    loop(g, "y", 0.1, 0.9, rnd(1000, 1500), true, k * 250);
    [0, 90].forEach((ry) => el("m-image", { src: pic("star_gold"), width: 0.2, height: 0.2, ry, emissive: 2, collide: "false", "cast-shadows": "false" }, g));
  }
  function hideSwirl() { swirl.setAttribute("visible", "false"); swirlAt = null; }
  function moveSwirl(p) {
    if (!swirlAt) { swirlAt = p; ["x", "y", "z"].forEach((k) => swirl.setAttribute(k, r3(p[k] + (k === "y" ? 0.06 : 0)))); swirl.setAttribute("visible", "true"); return; }
    const from = swirlAt; swirlAt = p;
    // glide from the last spot to the new one (new animation added before the old one is removed, so it never jumps)
    const fresh = ["x", "z"].map((k) => once(swirl, k, r3(from[k]), r3(p[k]), 120));
    swirlAnims.forEach((a) => a.remove()); swirlAnims = fresh;
    setTimeout(() => { if (swirlAt === p) { swirl.setAttribute("x", r3(p.x)); swirl.setAttribute("z", r3(p.z)); swirl.setAttribute("y", r3(p.y + 0.06)); } }, 130);
  }

  // ---------------- a puff of sparkles left where you stepped, fading away
  function drop(p) {
    const g = el("m-group", { x: p.x, y: p.y, z: p.z });
    const glow = el("m-image", { src: pic("star_" + col()), width: 1.1, height: 1.1, y: 0.08, rx: -90, ry: rnd(0, 360), emissive: 1.6, collide: "false", "cast-shadows": "false" }, g);
    once(glow, "opacity", 0.9, 0, LIFE);
    for (let k = 0; k < 3; k++) {
      const s = el("m-group", { x: rnd(-0.35, 0.35), z: rnd(-0.35, 0.35), y: rnd(0.2, 0.6) }, g);
      once(s, "y", rnd(0.2, 0.6), rnd(1.0, 1.8), LIFE, "easeOutSine");
      [0, 90].forEach((ry) => { const im = el("m-image", { src: pic("star_" + col()), width: 0.26, height: 0.26, ry, emissive: 2, collide: "false", "cast-shadows": "false" }, s); once(im, "opacity", 1, 0, LIFE); });
    }
    setTimeout(() => g.remove(), LIFE + 100);
  }

  // ---------------- footsteps
  function stepped(id, e) {
    if (owner === null || id !== owner) return;
    const d = e && e.detail; if (!d) return;
    steps++; if (steps % 10 === 1) setSign();
    const q = d.position || (d.elementRelative && d.elementRelative.position) || (d.documentRelative && d.documentRelative.position);
    if (!q || typeof q.x !== "number" || isNaN(q.x)) { noPos++; if (noPos % 10 === 1) setSign(); return; }
    const p = { x: q.x, y: Math.max(0, q.y), z: q.z };
    moveSwirl(p);
    if (!lastDrop || Math.hypot(p.x - lastDrop.x, p.z - lastDrop.z) > 0.35) { drop(p); lastDrop = p; }
    last = p;
  }
  ["collisionstart", "collisionmove"].forEach((ev) => floor.addEventListener(ev, (e) => stepped(e.detail && e.detail.connectionId, e)));
  floor.addEventListener("collisionend", (e) => { if (e.detail && e.detail.connectionId === owner) hideSwirl(); });

  // backup: if Otherside ever reports positions the normal way, use those too
  const probe = el("m-position-probe", { range: SIZE / 2, interval: 150 });
  ["positionenter", "positionmove"].forEach((ev) => probe.addEventListener(ev, (e) => {
    const d = e.detail; if (!d) return;
    const q = (d.documentRelative && d.documentRelative.position) || d.position;
    if (q) stepped(d.connectionId, { detail: { position: { x: q.x, y: q.y, z: q.z } } });
  }));
  window.addEventListener("disconnected", (e) => { if (e.detail && e.detail.connectionId === owner) { owner = null; colour = -1; hideSwirl(); setSign(); } });
</script>
