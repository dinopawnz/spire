          }
          ball.x = b.on ? b.x : ball.x; ball.z = b.on ? b.z : ball.z;

        S.drops.forEach(([t, n]) => later(LEAD + t * 1000 + 40, () => { const el_ = T.balls[n].el; tween(el_, "y", FY, FY - 0.16, 220, "easeInQuad"); later(260, () => el_.setAttribute("visible", "false")); }));
        let lastS = -1, cnt = 0;
        const wx = Number(T.g.getAttribute("x")), wz = Number(T.g.getAttribute("z")), wy = Number(T.g.getAttribute("y")) + FY;
        S.snd.forEach(([t, f, v]) => { if (cnt > 14 || t - lastS < 0.06 || v < 0.08) return; lastS = t; cnt++; later(LEAD + t * 1000, () => sfx(f + ".mp3", wx, wy, wz, 0.4 + 0.6 * v)); });
        later(LEAD + S.T * 1000 + 350, () => {

    // ---------------------------------------------------- THE POND: frogs croak now and then (throat puffs, a little bounce) and hop round

    const POND = { frogs: [], last: new Map() };

    function frogCroak(fr) {

      tween(fr.body, "y", 0, 0.55, 260, "easeOutQuad"); later(270, () => tween(fr.body, "y", 0.55, 0, 300, "easeInQuad"));

    // ---------------------------------------------------- THE OWNER'S KODAS: lounging in the armchairs, a beer at the bar, strolling round
    // the island bar. Each GLB carries its own looping clip (sit / bar / walk); walkers ride a slowly turning group round the bar.
    const WALKERS = [];
    (D.kodas || []).forEach(([f, x, y, z, ry, s, r, lap], i) => {

      if (!r) { model(f + ".glb", a, el("m-group", { x, y, z, ry })); return; }

    // CELEBRATE (host remote): warm firework bursts over the roof terrace for the finale photo
    // (v55, owner: "those are the absolute worst fireworks... add real fireworks. the coolest looking fireworks you can find... remove the
    // sound") a real 30-second show over the roof, SILENT (the jazz plays on). Each shell: a rocket climbs on a spark with a tail, a
    // white flash, then the burst (one glowing model of hundreds of light streaks: peony, chrysanthemum, willow, ring, palm) grows out of
    // a point, droops and dims under gravity (stage _b) and ends as glittering embers (stage _c). Volleys of 1-3, then a big finale.
    const FW_HEAD = { red: "#ffd0a0", blue: "#d8ecff", green: "#e0ffd8", purple: "#ffd8ff", teal: "#d8fffa", gold: "#fff2c0", pink: "#ffe0f0" };
    let FW_TOK = 0; const FWG = el("m-group", {}); FWG._global = true;      // fireworks: seen from everywhere
    function fwShell(name, bx, by, bz, delay, tok) {
      const Y = D.L.roof, A = (n, attr, a, b, ms, ease) => el("m-attr-anim", { attr, start: r3(a), end: r3(b), duration: Math.round(ms), loop: "false", easing: ease || "linear", "start-time": Math.round(now()) }, n);
      later(delay, () => {

        const rk = el("m-group", { x: x0, y: Y + 3, z: bz }, FWG); model("fw_rocket.glb", { collide: "false" }, rk);
        A(rk, "y", Y + 3, by, climb, "easeOutQuad"); A(rk, "x", x0, bx, climb, "easeOutQuad");
        later(climb, () => {
          rk.remove(); if (tok !== FW_TOK) return;
          const kind = name.split("_")[1], col = name.split("_")[2], wil = kind === "willow";
          const g = el("m-group", { x: bx, y: by, z: bz, ry: Math.random() * 360, rx: kind === "ring" ? 35 + Math.random() * 40 : (Math.random() - 0.5) * 16 }, FWG);
          const fl = el("m-sphere", { radius: 0.6, color: FW_HEAD[col] || "#ffffff", emissive: 10, opacity: 1, collide: "false", "cast-shadows": "false" }, g);
          A(fl, "radius", 0.6, 3.2, 260, "easeOutQuad"); A(fl, "opacity", 1, 0, 300, "easeInQuad"); later(320, () => fl.remove());
          const sz = 1.4 + Math.random() * 0.7, s = el("m-group", { sx: 0.05, sy: 0.05, sz: 0.05 }, g);           // 28-42 m across
          ["sx", "sy", "sz"].forEach((k) => A(s, k, 0.05 * sz, sz, 1100, "easeOutCubic"));
          A(g, "y", by, by - (wil ? 4 : 2.5), wil ? 5600 : 4000, "easeInQuad");
          let cur = model(name + "_a.glb", { collide: "false" }, s);
          const swap = (st, t) => later(t, () => { const n = model(name + "_" + st + ".glb", { collide: "false" }, s); const old = cur; cur = n; later(120, () => old.remove()); });

    function fwPreload(ms, id) {

      const spot = () => [(Math.random() - 0.5) * 140, Y + 36 + Math.random() * 26, -10 + (Math.random() - 0.5) * 120];      // all round the tower, high over the roof

        for (let i = 0; i < n; i++) { const [x, y, z] = spot(); fwShell(Math.random() < 0.6 ? nm : pick(), x, y, z, T0 + t + i * 180, tok); }

        anim(im, "emissive", 1.2, 2.0, Math.round(per * 0.77), { pingPong: true, easing: "easeInOutSine", delay: i * 71 });
      });

        const e = el("m-sphere", { x: -0.6 + 1.2 * ((k * 37) % 10) / 10, y: 0.3, z: -0.1 + 0.2 * ((k * 53) % 10) / 10, radius: 0.025, color: "#ff8a2a", emissive: 5, collide: "false", "cast-shadows": "false", "data-lite": "1" }, fg);

        const finals = H.ph === "finals" || H.ph === "done";
        return { roy: RY.on ? RY.status() : "", esc: ES.on && ES.info ? ES.info() : null, ph: H.ph, left: finals ? VT.length - H.vremoved.size : HL.length - H.removed.size, fin: H.fin.length, finMax: FINALISTS,
                 finalists: H.fin.map((id) => nameOf(pl(id))), ready: H.ph === "allfound", round: H.round, rounds: FINALISTS, auto: H.auto, nextIn: H.ph === "between" && H.nextAt ? Math.max(0, Math.ceil((H.nextAt - tn) / 1000)) : -1, inVault: H.fin.filter((id) => inVaultRoom(pl(id))).length, vaultDoor: H.doorOpen, vaultDoorAll: H.doorAll, finIds: H.fin.slice(), intruders: Array.from(ONLINE).filter((id) => !pl(id).fin && inVaultRoom(pl(id))).map((id) => nameOf(pl(id))), winner: H.winner !== null ? nameOf(pl(H.winner)) : "",
                 huntSecs: H.t0 ? Math.round((tn - H.t0) / 1000) : 0, inside: INSIDE.size, ruN: RU.size, frontDoor: FD.open, boats: BT ? { where: boatWhere(), state: BOAT.state, aboard: BOAT.boats.map((b) => b.on.size), stay: BOAT.stay } : null, npcMode: NPC_MODE,
                 talking: Object.values(NPCS).filter((n) => n.talking).map((n) => n.key), liftMusic: Object.values(LIFTS).some((s) => s.music.parentNode), instruments: BAND.on, music: MUSIC.on, song: MUSIC.title, musicVol: MUSIC.pct,
                 lifts: Object.fromEntries(Object.entries(LIFTS).map(([k, s]) => [k, s.status()])) };
      },
      players(tn) {
        return Array.from(ONLINE).map((id) => { const p = pl(id); return [id, nameOf(p), zoneOf(p), p.fin ? 1 : 0, Math.max(0, Math.ceil((p.lock - tn) / 1000)), H.winner === id ? 1 : 0]; });
      },
      command(cmd, rest, parts) {
        const a1 = (parts[1] || "").toLowerCase();
        if (cmd === "celebrate") return celebrate();
        if (cmd === "royale") {                                       // royale open | start | stop | clear | (status)
          if (!RY.on) return "NO MUD ROYALE IN THIS BUILD";
          if (a1 === "open" || a1 === "reset") return RY.open();
          if (a1 === "start") return RY.start();
          if (a1 === "stop" || a1 === "end") return RY.end();
          if (a1 === "clear") return RY.clear();
          if (a1 === "demo") return RY.demo();
          if (a1 === "pads" || a1 === "refresh") return RY.pads();
          return RY.status();
        }
        if (cmd === "escape") {                                       // escape open | start | end | reset | clear | hint <team> | skip <team> | raffle
          if (!ES.on) return "NO MUDWATER ESCAPE IN THIS BUILD";
          const a2 = (parts[2] || "").toLowerCase();
          if (a1 === "open" || a1 === "reset") return ES.open();
          if (a1 === "start") return ES.start();
          if (a1 === "stop" || a1 === "end") return ES.end();
          if (a1 === "clear") return ES.clear();
          if (a1 === "raffle") return ES.raffle();
          if (a1 === "hint" || a1 === "skip") { const k = ES.teamArg(a2); if (k < 0) return "WHICH TEAM? (RED GOLD GREEN BLUE PURPLE ORANGE)"; return a1 === "hint" ? ES.hint(k) : ES.skip(k); }
          return ES.status();
        }
        if (cmd === "art") {                                          // art clear | art lock | art unlock
          if (!ART.on) return "NO ART WALL IN THIS BUILD";
          if (a1 === "clear") { ART.clear(); return "ART WALL WIPED CLEAN - ALL NAMES TAKEN OFF"; }
          if (a1 === "lock") { ART.locked = true; return "ART WALL LOCKED - NO NEW NAMES GO ON IT"; }
          if (a1 === "unlock") { ART.locked = false; return "ART WALL OPEN - NEW NAMES GO ON IT AGAIN"; }
          return "ART WALL: " + (ART.list ? ART.list.length : 0) + " OF 100 NAMES PAINTED" + (ART.locked ? " (LOCKED - NO NEW NAMES)" : "") + (ART.list && ART.list.length ? " | NEWEST: " + ART.list.slice(-3).map((e) => e.name + " (" + e.font + ")").join(", ") : "");
        }
        if (cmd === "pool") { POOL.forEach((T) => { T.busy = false; POOL.rack(T); }); return "BOTH POOL TABLES RACKED"; }
        if (cmd === "music" && (a1 === "vol" || a1 === "volume" || a1 === "up" || a1 === "down" || a1 === "louder" || a1 === "softer")) {
          const v = parseFloat(parts[2]); const p = a1 === "up" || a1 === "louder" ? MUSIC.pct + 10 : a1 === "down" || a1 === "softer" ? MUSIC.pct - 10 : isNaN(v) ? MUSIC.pct : v;
          return "MUSIC VOLUME " + musicVol(p) + "%";
        }
        if (cmd === "music") {
          if (a1 === "next" || a1 === "skip") { musicSkip(); return "NOW PLAYING: " + MUSIC.title.toUpperCase(); }
          musicSet(a1 === "on" ? true : a1 === "off" ? false : !MUSIC.on); return MUSIC.on ? "MUSIC ON - " + MUSIC.title.toUpperCase() : "MUSIC OFF";
        }
        if (cmd === "instruments") { BAND.on = a1 === "on" ? true : a1 === "off" ? false : !BAND.on; return BAND.on ? "INSTRUMENTS ON - ANYONE ON THE STAGE CAN PLAY" : "INSTRUMENTS OFF - NOBODY CAN PLAY THEM"; }
        if (cmd === "hall") {
          if (a1 === "open" || a1 === "start") return hallOpen();
          if (a1 === "thin") return thin();
          if (a1 === "next") return nextRound();
          if (a1 === "auto") { const v = (parts[2] || "").toLowerCase(); H.auto = v === "on" ? true : v === "off" ? false : !H.auto;
            if (H.ph === "between") { if (H.auto && !H.nextAt) armNext(); if (!H.auto) { H.nextAt = 0; H.tok++; setCounter(); } }
            return "NEXT ROUND: " + (H.auto ? "STARTS BY ITSELF AFTER " + ROUND_GAP_MS / 1000 + " SECONDS" : "WAITS FOR YOU (PRESS NEXT ROUND)"); }
          if (a1 === "finals") return startFinals();
          if (a1 === "door") {                                        // hall door open | close | all
            const v = (parts[2] || "").toLowerCase();
            if (v === "all" || v === "everyone") { H.doorAll = true; H.doorOpen = true; doorFix(); return "VAULT DOOR OPEN FOR EVERYONE - THE GLASS DOOR AND ITS WALL ARE GONE (PRESS LOCK TO PUT IT BACK)"; }
            H.doorAll = false; H.doorOpen = v === "open" ? true : v === "close" || v === "lock" ? false : !H.doorOpen; doorFix();
            return H.doorOpen ? "VAULT DOOR OPEN FOR THE " + H.fin.length + " FINALISTS ONLY (" + H.fin.map((i) => nameOf(pl(i))).join(", ") + ")" : "VAULT DOOR LOCKED FOR EVERYONE";
          }
          if (a1 === "unfinalist") {                                  // hall unfinalist <id>
            const id = +parts[2], i = H.fin.indexOf(id); if (i < 0) return "#" + parts[2] + " IS NOT A FINALIST";
            H.fin.splice(i, 1); pl(id).fin = false; doorFix(); boards(); if (H.ph === "allfound" && H.fin.length < FINALISTS) H.ph = "between";
            return nameOf(pl(id)).toUpperCase() + " IS NO LONGER A FINALIST";
          }
          if (a1 === "reset") return hallReset();
          return "HALL: open / next / auto on|off / thin / door open|close / finals / unfinalist <id> / reset";
        }
        if (cmd === "lift") {                                         // lift A lounge | lift B 3
          const s = LIFTS[(parts[1] || "").toUpperCase()]; if (!s) return "LIFT A or LIFT B";
          const want = (parts[2] || "").toLowerCase(); let k = s.Lf.keys.indexOf(want);
          if (want === "open" || want === "openall") { const at = s.force(want === "openall"); return "LIFT " + s.id + " FORCED OPEN AT THE " + s.Lf.keys[at].toUpperCase() + (want === "openall" ? " - AND THE DOORS ON EVERY OTHER FLOOR (THE SHAFT IS OPEN THERE! THE NEXT RIDE SHUTS THEM)" : ""); }
          if (k < 0 && /^\d$/.test(want)) k = +want; if (k < 0 || k >= s.Lf.keys.length) return "LIFT " + s.id + " STOPS: " + s.Lf.keys.join(" / ");
          s.request(k); return "LIFT " + s.id + " CALLED TO " + s.Lf.keys[k].toUpperCase();
        }
        if (cmd === "liftjam") {                                      // (v33, tests) pretend a lift lost a step: it must heal itself
          const s = LIFTS[(parts[1] || "").toUpperCase()]; if (!s) return "LIFTJAM A or B"; s.busy = true; s.deadline = now() - 1; return "LIFT " + s.id + " JAMMED (TEST)";
        }
        if (cmd === "liftstat") return "LIFTS " + JSON.stringify(Object.fromEntries(Object.values(LIFTS).map((s) => [s.id, s.status()])));
        if (cmd === "frontdoor") {                                    // frontdoor open | close
          const v = (parts[1] || "").toLowerCase();
          return frontDoors(v === "open" ? true : v === "close" || v === "shut" ? false : !FD.open);
        }
        if (cmd === "boats") {                                        // boats go | back | reset | stay | auto | (status)
          const v = (parts[1] || "").toLowerCase();
          if (v === "go") return boatsGo();
          if (v === "back") return boatsBack();
          if (v === "reset") return boatsReset();
          if (v === "stay") { BOAT.stay = true; return "THE BOATS WILL WAIT AT THE SPIRE UNTIL YOU BRING THEM BACK"; }
          if (v === "auto") { BOAT.stay = false; if (BOAT.state === "landed") later(1000, () => { if (BOAT.state === "landed" && !BOAT.stay) boatsBack(); }); return "THE BOATS WILL GO BACK TO THE PIER BY THEMSELVES 40 S AFTER LANDING"; }
          return "BOATS: " + boatWhere() + " - " + BOAT.boats.reduce((n, b) => n + b.on.size, 0) + " ABOARD";
        }
        if (cmd === "lang") {                                         // lang <id> ru|en  |  lang (who reads Russian)
          const id = +parts[1], v = (parts[2] || "").toLowerCase();
          if (!parts[1]) return RU.size ? "READING IN RUSSIAN: " + Array.from(RU).map((i) => nameOf(pl(i))).join(", ") : "NOBODY HAS PICKED RUSSIAN";
          if (!ONLINE.has(id)) return "#" + parts[1] + " IS NOT ONLINE";
          langSet(id, v === "ru" ? true : v === "en" ? false : !RU.has(id)); return nameOf(pl(id)).toUpperCase() + " NOW SEES " + (RU.has(id) ? "RUSSIAN" : "ENGLISH");
        }
        if (cmd === "liftmusic") {                                    // liftmusic on|off
          const on = a1 === "on" ? true : a1 === "off" ? false : !Object.values(LIFTS).some((s) => s.music.parentNode);
          Object.values(LIFTS).forEach((s) => { if (on && !s.music.parentNode) s.musicHome.appendChild(s.music); if (!on && s.music.parentNode) s.music.remove(); });
          return on ? "ELEVATOR MUSIC ON" : "ELEVATOR MUSIC OFF";
        }
        if (cmd === "npc") {                                          // npc mode on|host|off   |   npc say <who> <line>   |   npc hush
          if (a1 === "mode") {
            const m = (parts[2] || "").toLowerCase(); if (!["on", "host", "off"].includes(m)) return "NPC MODE on / host / off";
            NPC_MODE = m; if (m === "off") Object.values(NPCS).forEach((n) => { if (!n.cur || n.cur.source !== "host") npcStop(n); });
            return m === "on" ? "CHARACTERS: ALL ON - CLICK TO TALK, GREETINGS AND ANNOUNCEMENTS" : m === "host" ? "CHARACTERS: HOST ONLY - CLICKS AND GREETINGS OFF, ONLY YOUR BUTTONS (AND GAME ANNOUNCEMENTS)" : "CHARACTERS: ALL OFF - NOBODY TALKS BY THEMSELVES (YOUR BUTTONS STILL WORK)";
          }
          if (a1 === "hush") { Object.values(NPCS).forEach(npcStop); return "EVERY CHARACTER STOPPED TALKING"; }
          if (a1 === "say") {
            const n = NPCS[(parts[2] || "").toLowerCase()], line = parts[3] || ""; if (!n) return "NPC SAY <who> <line> - WHO: " + Object.keys(NPCS).join(" / ");
            if (!n.lines[line]) return "NO LINE " + line.toUpperCase() + " FOR " + n.key.toUpperCase();
            npcTalk(n, line, undefined, true, "host"); return n.key.toUpperCase() + " SAYS: " + line.toUpperCase();
          }
          return "NPC: mode on|host|off, say <who> <line>, hush";
        }
        if (cmd === "name") {                                         // name <id> <text>
          const id = +parts[1]; const t = parts.slice(2).join(" ").slice(0, 18); if (!ONLINE.has(id) || !t) return "NAME <player id> <name>";
          pl(id).name = t; NAMES.set(id, t); boards(); if (H.winner === id) champShow(); return "PLAYER " + id + " IS NOW " + t.toUpperCase();
        }
        if (cmd === "finalist") {                                     // host can add someone to the finals by hand
          const id = +parts[1]; if (!ONLINE.has(id)) return "FINALIST <player id>";
          const p = pl(id); if (!p.fin) { p.fin = true; H.fin.push(id); doorFix(); boards(); } return nameOf(p).toUpperCase() + " IS A FINALIST";
        }
        return null;
      },
    };
  }
})();
</script>
