      refresh() { doorFix(); setBanner(H.ph === "hunt" ? "findfounder" : H.ph === "finals" ? "findflag" : H.ph === "done" ? "winner" : "notyet"); setCounter(); boards(); },
      game(tn) {
        const finals = H.ph === "finals" || H.ph === "done";
        return { ph: H.ph, left: finals ? VT.length - H.vremoved.size : HL.length - H.removed.size, fin: H.fin.length, finMax: FINALISTS,
                 finalists: H.fin.map((id) => nameOf(pl(id))), winner: H.winner !== null ? nameOf(pl(H.winner)) : "",
                 huntSecs: H.t0 ? Math.round((tn - H.t0) / 1000) : 0, inside: INSIDE.size, npcMode: NPC_MODE,
                 talking: Object.values(NPCS).filter((n) => n.talking).map((n) => n.key), liftMusic: Object.values(LIFTS).some((s) => s.music.parentNode),
                 lifts: Object.fromEntries(Object.entries(LIFTS).map(([k, s]) => [k, s.status()])) };
      },
      players(tn) {
        return Array.from(ONLINE).map((id) => { const p = pl(id); return [id, nameOf(p), zoneOf(p), p.fin ? 1 : 0, Math.max(0, Math.ceil((p.lock - tn) / 1000)), H.winner === id ? 1 : 0]; });
      },
      command(cmd, rest, parts) {
        const a1 = (parts[1] || "").toLowerCase();
        if (cmd === "hall") {
          if (a1 === "open" || a1 === "start") return hallOpen();
          if (a1 === "thin") return thin();
          if (a1 === "finals") return startFinals();
          if (a1 === "reset") return hallReset();
          return "HALL: open / thin / finals / reset";
        }
        if (cmd === "lift") {                                         // lift A lounge | lift B 3
          const s = LIFTS[(parts[1] || "").toUpperCase()]; if (!s) return "LIFT A or LIFT B";
          const want = (parts[2] || "").toLowerCase(); let k = s.Lf.keys.indexOf(want);
          if (k < 0 && /^\d$/.test(want)) k = +want; if (k < 0 || k >= s.Lf.keys.length) return "LIFT " + s.id + " STOPS: " + s.Lf.keys.join(" / ");
          s.request(k); return "LIFT " + s.id + " CALLED TO " + s.Lf.keys[k].toUpperCase();
        }
        if (cmd === "liftmusic") {                                    // liftmusic on|off
          const on = a1 === "on" ? true : a1 === "off" ? false : !Object.values(LIFTS).some((s) => s.music.parentNode);
          Object.values(LIFTS).forEach((s) => { if (on && !s.music.parentNode) s.musicHome.appendChild(s.music); if (!on && s.music.parentNode) s.music.remove(); });
          return on ? "ELEVATOR MUSIC ON" : "ELEVATOR MUSIC OFF";
        }
        if (cmd === "npc") {                                          // npc mode on|host|off   |   npc say <who> <line>   |   npc hush
          if (a1 === "mode") {
            const m = (parts[2] || "").toLowerCase(); if (!["on", "host", "off"].includes(m)) return "NPC MODE on / host / off";
            NPC_MODE = m; if (m === "off") Object.values(NPCS).forEach((n) => { if (!n.cur || n.cur.source !== "host") npcStop(n); });
            return m === "on" ? "CHARACTERS: ALL ON - CLICK TO TALK, GREETINGS AND ANNOUNCEMENTS" : m === "host" ? "CHARACTERS: HOST ONLY - CLICKS AND GREETINGS OFF, ONLY YOUR BUTTONS (AND GAME ANNOUNCEMENTS)" : "CHARACTERS: ALL OFF - NOBODY TALKS BY THEMSELVES (YOUR BUTTONS STILL WORK)";
          }
          if (a1 === "hush") { Object.values(NPCS).forEach(npcStop); return "EVERY CHARACTER STOPPED TALKING"; }
          if (a1 === "say") {
            const n = NPCS[(parts[2] || "").toLowerCase()], line = parts[3] || ""; if (!n) return "NPC SAY <who> <line> - WHO: " + Object.keys(NPCS).join(" / ");
            if (!n.lines[line]) return "NO LINE " + line.toUpperCase() + " FOR " + n.key.toUpperCase();
            npcTalk(n, line, undefined, true, "host"); return n.key.toUpperCase() + " SAYS: " + line.toUpperCase();
          }
          return "NPC: mode on|host|off, say <who> <line>, hush";
        }
        if (cmd === "name") {                                         // name <id> <text>
          const id = +parts[1]; const t = parts.slice(2).join(" ").slice(0, 18); if (!ONLINE.has(id) || !t) return "NAME <player id> <name>";
          pl(id).name = t; NAMES.set(id, t); boards(); return "PLAYER " + id + " IS NOW " + t.toUpperCase();
        }
        if (cmd === "finalist") {                                     // host can add someone to the finals by hand
          const id = +parts[1]; if (!ONLINE.has(id)) return "FINALIST <player id>";
          const p = pl(id); if (!p.fin) { p.fin = true; H.fin.push(id); doorFix(); boards(); } return nameOf(p).toUpperCase() + " IS A FINALIST";
        }
        return null;
      },
    };
  }
})();
</script>
