        const sh = el("m-image", { src: bioSrc("bio_sheen.png"), x: wx, y: su.y + 2.1, z: wz, ry, width: 1.8, height: 3.8, emissive: 3, opacity: 0.9, collide: "false", "cast-shadows": "false" }, zg);
        const a0 = along === "x" ? wx : wz;

      }
    }

    // ---------------------------------------------------- NPCs
    const NPCS = {};
    function npc(key, x, y, z, ry, parent, sc) {
      const g = el("m-group", Object.assign({ x, y, z, ry }, sc ? { sx: sc, sy: sc, sz: sc } : {}), parent);
      const m = model("npc_" + key + ".glb", { collide: "false", anim: BASE + "npc_" + key + "_idle.glb" + VER, "anim-loop": "true" }, g);
      const hb = hitBox({ y: 1.0, width: 1.0, height: 2.0, depth: 0.9 }, g);
      const n = { key, g, m, i: 0, talking: false, cur: null, greeted: new Map(), lines: D.npc[key].lines, x, y, z, parent };
      hb.addEventListener("click", (e) => { const id = e.detail && e.detail.connectionId; if (id === undefined) return; if (npcTalk(n, peekLine(n), id, false, "click")) n.i++; });
      NPCS[key] = n; return n;
    }
    function peekLine(n) { const ts = Object.keys(n.lines).filter((k) => /^t\d+$/.test(k)); return ts[n.i % ts.length]; }   // moves on only when the line is actually said
    function headPos(n) {
      if (n.parent && n.parent !== WORLD) { const px = +n.parent.getAttribute("x") || 0, py = +n.parent.getAttribute("y") || 0, pz = +n.parent.getAttribute("z") || 0; return [px + n.x, py + n.y, pz + n.z]; }
      return [n.x, n.y, n.z];
    }
    // NPC_MODE (host remote): "on" = click / greet / game announcements, "host" = clicks + greetings do nothing (game announcements
    // still play), "off" = nothing talks by itself. Lines the host sends from the remote ("npc say <who> <line>") always play.
    let NPC_MODE = "on";
    function npcStop(n) {
      if (!n.cur) return;
      n.cur.timers.forEach(cancel); if (n.cur.bub) n.cur.bub.remove(); if (n.cur.audio) n.cur.audio.remove();
      n.cur = null; n.talking = false;
      n.m.setAttribute("anim", BASE + "npc_" + n.key + "_idle.glb" + VER);
    }
    // source: "click" | "greet" | "game" | "host". One line at a time: while a character talks, clicks and greetings are ignored;
    // a game announcement or a host line cuts in (a host line is never cut off by anything but another host line).
    function npcTalk(n, line, id, everyoneHears, source) {
      source = source || "game";
      const info = n.lines[line]; if (!info) return false;
      if (source !== "host") {
        if (NPC_MODE === "off") return false;
        if (NPC_MODE === "host" && (source === "click" || source === "greet")) return false;
        if (n.talking && (source === "click" || source === "greet")) return false;
        if (n.talking && n.cur && n.cur.source === "host") return false;
      }
      npcStop(n);
      const [asp, dur] = info; const ms = Math.round(dur * 1000 + 1200);
      const hp = headPos(n), tall = (D.npcH[n.key] || 1.8) * (+n.g.getAttribute("sy") || 1);
      const p = id !== undefined ? pl(id) : null;
      const ry = p && p.pos ? faceTo(hp, p.pos) : (+n.g.getAttribute("ry") || 0);
      const vis = everyoneHears || id === undefined ? {} : { "visible-to": String(id) };
      const cap = (D.npcCap || {})[n.key];
      const lift = (cap && cap.inCab) ? n.parent : null;               // the lift boss: bubble hangs in the middle of his cab and rides with it
      const by = Math.min(tall + 0.75, cap && cap.y !== undefined ? cap.y : 99);
      const fw = cap && cap.fwd ? cap.fwd : 0.0, a = ry * Math.PI / 180;    // nudge forward, out from under shelves and racks
      const bub = lift ? el("m-group", Object.assign({ x: 0, y: by, z: 0, ry }, vis), lift)
                       : el("m-group", Object.assign({ x: hp[0] + Math.sin(a) * fw, y: hp[1] + by, z: hp[2] + Math.cos(a) * fw, ry }, vis), priv);
      const bs = lift ? 0.55 : 0.95;
      model("sb_" + n.key + "_" + line + ".glb", { sx: bs, sy: bs, sz: bs, collide: "false" }, bub);
      const audio = VOICES ? el("m-audio", { src: BASE + "vo_" + n.key + "_" + line + ".mp3" + VER, x: hp[0], y: hp[1] + 1.6, z: hp[2], loop: "false", volume: 1.0, "start-time": Math.round(now()) }) : null;
      n.m.setAttribute("anim", BASE + "npc_" + n.key + "_talk.glb" + VER);
      n.talking = true;
      const cur = { source, bub, audio, timers: [] }; n.cur = cur;
      cur.timers.push(later(ms, () => { if (n.cur === cur) npcStop(n); }));
      return true;
    }
    const W = D.where;
    npc("ferryman", ...W.ferryman);
    npc("barkeep", ...W.barkeep, undefined, 1.3);           // a short frog behind a tall bar: a bit bigger so she shows
    npc("gator", ...W.gator);
    npc("appraiser", ...W.appraiser);
    npc("skipper", ...W.skipper);
    npc("dealer", ...W.dealer);
    // greet: once a minute, the first time you walk up to someone
    function greetCheck(p) {
      const t = now();
      for (const k in NPCS) {
        const n = NPCS[k]; if (!n.lines.greet) continue;
        const hp = headPos(n);
        if (Math.abs(p.pos.y - hp[1]) > 3 || Math.hypot(p.pos.x - hp[0], p.pos.z - hp[2]) > 5) continue;
        if (t - (n.greeted.get(p.id) || -1e9) < 60000) continue;
        if (n.talking || NPC_MODE !== "on") continue;
        n.greeted.set(p.id, t); npcTalk(n, "greet", p.id, false, "greet");
      }
    }

    // ---------------------------------------------------- the bar: taps that pour, mugs that slide down to you
    const MUGS = [];
    D.taps.forEach(([x, y, z, ry], i) => {
      const tg = el("m-group", { x, y, z, ry });
      const handle = model("sp_tap.glb", { collide: "false" }, tg);

      const [bx, bz, rOut] = D.barRound, ta = ry * Math.PI / 180;
      hb.addEventListener("click", (e) => {
        const id = e.detail && e.detail.connectionId; if (id === undefined || busy) return; busy = true;
        tween(handle, "rx", 0, 38, 400, "easeOutQuad"); later(2600, () => tween(handle, "rx", 38, 0, 500, "easeInOutQuad"));
        const sp = [x + Math.sin(ta) * 0.2, D.barTop + 0.33, z + Math.cos(ta) * 0.2];
        const pour = model("sp_pour.glb", { x: sp[0], y: sp[1], z: sp[2], sy: 0.01, collide: "false" });

          const tx = bx + Math.sin(a) * (rOut - 0.35), tz = bz + Math.cos(a) * (rOut - 0.35);
          tween(mug, "y", D.trayTop, D.barTop, 400, "easeInQuad");
          tween(mug, "x", sp[0], tx, 900, "easeOutQuart"); tween(mug, "z", sp[2], tz, 900, "easeOutQuart");
          if (NPCS.barkeep) npcTalk(NPCS.barkeep, "pour" + (i % 4), id, false, "click");
          // click your own beer to drink it: it lifts, tips back for a big swig (gulp gulp), and it's gone
          const drink = hitBox({ y: 0.11, width: 0.3, height: 0.32, depth: 0.3 }, mug);
          drink.addEventListener("click", (ev) => {
            const who = ev.detail && ev.detail.connectionId;
            if (who !== id || mug._drunk) return; mug._drunk = true; drink.remove();
            const y0 = +mug.getAttribute("y") || D.barTop, mx = +mug.getAttribute("x"), mz = +mug.getAttribute("z");
            tween(mug, "y", y0, y0 + 0.45, 500, "easeOutQuad");
            later(350, () => tween(mug, "rx", 0, -78, 600, "easeInOutQuad"));
            sfx("gulp.mp3", mx, y0 + 0.5, mz, 0.85);
            later(1700, () => { ["sx", "sy", "sz"].forEach((k) => tween(mug, k, 1, 0.01, 300, "easeInBack")); later(380, () => { const k = MUGS.indexOf(mug); if (k >= 0) MUGS.splice(k, 1); mug.remove(); }); });
          });
          MUGS.push(mug); if (MUGS.length > 30) MUGS.shift().remove();
          later(MUG_LIFE, () => { const k = MUGS.indexOf(mug); if (k >= 0) MUGS.splice(k, 1); mug.remove(); });
        });
      });
    });

    // ---------------------------------------------------- guest book (porch) - the name you sign shows on the leaderboards
    D.books.forEach(([x, y, z, ry]) => {
      const pr = el("m-prompt", { x, y, z, ry, message: "Sign the Mudwater Guest Book - type the name you want on the leaderboards", placeholder: "Your name (up to 18 letters)" });
      model("sp_guestbook.glb", { collide: "true" }, pr);
      pr.addEventListener("prompt", (e) => {
        const id = e.detail && e.detail.connectionId; if (id === undefined) return;
        const raw = String(e.detail.value || "").replace(/[<>\u0000-\u001f]/g, "").replace(/\s+/g, " ").trim().slice(0, 18);
        if (!raw) return;
        const p = pl(id); p.name = raw; NAMES.set(id, raw);
        sfx("lift_chime.mp3", x, y + 1, z, 0.5);
        hostMsg("PLAYER " + id + " SIGNED IN AS " + raw.toUpperCase());
        boards();
      });
    });

    // ==================================================== THE LIFTS
    const LIFTS = {};
    D.lifts.forEach((Lf) => {
      const id = Lf.id, x = Lf.x, z = Lf.z, ci = Lf.cab;
      const st = { id, at: 0, busy: false, open: false, req: new Set(), dir: 1, lastUse: now(), Lf };
      const SY = D.sheaveY, HITCH = D.hitch, ROPE = D.rope;
      const cwTop = (cy) => SY - (ROPE - (SY - (cy + HITCH)));
      // --- the cab (everything that rides)
      const CG = el("m-group", { x, y: Lf.stops[0], z }); CG._global = true;
      // MOVING: the cab, ropes, counterweight and dials carry an m-attr-lerp. To move, the server just sets the new value and every
      // player's client glides it there over the same time - one cab, the same for everybody, riders carried on its floor.
      // (The old way played a timed animation; players whose clocks didn't match saw the cab somewhere else.)
      const LERPS = [];
      const glider = (n, attr) => { const l = el("m-attr-lerp", { attr, duration: 1000, easing: "easeInOutSine" }, n); LERPS.push(l); return (to, ms) => { l.setAttribute("duration", Math.round(ms)); n.setAttribute(attr, String(r3(to))); }; };
      model("sp_lift_cab.glb", { collide: "false" }, CG);
      const cgR = model("sp_lift_cgate.glb", { x: ci.gate_r[0], z: ci.gate_r[2], collide: "false" }, CG);
      const cgL = model("sp_lift_cgate.glb", { x: ci.gate_l[0], z: ci.gate_l[2], ry: 180, collide: "false" }, CG);
      const gears = [ci.gear_l, ci.gear_r].map((g) => model("sp_lift_cabgear.glb", { x: g[0], y: g[1], z: g[2], collide: "false" }, CG));
      const lever = model("sp_lift_lever.glb", { x: ci.lever[0], y: ci.lever[1], z: ci.lever[2], ry: ci.lever_ry, collide: "false" }, CG);
      const needleIn = model("sp_lift_needle.glb", { x: ci.needle_in[0], y: ci.needle_in[1], z: ci.needle_in[2], ry: 180, rz: Lf.dial_rz[0], collide: "false" }, CG);
      const needleOut = model("sp_lift_needle.glb", { x: ci.needle_out[0], y: ci.needle_out[1], z: ci.needle_out[2], rz: Lf.dial_rz[0], collide: "false" }, CG);
      const gCab = glider(CG, "y"), gNin = glider(needleIn, "rz"), gNout = glider(needleOut, "rz");
      // floor, walls (door side open), the cab gate's collider
      [0, 45, 90, 135].forEach((a) => pad({ y: -0.13, width: 4.05, height: 0.26, depth: 1.66, ry: a }, CG));
      for (let i = 0; i < 7; i++) { const a = 45 + 45 * i, c = polar(D.cabApo + 0.03, a, 1.3); pad({ x: c[0], y: c[1], z: c[2], ry: a, width: 1.8, height: 2.6, depth: 0.12 }, CG); }
      pad({ y: -0.13, z: D.cabApo + 0.13, width: 1.7, height: 0.26, depth: 0.3 }, CG);               // the sill
      const cgatePad = pad({ y: 1.25, z: D.cabApo - 0.02, width: 1.8, height: 2.5, depth: 0.12 }, CG);
      // elevator music, playing softly inside the cab (riders hear it; it fades a few metres outside the glass)
      const music = el("m-audio", { src: BASE + "lift_music.mp3" + VER, y: 2.3, loop: "true", volume: 0.32, "start-time": -9000 * "ABCD".indexOf(id) }, CG);
      st.music = music; st.musicHome = CG;
      // the operator (the host's own ape) rides the Grand Cage
      if (id === "A") npc("operator", ci.operator[0], ci.operator[1], ci.operator[2], ci.operator_ry, CG);
      // floor buttons inside the cab (pictures of the floor names) on the front-left diagonal
      {
        const pc = polar(D.cabApo - 0.55, 315, 0);                 // a brass-edged board 0.55 m in from the front-left wall, facing the middle
        const panel = el("m-group", { x: pc[0], y: 0, z: pc[2], ry: 135 }, CG);
        el("m-cube", { y: 1.45, z: -0.04, width: 1.05, height: 1.75, depth: 0.04, color: "#2a1a0c", collide: "false", "cast-shadows": "false" }, panel);
        const n = Lf.keys.length;
        Lf.keys.forEach((key, k) => {
          const bg = el("m-group", { y: 2.15 - k * (1.3 / Math.max(1, n - 1)), z: 0.02 }, panel);   // top floor at the top
          word("fl_" + key, 0.17, {}, bg);
          const hb = hitBox({ z: 0.05, width: 0.98, height: 0.24, depth: 0.12 }, bg);
          hb.addEventListener("click", (e) => request(st, k, e.detail && e.detail.connectionId));
        });
      }
      // --- the shaft: landing gates, their colliders, dials, call buttons
      const LANDS = Lf.portals.map((po, k) => {
        const gR = model("sp_lift_lgate.glb", { x: po.gate_r[0], y: po.gate_r[1], z: po.gate_r[2], collide: "false" });
        const gL = model("sp_lift_lgate.glb", { x: po.gate_l[0], y: po.gate_l[1], z: po.gate_l[2], ry: 180, collide: "false" });
        const gp = pad({ x: po.gate_col[0], y: po.gate_col[1] + 1.45, z: po.gate_col[2], width: 1.85, height: 2.9, depth: 0.15 });
        const nd = model("sp_lift_needle.glb", { x: po.needle[0], y: po.needle[1], z: po.needle[2], rz: Lf.dial_rz[0], sx: po.needle_scale, sy: po.needle_scale, sz: po.needle_scale, collide: "false" });
        nd._g = glider(nd, "rz");
        const cb = el("m-group", { x: po.call[0], y: po.call[1], z: po.call[2] });
        model("sp_lift_call.glb", { collide: "false" }, cb);
        const glow = model("sp_lift_callglow.glb", { collide: "false" }, cb); glow.remove();
        const hb = hitBox({ y: 0.02, width: 0.3, height: 0.42, depth: 0.16 }, cb);
        hb.addEventListener("click", (e) => request(st, k, e.detail && e.detail.connectionId));
        return { po, gR, gL, gp, nd, cb, glow, gpY: po.gate_col[1] + 1.45 };
      });
      // --- the machine head, ropes and counterweight
      const sheave = model("sp_lift_sheave.glb", { x: Lf.sheave[0], y: Lf.sheave[1], z: Lf.sheave[2], collide: "false" });
      const pinion = model("sp_lift_pinion.glb", { x: Lf.pinion[0], y: Lf.pinion[1], z: Lf.pinion[2], collide: "false" });
      const gov = model("sp_lift_gov.glb", { x: Lf.governor[0], y: Lf.governor[1], z: Lf.governor[2], collide: "false" });
      const y0 = Lf.stops[0];
      const cabRope = model("sp_lift_cable.glb", { x: Lf.cab_rope_top[0], y: Lf.cab_rope_top[1], z: Lf.cab_rope_top[2], sy: SY - (y0 + HITCH), collide: "false" });
      const cwRope = model("sp_lift_cable.glb", { x: Lf.cw_rope_top[0], y: Lf.cw_rope_top[1], z: Lf.cw_rope_top[2], sy: SY - cwTop(y0), collide: "false" });
      const CW = model("sp_lift_cw.glb", { x, y: cwTop(y0), z: z + D.cwZ, collide: "false" });
      const gCabRope = glider(cabRope, "sy"), gCwRope = glider(cwRope, "sy"), gCW = glider(CW, "y");
      [CG, sheave, pinion, gov, cabRope, cwRope, CW].forEach((n) => (n._global = true));
      LANDS.forEach((l) => { [l.gR, l.gL, l.nd, l.cb].forEach((n) => (n._global = true)); });

      function gates(open, k) {
        const s0 = open ? 1 : 0.15, s1 = open ? 0.15 : 1, l = LANDS[k];
        [cgR, cgL, l.gR, l.gL].forEach((g) => tween(g, "sx", s0, s1, 1100, "easeInOutQuad"));
        later(open ? 900 : 0, () => { cgatePad.setAttribute("y", open ? -60 : 1.25); l.gp.setAttribute("y", open ? -300 : l.gpY); });
        sfx("lift_gate.mp3", l.po.gate_col[0], l.po.gate_col[1] + 1.4, l.po.gate_col[2], 0.7);
        st.open = open;
      }
      function move(k0, k1, done) {
        const a = Lf.stops[k0], b = Lf.stops[k1], dy = Math.abs(b - a), ms = Math.round(Math.max(4000, dy / LIFT_SPEED * 1000 + 1600));
        const up = b > a;
        gCab(b, ms); gCabRope(SY - (b + HITCH), ms); gCwRope(SY - cwTop(b), ms); gCW(cwTop(b), ms);
        gNin(Lf.dial_rz[k1], ms); gNout(Lf.dial_rz[k1], ms);
        LANDS.forEach((l) => l.nd._g(Lf.dial_rz[k1], ms));
        tween(lever, "rx", 0, up ? -30 : 30, 500, "easeOutQuad"); later(ms - 600, () => tween(lever, "rx", up ? -30 : 30, 0, 500, "easeInOutQuad"));
        const revSheave = Math.round(2 * Math.PI * D.sheaveR / LIFT_SPEED * 1000), sg = up ? 1 : -1;
        const spins = [anim(sheave, "rx", 0, 360 * sg, revSheave), anim(pinion, "rx", 0, -360 * sg, Math.round(revSheave * 0.33)), anim(gov, "ry", 0, 360, 900)]
          .concat(gears.map((g) => anim(g, "rx", 0, 360 * sg, 1400)));
        const hum = el("m-audio", { src: BASE + "lift_hum.mp3" + VER, y: 1.5, loop: "true", volume: 0.55, "start-time": Math.round(now()) }, CG);
        if (id === "A" && NPCS.operator) npcTalk(NPCS.operator, up ? "up" : "down", undefined, true);
        later(ms, () => { spins.forEach((s) => s.remove()); hum.remove(); done(); });
      }
      function arrive(k) {
        const l = LANDS[k]; if (l.glow.parentNode) l.glow.remove();
        sfx("lift_chime.mp3", l.po.call[0], l.po.call[1] + 1.5, l.po.call[2], 0.9);
        gates(true, k);
        if (id === "A" && NPCS.operator) later(600, () => npcTalk(NPCS.operator, "s_" + Lf.keys[k], undefined, true));
      }
      function pump() {
        if (st.busy) return;
        st.req.delete(st.at);
        if (!st.req.size) { if (!st.open) { st.busy = true; arrive(st.at); later(1200, () => { st.busy = false; }); } return; }
        const ks = Array.from(st.req);
        let ahead = ks.filter((k) => (k - st.at) * st.dir > 0);
        if (!ahead.length) { st.dir = -st.dir; ahead = ks.filter((k) => (k - st.at) * st.dir > 0); }
        if (!ahead.length) return;
        const next = ahead.sort((a, b) => Math.abs(a - st.at) - Math.abs(b - st.at))[0];
        st.busy = true; st.lastUse = now();
        const go = () => move(st.at, next, () => {
          st.at = next; st.req.delete(next); arrive(next); st.lastUse = now();
          later(LIFT_DWELL, () => { st.busy = false; pump(); });
        });
        if (st.open) { if (id === "A" && NPCS.operator) npcTalk(NPCS.operator, "close", undefined, true); gates(false, st.at); later(1400, go); } else go();
      }
      function request(s, k, who) {
        if (k === s.at && s.open && !s.busy) return;
        if (!s.req.has(k) && k !== s.at) { const l = LANDS[k]; if (!l.glow.parentNode) l.cb.appendChild(l.glow); }
        s.req.add(k); pump();
      }
      st.request = (k) => request(st, k);
      st.home = () => { if (!st.busy && st.at !== 0 && now() - st.lastUse > LIFT_HOME_MS) request(st, 0); };
      st.status = () => ({ at: Lf.keys[st.at], busy: st.busy, open: st.open, req: Array.from(st.req).map((k) => Lf.keys[k]) });
      LIFTS[id] = st;
      // start: cab at the lounge with its gates open
      later(1500, () => arrive(0));
    });
    every(5000, () => Object.values(LIFTS).forEach((s) => s.home()));

    // ==================================================== THE HALL OF FAKES
    const HL = D.hall, VT = D.vault;
