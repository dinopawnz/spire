  // ---- ZONES: one per floor + "out" (outside the tower). Sounds are never zoned (Otherside won't play m-audio under visible-to).
  const ZONES = {}, ZSET = {};
  const BANDS = [["f1", 2.0, D.L.f2], ["f2", D.L.f2, D.L.f3], ["f3", D.L.f3, D.L.f4], ["f4", D.L.f4, D.L.roof]];
  const inside = (x, z, m) => Math.abs(x) < D.L.X1 + m && Math.abs(z) < D.L.Z1 + m;
  function zKey(x, y, z) {
    if (!inside(x, z, 0)) return "out";
    for (const [k, lo, hi] of BANDS) if (y >= lo && y < hi) return k;
    return "out";
  }
  function zKeysFor(p) {
    const ks = []; let deep = false;
    for (const [k, lo, hi] of BANDS) {

      if (inside(p.x, p.z, -6) && p.y > lo + 0.5 && p.y < hi - 0.5) deep = true;

  }
  function zoneGroup(k, world) { if (!ZONES[k]) { ZONES[k] = el("m-group", { "visible-to": "-1" }, world || WORLD); ZSET[k] = new Set(); } return ZONES[k]; }
  function zoneUp(world) {
    const tg = (n) => String(n.tagName).toUpperCase();
    const VIS = ["visible", "visible-to", "hidden-from"], T0_ = ["x", "y", "z", "rx", "ry", "rz"], T1 = ["sx", "sy", "sz"];
    const plain = (n) => tg(n) === "M-GROUP" && !VIS.some((k) => n.hasAttribute(k)) &&
      T0_.every((k) => !n.hasAttribute(k) || +n.getAttribute(k) === 0) && T1.every((k) => !n.hasAttribute(k) || +n.getAttribute(k) === 1);
    const nm = (n, k, d) => { const v = n.getAttribute(k); return v === null || v === "" || isNaN(+v) ? d : +v; };
    const pos = (n, stop) => { let p = { x: 0, y: 0, z: 0 }; for (let e = n; e && e !== stop; e = e.parentNode) {
      const a = nm(e, "ry", 0) * Math.PI / 180, x = p.x * nm(e, "sx", 1), y = p.y * nm(e, "sy", 1), z = p.z * nm(e, "sz", 1);
      p = { x: x * Math.cos(a) + z * Math.sin(a) + nm(e, "x", 0), y: y + nm(e, "y", 0), z: -x * Math.sin(a) + z * Math.cos(a) + nm(e, "z", 0) }; } return p; };
    const LEAF = /^M-(MODEL|CUBE|CYLINDER|SPHERE|PLANE|LABEL|IMAGE|AUDIO)$/;
    const zs = new Set(Object.values(ZONES));
    let moved = 0;
    const visit = (box) => Array.from(box.children).forEach((c) => {
      if (zs.has(c)) return;
      const asked = c.getAttribute && c.getAttribute("data-zone");
      if (asked && c.getAttribute("collide") !== "true") { const g = zoneGroup(asked, world); zs.add(g); g.appendChild(c); moved++; return; }
      const all = [c].concat(Array.from(c.querySelectorAll("*")));
      const busy = all.some((n) => /^M-(LABEL|AUDIO|ATTR-ANIM|ATTR-LERP)$/.test(tg(n)));
      const fixed = all.some((n) => n.getAttribute("collide") === "true" || /^M-(POSITION-PROBE|PROMPT|AUDIO)$/.test(tg(n)) || VIS.some((k) => n.hasAttribute(k)) || n._global);
      const keys = new Set(all.filter((n) => LEAF.test(tg(n))).map((n) => { const p = pos(n, world); return zKey(p.x, p.y, p.z); }));

  const SEEN = new Set();
  function zoneSee(id, p) { if (!WORLD) return; SEEN.add(id); zoneMark(id, new Set(zKeysFor(p))); }

  function zoneMark(id, want) {

  // ---- LITE + REFRESH (as in the castle)

  function liteOn() {
    if (LITE) return "LITE MODE IS ALREADY ON";

    LITE.removed.forEach((r) => r.n.remove());

  }
  function liteOff() {

  hostPrompt.addEventListener("prompt", (e) => {

  // ==========================================================
  // THE WORLD
  // ==========================================================
  function buildWorld() {
    const L = D.L;
    const P = new Map();                       // connectionId -> player
    const pl = (id) => { if (!P.has(id)) P.set(id, { id, name: NAMES.get(id) || "", pos: null, lock: 0, fin: false, fintime: 0 }); return P.get(id); };
    const nameOf = (p) => (p.name ? p.name : "Player #" + p.id);
    const everyone = () => Array.from(ONLINE);
    const hideFrom = (n, a) => { if (!a.length) { n.removeAttribute("visible-to"); return; } const skip = new Set(a.map(String)); const keep = everyone().filter((id) => !skip.has(String(id))); n.setAttribute("visible-to", keep.length ? keep.join(" ") : "-1"); };

    D.lifts.forEach((Lf) => model(Lf.shaft_model + ".glb", { x: Lf.x, z: Lf.z, collide: "false" }));      // shared shaft models, four places
    // the swamp round the hall: the Mudwater Coliseum's own decorations (water, giant mangroves, acorn houses, cypress, reeds, lanterns...)
    const MW = "https://raw.githubusercontent.com/dinopawnz/mudwater/main/";
    D.deco.forEach(([f, x, y, z, ry, s]) => el("m-model", { src: MW + f + ".glb", x, y, z, ry, sx: s, sy: s, sz: s, collide: "false", "cast-shadows": "false" }));

    {

    // ---------------------------------------------------- NPCs
    const NPCS = {};
    function npc(key, x, y, z, ry, parent, sc) {
      const g = el("m-group", Object.assign({ x, y, z, ry }, sc ? { sx: sc, sy: sc, sz: sc } : {}), parent);
      const m = model("npc_" + key + ".glb", { collide: "false", anim: BASE + "npc_" + key + "_idle.glb" + VER, "anim-loop": "true" }, g);

    function peekLine(n) { const ts = Object.keys(n.lines).filter((k) => /^t\d+$/.test(k)); return ts[n.i % ts.length]; }   // moves on only when the line is actually said

    // NPC_MODE (host remote): "on" = click / greet / game announcements, "host" = clicks + greetings do nothing (game announcements

      const cap = (D.npcCap || {})[n.key];
      const lift = (cap && cap.inCab) ? n.parent : null;               // the lift boss: bubble hangs in the middle of his cab and rides with it
      const by = Math.min(tall + 0.75, cap && cap.y !== undefined ? cap.y : 99);
      const fw = cap && cap.fwd ? cap.fwd : 0.0, a = ry * Math.PI / 180;    // nudge forward, out from under shelves and racks
      const bub = lift ? el("m-group", Object.assign({ x: 0, y: by, z: 0, ry }, vis), lift)
                       : el("m-group", Object.assign({ x: hp[0] + Math.sin(a) * fw, y: hp[1] + by, z: hp[2] + Math.cos(a) * fw, ry }, vis), priv);
      const bs = lift ? 0.55 : 0.95;
      model("sb_" + n.key + "_" + line + ".glb", { sx: bs, sy: bs, sz: bs, collide: "false" }, bub);
      const audio = VOICES ? el("m-audio", { src: BASE + "vo_" + n.key + "_" + line + ".mp3" + VER, x: hp[0], y: hp[1] + 1.6, z: hp[2], loop: "false", volume: 1.0, "start-time": Math.round(now()) }) : null;
      n.m.setAttribute("anim", BASE + "npc_" + n.key + "_talk.glb" + VER);
      n.talking = true;

    }
    const W = D.where;
    npc("ferryman", ...W.ferryman);

    // greet: once a minute, the first time you walk up to someone

        const n = NPCS[k]; if (!n.lines.greet) continue;
        const hp = headPos(n);

    // ---------------------------------------------------- the bar: taps that pour, mugs that slide down to you

          });

    });

    // ---------------------------------------------------- guest book (porch) - the name you sign shows on the leaderboards
    D.books.forEach(([x, y, z, ry]) => {

    // ==================================================== THE LIFTS
    const LIFTS = {};
    D.lifts.forEach((Lf) => {
      const id = Lf.id, x = Lf.x, z = Lf.z, ci = Lf.cab;
      const st = { id, at: 0, busy: false, open: false, req: new Set(), dir: 1, lastUse: now(), Lf };
      const SY = D.sheaveY, HITCH = D.hitch, ROPE = D.rope;

      // --- the cab (everything that rides)
      const CG = el("m-group", { x, y: Lf.stops[0], z }); CG._global = true;

      // (The old way played a timed animation; players whose clocks didn't match saw the cab somewhere else.)
      const LERPS = [];
      const glider = (n, attr) => { const l = el("m-attr-lerp", { attr, duration: 1000, easing: "easeInOutSine" }, n); LERPS.push(l); return (to, ms) => { l.setAttribute("duration", Math.round(ms)); n.setAttribute(attr, String(r3(to))); }; };
      model("sp_lift_cab.glb", { collide: "false" }, CG);

      for (let i = 0; i < 7; i++) { const a = 45 + 45 * i, c = polar(D.cabApo + 0.03, a, 1.3); pad({ x: c[0], y: c[1], z: c[2], ry: a, width: 1.8, height: 2.6, depth: 0.12 }, CG); }

      // floor buttons inside the cab (pictures of the floor names) on the front-left diagonal

          const hb = hitBox({ z: 0.05, width: 0.98, height: 0.24, depth: 0.12 }, bg);

      }
      // --- the shaft: landing gates, their colliders, dials, call buttons
      const LANDS = Lf.portals.map((po, k) => {
        const gR = model("sp_lift_lgate.glb", { x: po.gate_r[0], y: po.gate_r[1], z: po.gate_r[2], collide: "false" });
        const gL = model("sp_lift_lgate.glb", { x: po.gate_l[0], y: po.gate_l[1], z: po.gate_l[2], ry: 180, collide: "false" });
        const gp = pad({ x: po.gate_col[0], y: po.gate_col[1] + 1.45, z: po.gate_col[2], width: 1.85, height: 2.9, depth: 0.15 });

      const cabRope = model("sp_lift_cable.glb", { x: Lf.cab_rope_top[0], y: Lf.cab_rope_top[1], z: Lf.cab_rope_top[2], sy: SY - (y0 + HITCH), collide: "false" });

      function gates(open, k) {

      }
      function pump() {
        if (st.busy) return;
        st.req.delete(st.at);
        if (!st.req.size) { if (!st.open) { st.busy = true; arrive(st.at); later(1200, () => { st.busy = false; }); } return; }
        const ks = Array.from(st.req);

        if (!ahead.length) { st.dir = -st.dir; ahead = ks.filter((k) => (k - st.at) * st.dir > 0); }

    });
    every(5000, () => Object.values(LIFTS).forEach((s) => s.home()));

    // ==================================================== THE HALL OF FAKES
    const HL = D.hall, VT = D.vault;
    const fz = el("m-group", { "data-zone": "f2" });              // the 200 portraits only go to players on Floor 2
    const H = { ph: "idle", round: 0, auto: true, nextAt: 0, tok: 0, map: [], removed: new Set(), fin: [], vmap: [], vremoved: new Set(), winner: null, t0: 0, finT0: 0 };
    const shuffled = (n) => { const a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    H.map = D.hallImgs.slice(); H.vmap = Array.from({ length: VT.length }, (_, i) => i);
    const HALLM = HL.map(([x, y, z, ry], s) => {
      const m = model("portraits/pf_" + String(H.map[s]).padStart(4, "0") + ".glb", { x, y, z, ry, collide: "false" }, fz);
      m.addEventListener("click", (e) => hallPick(s, e.detail && e.detail.connectionId));
      return m;
    });
    const VAULTM = VT.map(([x, y, z, ry], s) => {
      const m = model("portraits/pv_" + String(H.vmap[s]).padStart(3, "0") + ".glb", { x, y, z, ry, collide: "false" }, fz);
      m.addEventListener("click", (e) => vaultPick(s, e.detail && e.detail.connectionId));
      return m;
    });
    const realSlot = () => H.map.indexOf(D.realHall), vRealSlot = () => H.vmap.indexOf(D.realVault);
    // the vault's glass door: shut for everyone but the finalists
    const VD = D.vaultDoor;
    const door = model("sp_vault_door.glb", { x: VD[0], y: VD[1], z: VD[2], ry: VD[3], collide: "false" });
    const doorPad = pad({ x: VD[0], y: VD[1] + 1.8, z: VD[2], ry: VD[3], width: 3.2, height: 3.6, depth: 0.3 });
    const doorFix = () => { const f = H.fin.map(String); hideFrom(door, f); hideFrom(doorPad, f); };
    // signs: rules by the Hall door and by the vault, the big FIND THE REAL ... banner, the PORTRAITS LEFT counter
    model("sg_hall_rules.glb", { x: D.signs.hall[0], y: D.signs.hall[1], z: D.signs.hall[2], ry: D.signs.hall[3], collide: "false" }, fz);
    model("sg_vault_rules.glb", { x: D.signs.vault[0], y: D.signs.vault[1], z: D.signs.vault[2], ry: D.signs.vault[3], collide: "false" }, fz);
    const banner = el("m-group", {}, fz), rlabel = el("m-group", {}, fz), counter = el("m-group", {}, fz);
    const AT = D.bannerAt;      // the big FIND THE REAL ... signs hang over the front hall and over the lift lobby
    // THE REAL ONE: the untouched #62 on all four sides of a pillar in the middle of the Hall floor, so everyone knows what to hunt for
    D.refs.forEach(([x, y, z]) => model("sp_ref_founder.glb", { x, y, z, collide: "true" }, fz));
    // and the real #100 Black Flag on the vault's plinth, for the finalists (it makes way for the champion's spinning portrait)
    const refFlag = model("sp_ref_flag.glb", { x: D.refFlag[0], y: D.refFlag[1], z: D.refFlag[2], collide: "false" }, fz);
    // frosted glass round the vault: nobody can study the Black Flags until the host starts the finals - then it sinks away
    const frost = model("sp_vault_frost.glb", { x: 0, y: D.yv, z: 0, collide: "false" }, fz);
    function frostOn() { if (!frost.parentNode) fz.appendChild(frost); frost.setAttribute("sy", 1); }
    function frostOff() { if (!frost.parentNode) return; tween(frost, "sy", 1, 0.01, 2200, "easeInQuad"); later(2300, () => frost.remove()); }
    function setBanner(key) {
      Array.from(banner.children).forEach((c) => c.remove());
      if (!key) return;
      AT.forEach(([bx, bz, by, rr]) => [0, 90, 180, 270].forEach((a) => { const c = polar(rr, a, 0); word(key, 1.0, { x: bx + c[0], y: by + 2.5, z: bz + c[2], ry: a }, banner, true); }));
    }
    function setCounter() {
      Array.from(counter.children).forEach((c) => c.remove());
      const finals = H.ph === "finals" || H.ph === "done";
      const left = finals ? VT.length - H.vremoved.size : HL.length - H.removed.size;
      AT.forEach(([bx, bz, by, rr]) => [0, 90, 180, 270].forEach((a) => {
        const c = polar(rr - 0.2, a, 0); const g = el("m-group", { x: bx + c[0], y: by, z: bz + c[2], ry: a }, counter);
        digits(left, 0.8, { y: 0.6 }, g, false, true); word("remain", 0.4, { y: -0.05 }, g, true);
      }));
    }
    function setRound(key) {
      Array.from(rlabel.children).forEach((c) => c.remove());
      if (!key) return;
      AT.forEach(([bx, bz, by, rr]) => [0, 90, 180, 270].forEach((a) => { const c = polar(rr - 0.1, a, 0); word(key, 0.7, { x: bx + c[0], y: by + 1.4, z: bz + c[2], ry: a }, rlabel, true); }));
    }
    function setCountdown(secs) {   // between rounds: NEXT ROUND IN 9 ... in place of the PORTRAITS LEFT counter
      Array.from(counter.children).forEach((c) => c.remove());
      AT.forEach(([bx, bz, by, rr]) => [0, 90, 180, 270].forEach((a) => {
        const c = polar(rr - 0.2, a, 0); const g = el("m-group", { x: bx + c[0], y: by, z: bz + c[2], ry: a }, counter);
        word("nextin", 0.4, { y: 1.1 }, g, true); digits(secs, 0.8, { y: 0.45 }, g, false, true);
      }));
    }
    setBanner("notyet"); setCounter();
    function appraiser(line) { if (NPCS.appraiser) npcTalk(NPCS.appraiser, line, undefined, true); }
    function lockMsg(p, at, ry, wrongWord) {
      p.lock = now() + LOCKOUT_MS;
      const g = privWords([wrongWord || "forgery", "wait"], [at[0], at[1] + 0.95, at[2]], ry, p.id, 0, 0.36);
      const dg = el("m-group", { y: -0.95 }, g); let left = Math.round(LOCKOUT_MS / 1000);
      const tick = () => { Array.from(dg.children).forEach((c) => c.remove()); if (left <= 0) { g.remove(); return; } digits(left, 0.42, {}, dg, true); word("secs", 0.24, { y: -0.36 }, dg); left--; later(1000, tick); };
      tick();
      sfx("wrong.mp3", at[0], at[1], at[2], 0.8);
    }
    const front = (s, list) => { const [x, y, z, ry] = list[s]; const a = ry * Math.PI / 180; return [x + Math.sin(a) * 0.25, y, z + Math.cos(a) * 0.25, ry]; };
    function hallPick(s, id) {
      if (id === undefined) return; const p = pl(id); const at = front(s, HL);
      if (H.ph === "idle") { privWords(["notyet"], [at[0], at[1] + 0.95, at[2]], at[3], id, 3000, 0.36); return; }
      if (H.ph === "between") { privWords([p.fin ? "already" : "getready"], [at[0], at[1] + 0.95, at[2]], at[3], id, 3000, 0.36); return; }
      if (H.ph !== "hunt") { privWords([p.fin ? "already" : "roundover"], [at[0], at[1] + 0.95, at[2]], at[3], id, 3500, 0.36); return; }
      if (p.fin) { privWords(["already"], [at[0], at[1] + 0.95, at[2]], at[3], id, 3500, 0.36); return; }
      if (now() < p.lock) return;
      if (H.removed.has(s)) return;
      if (s !== realSlot()) { lockMsg(p, at, at[3]); return; }
      if (H.fin.length >= FINALISTS) { privWords(["vaultfull"], [at[0], at[1] + 0.95, at[2]], at[3], id, 4000, 0.36); return; }
      p.fin = true; p.fintime = now(); H.fin.push(id); doorFix();
      privWords(["found", "finalist"], [at[0], at[1] + 1.1, at[2]], at[3], id, 9000, 0.4);
      sfx("found.mp3", at[0], at[1], at[2], 1.0);
      hostMsg("ROUND " + H.round + " WON - FINALIST " + H.fin.length + "/" + FINALISTS + ": " + nameOf(p).toUpperCase());
      boards();
      if (H.fin.length >= FINALISTS) { H.ph = "allfound"; setBanner("allfound"); setRound(""); setCounter(); appraiser("round"); hostMsg("ALL " + FINALISTS + " FINALISTS FOUND - WHEN THEY'RE ALL IN THE GLASS ROOM, PRESS START THE FINALS"); return; }
      // round over: shuffle, then the next round starts by itself (or when the host presses NEXT ROUND)
      H.ph = "between"; setBanner("shuffling"); setRound("round" + (H.round + 1)); appraiser("round");
      const nm = H.round;
      later(1500, () => { if (H.ph === "between" && H.round === nm) shuffleHall(); });
      if (H.auto) armNext(); else setCounter();
    }
    // the countdown to the next round
    let nextTimer = 0;
    function armNext() {
      const nm = H.round, tok = ++H.tok; H.nextAt = now() + ROUND_GAP_MS;
      const tick = () => {
        if (H.ph !== "between" || H.round !== nm || tok !== H.tok || !H.auto || !H.nextAt) return;
        const left = Math.ceil((H.nextAt - now()) / 1000);
        if (left <= 0) { nextRound(); return; }
        setCountdown(left); nextTimer = later(1000, tick);
      };
      tick();
    }
    function shuffleHall() {
      H.shuf = H.round; H.map = shuffled(D.hallImgs.length).map((i) => D.hallImgs[i]); H.removed.clear();
      HALLM.forEach((m, s) => { if (!m.parentNode) fz.appendChild(m); ["sx", "sy", "sz"].forEach((k) => m.setAttribute(k, 1)); m.setAttribute("src", BASE + "portraits/pf_" + String(H.map[s]).padStart(4, "0") + ".glb" + VER); });
    }
    function nextRound() {
      if (H.ph !== "between") return H.ph === "hunt" ? "ROUND " + H.round + " IS ALREADY ON" : H.ph === "allfound" ? "ALL " + FINALISTS + " FINALISTS ARE FOUND - START THE FINALS" : H.ph === "idle" ? "OPEN THE HALL FIRST" : "THE HALL ROUNDS ARE OVER";
      if (H.shuf !== H.round) shuffleHall();
      H.round++; H.ph = "hunt"; H.t0 = now(); H.nextAt = 0;
      P.forEach((p) => { p.lock = 0; });
      setBanner("findfounder"); setRound("round" + H.round); setCounter(); appraiser("next");
      sfx("finals.mp3", 0, L.f2 + 6, 0, 0.7);
      return "ROUND " + H.round + " OF " + FINALISTS + " - GO! (PORTRAITS SHUFFLED)";
    }
    function vaultPick(s, id) {
      if (id === undefined) return; const p = pl(id); const at = front(s, VT);
      if (!p.fin) { privWords(["finalsonly"], [at[0], at[1] + 0.95, at[2]], at[3], id, 3500, 0.36); return; }
      if (H.ph !== "finals") { privWords([H.ph === "done" ? "roundover" : "vaultwait"], [at[0], at[1] + 0.95, at[2]], at[3], id, 3500, 0.36); return; }
      if (now() < p.lock || H.vremoved.has(s)) return;
      if (s !== vRealSlot()) { lockMsg(p, at, at[3]); return; }
      H.ph = "done"; H.winner = id; if (refFlag.parentNode) refFlag.remove();
      setBanner("winner"); appraiser("won");
      const pg = el("m-group", { x: D.refFlag[0], y: D.refFlag[1], z: D.refFlag[2] }, fz);
      word("champion", 0.6, { y: 3.2 }, pg); word("winner", 1.0, { y: 4.2 }, pg);
      const v = model("portraits/pv_" + String(D.realVault).padStart(3, "0") + ".glb", { y: 1.0, sx: 1.4, sy: 1.4, sz: 1.4, collide: "false" }, pg);
      anim(v, "ry", 0, 360, 9000);
      sfx("winner.mp3", 0, D.yv + 2, 0, 1.0);
      hostMsg("MUD MATCH CHAMPION: " + nameOf(p).toUpperCase());
      boards();
    }
    function hallOpen() {
      if (H.ph === "hunt" || H.ph === "between") return "THE HUNT IS ALREADY ON (ROUND " + H.round + ")";
      shuffleHall(); H.fin = []; H.winner = null; H.ph = "hunt"; H.round = 1; H.t0 = now(); H.nextAt = 0;
      P.forEach((p) => { p.fin = false; p.lock = 0; });
      doorFix(); setBanner("findfounder"); setRound("round1"); setCounter(); appraiser("open"); boards();
      return "THE HALL OF FAKES IS OPEN - ROUND 1 OF " + FINALISTS + " (PORTRAITS SHUFFLED)";
    }
    function startFinals() {
      if (H.ph === "finals") return "THE FINALS ARE ALREADY ON";
      if (!H.fin.length) return "NO FINALISTS YET";
      H.ph = "finals"; setRound(""); H.finT0 = now(); H.vmap = shuffled(VT.length); H.vremoved.clear();
      H.fin.forEach((id) => { pl(id).lock = 0; });
      VAULTM.forEach((m, s) => { if (!m.parentNode) fz.appendChild(m); m.setAttribute("sx", 1); m.setAttribute("sy", 1); m.setAttribute("sz", 1); m.setAttribute("src", BASE + "portraits/pv_" + String(H.vmap[s]).padStart(3, "0") + ".glb" + VER); });
      frostOff(); setBanner("findflag"); setCounter(); appraiser("finals");
      sfx("finals.mp3", 0, D.yv + 3, 0, 1.0);
      return "THE FINALS HAVE BEGUN - " + H.fin.length + " FINALISTS IN THE GLASS ROOM";
    }
    function thin() {
      const finals = H.ph === "finals";
      if (H.ph !== "hunt" && !finals) return "NOTHING TO THIN - OPEN THE HALL OR START THE FINALS FIRST";
      const list = finals ? VAULTM : HALLM, gone = finals ? H.vremoved : H.removed, real = finals ? vRealSlot() : realSlot();
      const fakes = list.map((_, s) => s).filter((s) => s !== real && !gone.has(s));
      const keep = 9, cut = Math.min(fakes.length - keep, Math.ceil((fakes.length - keep) / 2));
      if (cut <= 0) return "ONLY 10 LEFT - CAN'T THIN ANY MORE";
      for (let i = fakes.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fakes[i], fakes[j]] = [fakes[j], fakes[i]]; }
      fakes.slice(0, cut).forEach((s, i) => {
        gone.add(s); const m = list[s];
        later(Math.random() * 2500, () => { ["sx", "sy", "sz"].forEach((k) => tween(m, k, 1, 0.01, 700, "easeInBack")); later(780, () => m.remove()); });
      });
      later(3300, setCounter); appraiser("thin");
      return "THE FORGERS FLED - " + cut + " FAKES TAKEN DOWN, " + (list.length - gone.size) + " PORTRAITS LEFT";
    }
    function hallReset() {
      H.ph = "idle"; H.round = 0; H.nextAt = 0; H.fin = []; H.winner = null; H.removed.clear(); H.vremoved.clear(); setRound("");
      P.forEach((p) => { p.fin = false; p.lock = 0; });
      HALLM.forEach((m) => { if (!m.parentNode) fz.appendChild(m); ["sx", "sy", "sz"].forEach((k) => m.setAttribute(k, 1)); });
      VAULTM.forEach((m) => { if (!m.parentNode) fz.appendChild(m); ["sx", "sy", "sz"].forEach((k) => m.setAttribute(k, 1)); });
      Array.from(fz.children).filter((c) => c.tagName && c.tagName.toUpperCase() === "M-GROUP" && c !== banner && c !== counter && c !== rlabel).forEach((c) => c.remove());
      if (!refFlag.parentNode) fz.appendChild(refFlag); frostOn();
      doorFix(); setBanner("notyet"); setCounter(); boards();
      return "HALL OF FAKES RESET";
    }

    // ---------------------------------------------------- leaderboards (names are the one place text is allowed)
    const LB = el("m-group", {});
    function boards() {
      Array.from(LB.children).forEach((c) => c.remove());
      const lines = H.fin.map((id, i) => (i + 1) + ". " + nameOf(pl(id)) + (H.winner === id ? "  - CHAMPION" : ""));
      if (!lines.length) return;
      D.finalBoards.forEach(([x, y, z, ry]) => {
        const g = el("m-group", { x, y, z, ry }, LB);
        word("finalists", 0.5, { y: 0.55 }, g);
        el("m-label", { content: lines.join("\n"), y: -0.9, width: 3.4, height: 2.3, "font-size": 22, alignment: "center", color: "#20140a", "font-color": "#ffe6a8", emissive: 0.35, collide: "false" }, g);
      });
    }

    // ---------------------------------------------------- where everyone is (zones, greetings)
    const probe = el("m-position-probe", { range: 600, interval: 400 });
    const INSIDE = new Set();
    const onPos = (e) => {
      const id = e.detail && e.detail.connectionId; if (id === undefined) return;
      const er = e.detail.elementRelative && e.detail.elementRelative.position;
      const dr = (e.detail.documentRelative && e.detail.documentRelative.position) || e.detail.position;
      const ok = (v) => v && typeof v.x === "number" && !isNaN(v.x);
      const pos = ok(er) ? er : ok(dr) ? { x: dr.x, y: dr.y, z: dr.z + FRONT } : null;
      if (!pos) return;
      const p = pl(id); p.pos = { x: pos.x, y: pos.y, z: pos.z };
      if (inside(pos.x, pos.z, 6) && pos.y > -5 && pos.y < 60) INSIDE.add(id); else INSIDE.delete(id);
      zoneSee(id, p.pos);
      greetCheck(p);
    };
    probe.addEventListener("positionenter", onPos); probe.addEventListener("positionmove", onPos);
    probe.addEventListener("positionleave", (e) => { INSIDE.delete(e.detail && e.detail.connectionId); zoneAll(e.detail && e.detail.connectionId); });
    onWin("disconnected", (e) => INSIDE.delete(e.detail && e.detail.connectionId));
    onWin("connected", () => doorFix());

    // ==================================================== host commands + what the remote shows
    const zoneOf = (p) => (p.pos ? zKey(p.pos.x, p.pos.y, p.pos.z) : "?");
    return {
      _P: P,
      refresh() { doorFix(); setBanner(H.ph === "hunt" ? "findfounder" : H.ph === "between" ? "shuffling" : H.ph === "allfound" ? "allfound" : H.ph === "finals" ? "findflag" : H.ph === "done" ? "winner" : "notyet");
                  setRound(H.ph === "hunt" ? "round" + H.round : H.ph === "between" ? "round" + (H.round + 1) : ""); if (H.ph !== "between") setCounter(); boards(); },
      game(tn) {
        const finals = H.ph === "finals" || H.ph === "done";
        return { ph: H.ph, left: finals ? VT.length - H.vremoved.size : HL.length - H.removed.size, fin: H.fin.length, finMax: FINALISTS,
                 finalists: H.fin.map((id) => nameOf(pl(id))), ready: H.ph === "allfound", round: H.round, rounds: FINALISTS, auto: H.auto, nextIn: H.ph === "between" && H.nextAt ? Math.max(0, Math.ceil((H.nextAt - tn) / 1000)) : -1, inVault: H.fin.filter((id) => { const p = pl(id); return p.pos && Math.abs(p.pos.x) < D.room[0] && Math.abs(p.pos.z) < D.room[1] && Math.abs(p.pos.y - D.yv) < 3; }).length, winner: H.winner !== null ? nameOf(pl(H.winner)) : "",
                 huntSecs: H.t0 ? Math.round((tn - H.t0) / 1000) : 0, inside: INSIDE.size, npcMode: NPC_MODE,
                 talking: Object.values(NPCS).filter((n) => n.talking).map((n) => n.key), liftMusic: Object.values(LIFTS).some((s) => s.music.parentNode),
                 lifts: Object.fromEntries(Object.entries(LIFTS).map(([k, s]) => [k, s.status()])) };
      },
      players(tn) {
        return Array.from(ONLINE).map((id) => { const p = pl(id); return [id, nameOf(p), zoneOf(p), p.fin ? 1 : 0, Math.max(0, Math.ceil((p.lock - tn) / 1000)), H.winner === id ? 1 : 0]; });
      },
      command(cmd, rest, parts) {
        const a1 = (parts[1] || "").toLowerCase();
        if (cmd === "hall") {
          if (a1 === "open" || a1 === "start") return hallOpen();
          if (a1 === "thin") return thin();
          if (a1 === "next") return nextRound();
          if (a1 === "auto") { const v = (parts[2] || "").toLowerCase(); H.auto = v === "on" ? true : v === "off" ? false : !H.auto;
            if (H.ph === "between") { if (H.auto && !H.nextAt) armNext(); if (!H.auto) { H.nextAt = 0; H.tok++; setCounter(); } }
            return "NEXT ROUND: " + (H.auto ? "STARTS BY ITSELF AFTER " + ROUND_GAP_MS / 1000 + " SECONDS" : "WAITS FOR YOU (PRESS NEXT ROUND)"); }
          if (a1 === "finals") return startFinals();
          if (a1 === "reset") return hallReset();
          return "HALL: open / next / auto on|off / thin / finals / reset";
        }
        if (cmd === "lift") {                                         // lift A lounge | lift B 3
          const s = LIFTS[(parts[1] || "").toUpperCase()]; if (!s) return "LIFT A or LIFT B";
          const want = (parts[2] || "").toLowerCase(); let k = s.Lf.keys.indexOf(want);
          if (k < 0 && /^\d$/.test(want)) k = +want; if (k < 0 || k >= s.Lf.keys.length) return "LIFT " + s.id + " STOPS: " + s.Lf.keys.join(" / ");
          s.request(k); return "LIFT " + s.id + " CALLED TO " + s.Lf.keys[k].toUpperCase();
        }
        if (cmd === "liftmusic") {                                    // liftmusic on|off
          const on = a1 === "on" ? true : a1 === "off" ? false : !Object.values(LIFTS).some((s) => s.music.parentNode);
          Object.values(LIFTS).forEach((s) => { if (on && !s.music.parentNode) s.musicHome.appendChild(s.music); if (!on && s.music.parentNode) s.music.remove(); });
          return on ? "ELEVATOR MUSIC ON" : "ELEVATOR MUSIC OFF";
        }
        if (cmd === "npc") {                                          // npc mode on|host|off   |   npc say <who> <line>   |   npc hush
          if (a1 === "mode") {
            const m = (parts[2] || "").toLowerCase(); if (!["on", "host", "off"].includes(m)) return "NPC MODE on / host / off";
            NPC_MODE = m; if (m === "off") Object.values(NPCS).forEach((n) => { if (!n.cur || n.cur.source !== "host") npcStop(n); });
            return m === "on" ? "CHARACTERS: ALL ON - CLICK TO TALK, GREETINGS AND ANNOUNCEMENTS" : m === "host" ? "CHARACTERS: HOST ONLY - CLICKS AND GREETINGS OFF, ONLY YOUR BUTTONS (AND GAME ANNOUNCEMENTS)" : "CHARACTERS: ALL OFF - NOBODY TALKS BY THEMSELVES (YOUR BUTTONS STILL WORK)";
          }
          if (a1 === "hush") { Object.values(NPCS).forEach(npcStop); return "EVERY CHARACTER STOPPED TALKING"; }
          if (a1 === "say") {
            const n = NPCS[(parts[2] || "").toLowerCase()], line = parts[3] || ""; if (!n) return "NPC SAY <who> <line> - WHO: " + Object.keys(NPCS).join(" / ");
            if (!n.lines[line]) return "NO LINE " + line.toUpperCase() + " FOR " + n.key.toUpperCase();
            npcTalk(n, line, undefined, true, "host"); return n.key.toUpperCase() + " SAYS: " + line.toUpperCase();
          }
          return "NPC: mode on|host|off, say <who> <line>, hush";
        }
        if (cmd === "name") {                                         // name <id> <text>
          const id = +parts[1]; const t = parts.slice(2).join(" ").slice(0, 18); if (!ONLINE.has(id) || !t) return "NAME <player id> <name>";
          pl(id).name = t; NAMES.set(id, t); boards(); return "PLAYER " + id + " IS NOW " + t.toUpperCase();
        }
        if (cmd === "finalist") {                                     // host can add someone to the finals by hand
          const id = +parts[1]; if (!ONLINE.has(id)) return "FINALIST <player id>";
          const p = pl(id); if (!p.fin) { p.fin = true; H.fin.push(id); doorFix(); boards(); } return nameOf(p).toUpperCase() + " IS A FINALIST";
        }
        return null;
      },
    };
  }
})();
</script>
