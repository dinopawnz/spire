    LITE.removed.slice().reverse().forEach((r) => { if (r.next && r.next.parentNode === r.parent) r.parent.insertBefore(r.n, r.next); else r.parent.appendChild(r.n); });
    const n = LITE.removed.length; LITE = null;
    return "LITE MODE OFF - " + n + " PIECES ARE BACK";
  }
  function refreshAll() {
    const groups = Object.values(ZONES);
    groups.forEach((g) => { const parent = g.parentNode, next = g.nextSibling; g.remove(); if (next && next.parentNode === parent) parent.insertBefore(g, next); else parent.appendChild(g); });
    let seen = 0;
    ONLINE.forEach((id) => { const p = GAME && GAME._P.get(id); if (p && p.pos) { zoneSee(id, p.pos); seen++; } else zoneAll(id); });
    try { GAME && GAME.refresh(); } catch (e) {}
    return "REFRESHED - " + groups.length + " AREAS RE-SENT (" + seen + " PLAYERS PLACED BY POSITION). PROGRESS KEPT.";
  }
  function build() {
    if (GAME) return "ALREADY BUILT";
    WORLD = el("m-group", { z: -FRONT }, rootGroup);
    ROOT = WORLD;
    placer.setAttribute("y", PARK);
    try { GAME = buildWorld(); }
    catch (e) { hostMsg("BUILD ERROR: " + (e && e.message)); }
    try { zoneUp(WORLD); } catch (e) { hostMsg("ZONE ERROR: " + (e && e.message)); }
    ONLINE.forEach(zoneAll);
    builtAt = now();
    return "LIVE BUILD ON - THE SPIRE IS UP";
  }
  function unbuild() {
    if (!WORLD) return "ALREADY FOLDED";
    LITE = null;
    TIMERS.forEach((h) => _clrT(h)); TIMERS.clear();
    INTERVALS.forEach((h) => _clrI(h)); INTERVALS.clear();
    LISTENERS.forEach(([ev, f]) => window.removeEventListener(ev, f)); LISTENERS.length = 0;
    WORLD.remove(); WORLD = null; GAME = null; ROOT = rootGroup;
    for (const k in ZONES) { delete ZONES[k]; delete ZSET[k]; }
    placer.setAttribute("y", 0);
    return "LIVE BUILD OFF - BACK TO THE PLACER CUBE";
  }
  hostPrompt.addEventListener("prompt", (e) => {
    const raw = String((e && e.detail && e.detail.value) || "").replace(/\s+/g, " ").trim();
    if (raw.indexOf(HOST_CODE) !== 0) { hostMsg("WRONG CODE"); return; }
    const rest = raw.slice(HOST_CODE.length).trim();
    const parts = rest.split(" ").filter(Boolean);
    const cmd = (parts[0] || "").toLowerCase();
    const id = e.detail.connectionId;
    if (cmd === "remote") {
      if (id === undefined) { hostMsg("REMOTE: NO CONNECTION ID"); return; }
      REMOTES.add(id); ONLINE.delete(id); remoteBoard.setAttribute("visible-to", Array.from(REMOTES).join(" "));
      hostMsg("UNLOCKED"); paintRemote(); return;
    }
    if (cmd === "build") { hostMsg(build()); return; }
    if (cmd === "unbuild") { hostMsg(unbuild()); return; }
    if (!GAME) { hostMsg("NOT BUILT YET - PRESS LIVE BUILD FIRST"); return; }
    if (cmd === "lite") { const a = (parts[1] || "").toLowerCase(); hostMsg(a === "off" ? liteOff() : a === "on" ? liteOn() : LITE ? liteOff() : liteOn()); return; }
    if (cmd === "refresh") { hostMsg(refreshAll()); return; }
    let reply = null;
    try { reply = GAME.command(cmd, rest, parts); } catch (err) { reply = "ERROR: " + (err && err.message); }
    hostMsg(reply || "UNKNOWN: " + cmd);
  });
  window.addEventListener("connected", (e) => { if (e.detail && !REMOTES.has(e.detail.connectionId)) { ONLINE.add(e.detail.connectionId); zoneAll(e.detail.connectionId); } });
  window.addEventListener("disconnected", (e) => {
    const c = e.detail.connectionId;
    ONLINE.delete(c);
    if (REMOTES.delete(c)) remoteBoard.setAttribute("visible-to", REMOTES.size ? Array.from(REMOTES).join(" ") : "-1");
  });
  if (AUTO_BUILD_MS > 0) _setT(() => { if (!GAME) hostMsg(build()); }, AUTO_BUILD_MS);

  // ==========================================================
  // THE WORLD
  // ==========================================================
  function buildWorld() {
    const L = D.L;
    const P = new Map();                       // connectionId -> player
    const pl = (id) => { if (!P.has(id)) P.set(id, { id, name: NAMES.get(id) || "", pos: null, lock: 0, fin: false, fintime: 0 }); return P.get(id); };
    const nameOf = (p) => (p.name ? p.name : "Player #" + p.id);
    const everyone = () => Array.from(ONLINE);
    const hideFrom = (n, a) => { if (!a.length) { n.removeAttribute("visible-to"); return; } const skip = new Set(a.map(String)); const keep = everyone().filter((id) => !skip.has(String(id))); n.setAttribute("visible-to", keep.length ? keep.join(" ") : "-1"); };
    const showTo = (n, a) => n.setAttribute("visible-to", a.length ? a.join(" ") : "-1");
    const priv = el("m-group", {});            // per-player pieces (each carries its own visible-to)
    priv._global = true;

    // ---------------------------------------------------- the tower, floors and lift shafts (static)
    const STATIC = [["sp_shell", 1], ["sp_boardwalk", 0], ["sp_f1_lounge", 1], ["sp_f2_hall", 1], ["sp_f2_vault", 1], ["sp_f3_room", 1], ["sp_liftA_shaft", 0], ["sp_liftB_shaft", 0]];
    STATIC.forEach(([f, sh]) => model(f + ".glb", { collide: "false", "cast-shadows": sh ? "true" : "false" }));
    // the invisible floors, walls, stair ramp and rails. They must NOT carry visible="false" (Otherside then never loads them and nothing
    // is solid) - their material is already fully see-through, so they're loaded normally and stay invisible.
    ["sp_shell_col", "sp_f1_col", "sp_f2_col", "sp_f2_vaultcol", "sp_f3_col", "sp_lift_col"].forEach((f) => model(f + ".glb", { collide: "true" }));
    // backup floors made the castle's way (invisible boxes) under the boardwalk, the steps and the porch / lounge, so the way in is
    // solid even if a collision model fails to load
    {
      const z0 = L.A_porch + 5.0, z1 = L.A_porch + L.walk_len, y = L.walk_y, hw = L.walk_w / 2;
      pad({ x: 0, y: y - 0.15, z: (z0 + z1) / 2, width: 2 * hw + 0.2, height: 0.3, depth: z1 - z0 });
      const n = 13, tread = 0.38, ln = n * tread, hh = L.porch - y, sl = Math.hypot(ln, hh), ang = Math.atan2(hh, ln) * 180 / Math.PI;
      pad({ x: 0, y: y + hh / 2 - 0.12, z: z0 - ln / 2, width: 2 * hw, height: 0.3, depth: sl, rx: ang });
      pad({ x: 0, y: L.porch - 0.15, z: (z0 - ln + L.A_porch) / 2, width: 2 * hw, height: 0.3, depth: (z0 - ln) - L.A_porch + 0.6 });
      const A = L.A_porch, w = 2 * A * Math.tan(Math.PI / 8);
      [0, 45, 90, 135].forEach((a) => pad({ x: 0, y: L.porch - 0.15, z: 0, width: 2 * A, height: 0.3, depth: w, ry: a }));
    }
    // the lounge's wagon-wheel chandeliers, swaying a touch
    [[0, -8], [-6, 9], [15, 12], [-18, -6], [17, -10]].forEach(([x, z], i) => {
      const g = el("m-group", { x, y: L.f2 - 0.55, z });
      anim(g, "rz", -1.6, 1.6, 5200 + i * 700, { pingPong: true, easing: "easeInOutSine", delay: i * 900 });
      model("sp_chandelier.glb", { collide: "false" }, g);
    });

    // ---------------------------------------------------- sprites (words as pictures)
    const ASP = D.ms;
    function word(key, h, attrs, parent, one) {   // a glowing word model, h metres tall. one = one-sided (for signs hung back to back)
      return model((one ? "ms1_" : "ms_") + key + ".glb", Object.assign({ sx: h, sy: h, sz: h, collide: "false" }, attrs || {}), parent);
    }
    function digits(n, h, attrs, parent, red, one) {   // a centred row of digit models
      const g = el("m-group", attrs || {}, parent);
      const s = String(Math.max(0, Math.round(n))); const w = s.split("").map((c) => (ASP["d" + c] || 0.6) * h * 0.8);
      let x = -w.reduce((a, b) => a + b, 0) / 2;
      s.split("").forEach((c, i) => { word((red ? "r" : "d") + c, h, { x: x + w[i] / 2 }, g, one); x += w[i]; });
      return g;
    }
    function privWords(keys, at, ry, id, ms, h) {   // one or more word lines shown only to one player, then gone
      const g = el("m-group", { x: at[0], y: at[1], z: at[2], ry, "visible-to": String(id) }, priv);
      keys.forEach((k, i) => word(k, h || 0.42, { y: -i * (h || 0.42) * 1.15 }, g));
      if (ms) later(ms, () => g.remove());
      return g;
    }

    // ---------------------------------------------------- NPCs
    const NPCS = {};
    function npc(key, x, y, z, ry, parent, sc) {
      const g = el("m-group", Object.assign({ x, y, z, ry }, sc ? { sx: sc, sy: sc, sz: sc } : {}), parent);
      const m = model("npc_" + key + ".glb", { collide: "false", anim: BASE + "npc_" + key + "_idle.glb" + VER, "anim-loop": "true" }, g);
      const hb = hitBox({ y: 1.0, width: 1.0, height: 2.0, depth: 0.9 }, g);
      const n = { key, g, m, i: 0, talking: false, cur: null, greeted: new Map(), lines: D.npc[key].lines, x, y, z, parent };
      hb.addEventListener("click", (e) => { const id = e.detail && e.detail.connectionId; if (id === undefined) return; if (npcTalk(n, peekLine(n), id, false, "click")) n.i++; });
      NPCS[key] = n; return n;
    }
    function peekLine(n) { const ts = Object.keys(n.lines).filter((k) => /^t\d+$/.test(k)); return ts[n.i % ts.length]; }   // moves on only when the line is actually said
    function headPos(n) {
      if (n.parent && n.parent !== WORLD) { const px = +n.parent.getAttribute("x") || 0, py = +n.parent.getAttribute("y") || 0, pz = +n.parent.getAttribute("z") || 0; return [px + n.x, py + n.y, pz + n.z]; }
      return [n.x, n.y, n.z];
    }
    // NPC_MODE (host remote): "on" = click / greet / game announcements, "host" = clicks + greetings do nothing (game announcements
    // still play), "off" = nothing talks by itself. Lines the host sends from the remote ("npc say <who> <line>") always play.
    let NPC_MODE = "on";
    function npcStop(n) {
      if (!n.cur) return;
      n.cur.timers.forEach(cancel); if (n.cur.bub) n.cur.bub.remove(); if (n.cur.audio) n.cur.audio.remove();
      n.cur = null; n.talking = false;
      n.m.setAttribute("anim", BASE + "npc_" + n.key + "_idle.glb" + VER);
    }
    // source: "click" | "greet" | "game" | "host". One line at a time: while a character talks, clicks and greetings are ignored;
    // a game announcement or a host line cuts in (a host line is never cut off by anything but another host line).
    function npcTalk(n, line, id, everyoneHears, source) {
      source = source || "game";
      const info = n.lines[line]; if (!info) return false;
      if (source !== "host") {
        if (NPC_MODE === "off") return false;
        if (NPC_MODE === "host" && (source === "click" || source === "greet")) return false;
        if (n.talking && (source === "click" || source === "greet")) return false;
        if (n.talking && n.cur && n.cur.source === "host") return false;
      }
      npcStop(n);
      const [asp, dur] = info; const ms = Math.round(dur * 1000 + 1200);
      const hp = headPos(n), tall = (D.npcH[n.key] || 1.8) * (+n.g.getAttribute("sy") || 1);
      const p = id !== undefined ? pl(id) : null;
      const ry = p && p.pos ? faceTo(hp, p.pos) : (+n.g.getAttribute("ry") || 0);
      const bub = el("m-group", Object.assign({ x: hp[0], y: hp[1] + tall + 0.75, z: hp[2], ry }, everyoneHears || id === undefined ? {} : { "visible-to": String(id) }), priv);
      model("sb_" + n.key + "_" + line + ".glb", { sx: 0.95, sy: 0.95, sz: 0.95, collide: "false" }, bub);
      const audio = VOICES ? el("m-audio", { src: BASE + "vo_" + n.key + "_" + line + ".mp3" + VER, x: hp[0], y: hp[1] + 1.6, z: hp[2], loop: "false", volume: 1.0, "start-time": Math.round(now()) }) : null;
      n.m.setAttribute("anim", BASE + "npc_" + n.key + "_talk.glb" + VER);
      n.talking = true;
      const cur = { source, bub, audio, timers: [] }; n.cur = cur;
      cur.timers.push(later(ms, () => { if (n.cur === cur) npcStop(n); }));
      return true;
    }
    const W = D.where;
    npc("ferryman", ...W.ferryman);
    npc("barkeep", ...W.barkeep, undefined, 1.3);           // a short frog behind a tall bar: a bit bigger so she shows
    npc("gator", ...W.gator);
    npc("appraiser", ...W.appraiser);
    npc("skipper", ...W.skipper);
    npc("dealer", ...W.dealer);
    // greet: once a minute, the first time you walk up to someone
    function greetCheck(p) {
      const t = now();
      for (const k in NPCS) {
        const n = NPCS[k]; if (!n.lines.greet) continue;
        const hp = headPos(n);
        if (Math.abs(p.pos.y - hp[1]) > 3 || Math.hypot(p.pos.x - hp[0], p.pos.z - hp[2]) > 5) continue;
        if (t - (n.greeted.get(p.id) || -1e9) < 60000) continue;
        if (n.talking || NPC_MODE !== "on") continue;
        n.greeted.set(p.id, t); npcTalk(n, "greet", p.id, false, "greet");
      }
    }

    // ---------------------------------------------------- the bar: taps that pour, mugs that slide down to you
    const MUGS = [];
    D.taps.forEach(([x, y, z], i) => {
      const tg = el("m-group", { x, y, z });
      const handle = model("sp_tap.glb", { collide: "false" }, tg);
      const hb = hitBox({ y: 0.18, width: 0.16, height: 0.42, depth: 0.16 }, tg);
      let busy = false;
      hb.addEventListener("click", (e) => {
        const id = e.detail && e.detail.connectionId; if (id === undefined || busy) return; busy = true;
        tween(handle, "rx", 0, 38, 400, "easeOutQuad"); later(2600, () => tween(handle, "rx", 38, 0, 500, "easeInOutQuad"));
        const sp = [x, D.barTop + 0.33, z + 0.2];
        const pour = model("sp_pour.glb", { x: sp[0], y: sp[1], z: sp[2], sy: 0.01, collide: "false" });
        tween(pour, "sy", 0.01, 0.62, 300, "linear");
        const mug = el("m-group", { x: sp[0], y: D.trayTop, z: sp[2] });
        model("sp_mug.glb", { collide: "false" }, mug);
        sfx("pour.mp3", sp[0], sp[1], sp[2], 0.7);
        later(2500, () => { pour.remove(); busy = false;
          const p = pl(id); let tx = p.pos ? Math.max(D.bar[0] + 0.5, Math.min(D.bar[1] - 0.5, p.pos.x)) : x + 3;
          const tz = D.barFront;
          tween(mug, "z", sp[2], tz, 600, "easeOutQuad"); tween(mug, "y", D.trayTop, D.barTop, 400, "easeInQuad");
          const dist = Math.abs(tx - sp[0]); tween(mug, "x", sp[0], tx, Math.max(700, dist * 260), "easeOutQuart");
          if (NPCS.barkeep) npcTalk(NPCS.barkeep, "pour" + (i % 4), id, false, "click");
          // click your own beer to drink it: it lifts, tips back for a big swig (gulp gulp), and it's gone
          const drink = hitBox({ y: 0.11, width: 0.3, height: 0.32, depth: 0.3 }, mug);
          drink.addEventListener("click", (ev) => {
            const who = ev.detail && ev.detail.connectionId;
            if (who !== id || mug._drunk) return; mug._drunk = true; drink.remove();
            const y0 = +mug.getAttribute("y") || D.barTop, mx = +mug.getAttribute("x"), mz = +mug.getAttribute("z");
            tween(mug, "y", y0, y0 + 0.45, 500, "easeOutQuad");
            later(350, () => tween(mug, "rx", 0, -78, 600, "easeInOutQuad"));
            sfx("gulp.mp3", mx, y0 + 0.5, mz, 0.85);
            later(1700, () => { ["sx", "sy", "sz"].forEach((k) => tween(mug, k, 1, 0.01, 300, "easeInBack")); later(380, () => { const k = MUGS.indexOf(mug); if (k >= 0) MUGS.splice(k, 1); mug.remove(); }); });
          });
          MUGS.push(mug); if (MUGS.length > 30) MUGS.shift().remove();
          later(MUG_LIFE, () => { const k = MUGS.indexOf(mug); if (k >= 0) MUGS.splice(k, 1); mug.remove(); });
        });
      });
    });

    // ---------------------------------------------------- guest book (porch) - the name you sign shows on the leaderboards
    D.books.forEach(([x, y, z, ry]) => {
      const pr = el("m-prompt", { x, y, z, ry, message: "Sign the Mudwater Guest Book - type the name you want on the leaderboards", placeholder: "Your name (up to 18 letters)" });
      model("sp_guestbook.glb", { collide: "true" }, pr);
      pr.addEventListener("prompt", (e) => {
        const id = e.detail && e.detail.connectionId; if (id === undefined) return;
        const raw = String(e.detail.value || "").replace(/[<>\u0000-\u001f]/g, "").replace(/\s+/g, " ").trim().slice(0, 18);
        if (!raw) return;
        const p = pl(id); p.name = raw; NAMES.set(id, raw);
        sfx("lift_chime.mp3", x, y + 1, z, 0.5);
        hostMsg("PLAYER " + id + " SIGNED IN AS " + raw.toUpperCase());
        boards();
      });
    });

    // ==================================================== THE LIFTS
    const LIFTS = {};
    D.lifts.forEach((Lf) => {
      const id = Lf.id, x = Lf.x, z = Lf.z, ci = Lf.cab;
      const st = { id, at: 0, busy: false, open: false, req: new Set(), dir: 1, lastUse: now(), Lf };
      const SY = D.sheaveY, HITCH = D.hitch, ROPE = D.rope;
      const cwTop = (cy) => SY - (ROPE - (SY - (cy + HITCH)));
      // --- the cab (everything that rides)
      const CG = el("m-group", { x, y: Lf.stops[0], z }); CG._global = true;
      model("sp_lift" + id + "_cab.glb", { collide: "false" }, CG);
      const cgR = model("sp_lift_cgate.glb", { x: ci.gate_r[0], z: ci.gate_r[2], collide: "false" }, CG);
      const cgL = model("sp_lift_cgate.glb", { x: ci.gate_l[0], z: ci.gate_l[2], ry: 180, collide: "false" }, CG);
      const gears = [ci.gear_l, ci.gear_r].map((g) => model("sp_lift_cabgear.glb", { x: g[0], y: g[1], z: g[2], collide: "false" }, CG));
      const lever = model("sp_lift_lever.glb", { x: ci.lever[0], y: ci.lever[1], z: ci.lever[2], ry: ci.lever_ry, collide: "false" }, CG);
      const needleIn = model("sp_lift_needle.glb", { x: ci.needle_in[0], y: ci.needle_in[1], z: ci.needle_in[2], ry: 180, rz: Lf.dial_rz[0], collide: "false" }, CG);
      const needleOut = model("sp_lift_needle.glb", { x: ci.needle_out[0], y: ci.needle_out[1], z: ci.needle_out[2], rz: Lf.dial_rz[0], collide: "false" }, CG);
      // floor, walls (door side open), the cab gate's collider
      [0, 45, 90, 135].forEach((a) => pad({ y: -0.13, width: 4.05, height: 0.26, depth: 1.66, ry: a }, CG));
      for (let i = 0; i < 7; i++) { const a = 45 + 45 * i, c = polar(D.cabApo + 0.03, a, 1.3); pad({ x: c[0], y: c[1], z: c[2], ry: a, width: 1.8, height: 2.6, depth: 0.12 }, CG); }
      pad({ y: -0.13, z: D.cabApo + 0.13, width: 1.7, height: 0.26, depth: 0.3 }, CG);               // the sill
      const cgatePad = pad({ y: 1.25, z: D.cabApo - 0.02, width: 1.8, height: 2.5, depth: 0.12 }, CG);
      // elevator music, playing softly inside the cab (riders hear it; it fades a few metres outside the glass)
      const music = el("m-audio", { src: BASE + "lift_music.mp3" + VER, y: 2.3, loop: "true", volume: 0.32, "start-time": id === "A" ? 0 : -9000 }, CG);
      st.music = music; st.musicHome = CG;
      // the operator (the host's own ape) rides the Grand Cage
      if (id === "A") npc("operator", ci.operator[0], ci.operator[1], ci.operator[2], ci.operator_ry, CG);
      // floor buttons inside the cab (pictures of the floor names) on the front-left diagonal
      Lf.keys.forEach((key, k) => {
        const c = polar(D.cabApo - 0.06, 315, 0.95 + k * 0.3);
        const bg = el("m-group", { x: c[0], y: c[1], z: c[2], ry: 135 }, CG);
        word("fl_" + key, 0.2, {}, bg);
        const hb = hitBox({ width: Math.min(1.5, (ASP["fl_" + key] || 4) * 0.2), height: 0.24, depth: 0.06 }, bg);
        hb.addEventListener("click", (e) => request(st, k, e.detail && e.detail.connectionId));
      });
      // --- the shaft: landing gates, their colliders, dials, call buttons
      const LANDS = Lf.portals.map((po, k) => {
        const gR = model("sp_lift_lgate.glb", { x: po.gate_r[0], y: po.gate_r[1], z: po.gate_r[2], collide: "false" });
        const gL = model("sp_lift_lgate.glb", { x: po.gate_l[0], y: po.gate_l[1], z: po.gate_l[2], ry: 180, collide: "false" });
        const gp = pad({ x: po.gate_col[0], y: po.gate_col[1] + 1.45, z: po.gate_col[2], width: 1.85, height: 2.9, depth: 0.15 });
        const nd = model("sp_lift_needle.glb", { x: po.needle[0], y: po.needle[1], z: po.needle[2], rz: Lf.dial_rz[0], sx: po.needle_scale, sy: po.needle_scale, sz: po.needle_scale, collide: "false" });
        const cb = el("m-group", { x: po.call[0], y: po.call[1], z: po.call[2] });
        model("sp_lift_call.glb", { collide: "false" }, cb);
        const glow = model("sp_lift_callglow.glb", { collide: "false" }, cb); glow.remove();
        const hb = hitBox({ y: 0.02, width: 0.3, height: 0.42, depth: 0.16 }, cb);
        hb.addEventListener("click", (e) => request(st, k, e.detail && e.detail.connectionId));
        return { po, gR, gL, gp, nd, cb, glow, gpY: po.gate_col[1] + 1.45 };
      });
      // --- the machine head, ropes and counterweight
      const sheave = model("sp_lift_sheave.glb", { x: Lf.sheave[0], y: Lf.sheave[1], z: Lf.sheave[2], collide: "false" });
      const pinion = model("sp_lift_pinion.glb", { x: Lf.pinion[0], y: Lf.pinion[1], z: Lf.pinion[2], collide: "false" });

      _P: P,
      refresh() { doorFix(); setBanner(H.ph === "hunt" ? "findfounder" : H.ph === "between" ? "shuffling" : H.ph === "allfound" ? "allfound" : H.ph === "finals" ? "findflag" : H.ph === "done" ? "winner" : "notyet");
                  setRound(H.ph === "hunt" ? "round" + H.round : H.ph === "between" ? "round" + (H.round + 1) : ""); if (H.ph !== "between") setCounter(); boards(); },
      game(tn) {
        const finals = H.ph === "finals" || H.ph === "done";
        return { ph: H.ph, left: finals ? VT.length - H.vremoved.size : HL.length - H.removed.size, fin: H.fin.length, finMax: FINALISTS,
                 finalists: H.fin.map((id) => nameOf(pl(id))), ready: H.ph === "allfound", round: H.round, rounds: FINALISTS, auto: H.auto, nextIn: H.ph === "between" && H.nextAt ? Math.max(0, Math.ceil((H.nextAt - tn) / 1000)) : -1, inVault: H.fin.filter((id) => { const p = pl(id); return p.pos && Math.hypot(p.pos.x, p.pos.z) < 8.9 && Math.abs(p.pos.y - D.L.gallery) < 3; }).length, winner: H.winner !== null ? nameOf(pl(H.winner)) : "",
                 huntSecs: H.t0 ? Math.round((tn - H.t0) / 1000) : 0, inside: INSIDE.size, npcMode: NPC_MODE,
                 talking: Object.values(NPCS).filter((n) => n.talking).map((n) => n.key), liftMusic: Object.values(LIFTS).some((s) => s.music.parentNode),
                 lifts: Object.fromEntries(Object.entries(LIFTS).map(([k, s]) => [k, s.status()])) };
      },
      players(tn) {
        return Array.from(ONLINE).map((id) => { const p = pl(id); return [id, nameOf(p), zoneOf(p), p.fin ? 1 : 0, Math.max(0, Math.ceil((p.lock - tn) / 1000)), H.winner === id ? 1 : 0]; });
      },
      command(cmd, rest, parts) {
        const a1 = (parts[1] || "").toLowerCase();
        if (cmd === "hall") {
          if (a1 === "open" || a1 === "start") return hallOpen();
          if (a1 === "thin") return thin();
          if (a1 === "next") return nextRound();
          if (a1 === "auto") { const v = (parts[2] || "").toLowerCase(); H.auto = v === "on" ? true : v === "off" ? false : !H.auto;
            if (H.ph === "between") { if (H.auto && !H.nextAt) armNext(); if (!H.auto) { H.nextAt = 0; H.tok++; setCounter(); } }
            return "NEXT ROUND: " + (H.auto ? "STARTS BY ITSELF AFTER " + ROUND_GAP_MS / 1000 + " SECONDS" : "WAITS FOR YOU (PRESS NEXT ROUND)"); }
          if (a1 === "finals") return startFinals();
          if (a1 === "reset") return hallReset();
          return "HALL: open / next / auto on|off / thin / finals / reset";
        }
        if (cmd === "lift") {                                         // lift A lounge | lift B 3
          const s = LIFTS[(parts[1] || "").toUpperCase()]; if (!s) return "LIFT A or LIFT B";
          const want = (parts[2] || "").toLowerCase(); let k = s.Lf.keys.indexOf(want);
          if (k < 0 && /^\d$/.test(want)) k = +want; if (k < 0 || k >= s.Lf.keys.length) return "LIFT " + s.id + " STOPS: " + s.Lf.keys.join(" / ");
          s.request(k); return "LIFT " + s.id + " CALLED TO " + s.Lf.keys[k].toUpperCase();
        }
        if (cmd === "liftmusic") {                                    // liftmusic on|off
          const on = a1 === "on" ? true : a1 === "off" ? false : !Object.values(LIFTS).some((s) => s.music.parentNode);
          Object.values(LIFTS).forEach((s) => { if (on && !s.music.parentNode) s.musicHome.appendChild(s.music); if (!on && s.music.parentNode) s.music.remove(); });
          return on ? "ELEVATOR MUSIC ON" : "ELEVATOR MUSIC OFF";
        }
        if (cmd === "npc") {                                          // npc mode on|host|off   |   npc say <who> <line>   |   npc hush
          if (a1 === "mode") {
            const m = (parts[2] || "").toLowerCase(); if (!["on", "host", "off"].includes(m)) return "NPC MODE on / host / off";
            NPC_MODE = m; if (m === "off") Object.values(NPCS).forEach((n) => { if (!n.cur || n.cur.source !== "host") npcStop(n); });
            return m === "on" ? "CHARACTERS: ALL ON - CLICK TO TALK, GREETINGS AND ANNOUNCEMENTS" : m === "host" ? "CHARACTERS: HOST ONLY - CLICKS AND GREETINGS OFF, ONLY YOUR BUTTONS (AND GAME ANNOUNCEMENTS)" : "CHARACTERS: ALL OFF - NOBODY TALKS BY THEMSELVES (YOUR BUTTONS STILL WORK)";
          }
          if (a1 === "hush") { Object.values(NPCS).forEach(npcStop); return "EVERY CHARACTER STOPPED TALKING"; }
          if (a1 === "say") {
            const n = NPCS[(parts[2] || "").toLowerCase()], line = parts[3] || ""; if (!n) return "NPC SAY <who> <line> - WHO: " + Object.keys(NPCS).join(" / ");
            if (!n.lines[line]) return "NO LINE " + line.toUpperCase() + " FOR " + n.key.toUpperCase();
            npcTalk(n, line, undefined, true, "host"); return n.key.toUpperCase() + " SAYS: " + line.toUpperCase();
          }
          return "NPC: mode on|host|off, say <who> <line>, hush";
        }
        if (cmd === "name") {                                         // name <id> <text>
          const id = +parts[1]; const t = parts.slice(2).join(" ").slice(0, 18); if (!ONLINE.has(id) || !t) return "NAME <player id> <name>";
          pl(id).name = t; NAMES.set(id, t); boards(); return "PLAYER " + id + " IS NOW " + t.toUpperCase();
        }
        if (cmd === "finalist") {                                     // host can add someone to the finals by hand
          const id = +parts[1]; if (!ONLINE.has(id)) return "FINALIST <player id>";
          const p = pl(id); if (!p.fin) { p.fin = true; H.fin.push(id); doorFix(); boards(); } return nameOf(p).toUpperCase() + " IS A FINALIST";
        }
        return null;
      },
    };
  }
})();
</script>
