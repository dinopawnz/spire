<!--
  MUDWATER SPIRE  v__VER__  -  OtherGames event build  -  Otherside MML
  ============================================================
  LIVE BUILD: this document starts as a small PLACER CUBE. Open the host remote (spire_remote.html, PIN 7747 = S-P-I-R)
  and press LIVE BUILD to raise the whole tower. Press it again to fold everything back into the cube.
  Origin = where you place the build = the FOOT OF THE BOARDWALK (spawn side). The building stands FRONT m behind it, along -Z.

  * THE BUILDING  an 85 x 60 m swamp hall on stilts, four storeys + a roof deck + the steeple. Stair towers at both ends,
                  a bank of four glass-and-brass lifts against the back wall.
  * Floor 1  THE LOUNGE    bar with taps that pour (Mama Silt slides you a mug), Gator Pete by the fire, framed cards everywhere
  * HALL OF FAKES (Mud Match)  400 portraits of #62 The Founder along a ramp round the whole hall (399 fakes + 1 real).
                           4 rounds = 4 finalists, wrong pick = 5 s. Finals in the frosted glass vault at the top - 99 fake + 1 real #100 Black Flag.
  * MUD ROYALE   (game 2 - next version)
  * Floor 4  MUDWATER ESCAPE  (game 3)
  Text is pictures (glowing word models) everywhere except names on the leaderboard.
  Frame rate: every floor is its own ZONE (the castle's trick) - effects, signs and the 200 portraits are sent only to the players
  on that floor. LITE and REFRESH on the remote, as in the castle.
-->
<m-group id="root"></m-group>

<script>
(function () {
  "use strict";
  const BASE = "__BASE__";
  const VER = "?v=__VER__";
  const HOST_CODE = "7747";
  const AUTO_BUILD_MS = 0;
  const D = __DATA__;
  const FRONT = D.FRONT;             // building centre is this far behind the origin (the foot of the boardwalk)
  const VOICES = __VOICES__;         // true once the vo_<npc>_<line>.mp3 files are uploaded
  const SHOW_PADS = false;

  // ---- tweakables ---------------------------------------------------------
  const OP_LIFT = "B";             // the lift the operator (the host's ape) rides
  const LIFT_SPEED = 1.8;            // m/s (gentle, so riders stay on the floor going down)
  const LIFT_DWELL = 7000;           // doors stay open this long at a stop
  const LIFT_HOME_MS = 45000;        // an idle cage goes back down to the lounge after this
  const LOCKOUT_MS = 5000;           // wrong portrait
  const FINALISTS = 4;               // = rounds: each round's first finder is a finalist
  const ROUND_GAP_MS = 10000;        // finalist found -> shuffle -> next round starts after this (if auto)
  const MUG_LIFE = 30000;
  // ------------------------------------------------------------------------

  const rootGroup = document.getElementById("root");
  let ROOT = rootGroup;
  const r3 = (v) => Math.round(v * 1000) / 1000;
  function el(tag, attrs, parent) {
    const n = document.createElement(tag);
    for (const k in attrs) n.setAttribute(k, typeof attrs[k] === "number" ? String(r3(attrs[k])) : String(attrs[k]));
    (parent || ROOT).appendChild(n);
    return n;
  }
  function anim(target, attr, a, b, ms, opts) {
    const o = opts || {};
    const x = { attr, start: a, end: b, duration: Math.round(ms), loop: "true" };
    if (o.pingPong) x["ping-pong"] = "true";
    if (o.easing) x.easing = o.easing;
    if (o.delay) x["start-time"] = -Math.round(o.delay);
    return el("m-attr-anim", x, target);
  }
  const model = (file, attrs, parent) => el("m-model", Object.assign({ src: BASE + file + VER, "cast-shadows": "false" }, attrs || {}), parent);
  const PAD_LOOK = SHOW_PADS ? { color: "#ff00ff", opacity: 0.4 } : { color: "#000000", visible: "false" };
  const HIT = SHOW_PADS ? { color: "#ff00ff", opacity: 0.5 } : { color: "#ffffff", opacity: 0, "cast-shadows": "false" };
  const pad = (attrs, parent) => el("m-cube", Object.assign({ collide: "true", "collision-interval": 100, "cast-shadows": "false" }, PAD_LOOK, attrs), parent);
  const hitBox = (attrs, parent) => el("m-cube", Object.assign({ collide: "false" }, HIT, attrs), parent);
  const T0 = Date.now();
  const now = () => { try { if (document.timeline && typeof document.timeline.currentTime === "number") return document.timeline.currentTime; } catch (e) {} return Date.now() - T0; };
  const _setT = setTimeout, _clrT = clearTimeout, _setI = setInterval, _clrI = clearInterval;
  const TIMERS = new Set(), INTERVALS = new Set(), LISTENERS = [];
  // (v33) a timer step that throws no longer strands a lift / game halfway: the error is kept (remote status shows the last one)
  let LAST_ERR = "";
  function later(ms, f) { const h = _setT(() => { TIMERS.delete(h); try { f(); } catch (e) { LAST_ERR = String((e && e.message) || e).slice(0, 120); try { console.error(e); } catch (_) {} } }, ms); TIMERS.add(h); return h; }
  function cancel(h) { _clrT(h); TIMERS.delete(h); }
  function every(ms, f) { const h = _setI(() => { try { f(); } catch (e) { LAST_ERR = String((e && e.message) || e).slice(0, 120); } }, ms); INTERVALS.add(h); return h; }
  function onWin(ev, f) { window.addEventListener(ev, f); LISTENERS.push([ev, f]); }
  const _setWin = (ev, f) => window.addEventListener(ev, f);
  function tween(target, attr, from, to, ms, easing) {
    target._tw = target._tw || {};
    const prev = target._tw[attr];
    if (prev) { cancel(prev.h); prev.a.remove(); }
    if (target._fu && target._fu[attr]) { cancel(target._fu[attr]); delete target._fu[attr]; }        // a newer move wins over an old catch-up
    // (v27, owner: lift doors stuck half open / one leaf open) the FINAL value is set right away: the animation only draws the
    // movement on top of it, so a client that misses the animation's end still shows the door/cab where it really is
    target.setAttribute(attr, String(r3(to)));
    const a = el("m-attr-anim", { attr, start: from, end: to, duration: Math.round(ms), loop: "false", easing: easing || "easeInOutCubic", "start-time": Math.round(now()) }, target);
    const rec = { a, to };
    // (v41, owner: pool cue "teleports back to where it was", white ball vanishing, lift gate stuck) when the animation is taken off,
    // Otherside can fall back to the value the object had when the animation started. So after removing it the final value is sent
    // AGAIN as a fresh change (a hair off, then exact), which every client applies.
    rec.h = later(ms + 80, () => {
      if (target._tw[attr] !== rec) return;
      a.remove(); delete target._tw[attr];
      target.setAttribute(attr, String(r3(to) + (to >= 0 ? 0.001 : -0.001)));
      target._fu = target._fu || {}; target._fu[attr] = later(70, () => { delete target._fu[attr]; if (!target._tw[attr]) target.setAttribute(attr, String(r3(to))); });
    });
    target._tw[attr] = rec;
  }
  const sfx = (file, x, y, z, vol, parent) => { const a = el("m-audio", { src: BASE + file + VER, x, y, z, loop: "false", volume: vol || 0.8, "start-time": Math.round(now()) }, parent); later(12000, () => a.remove()); return a; };
  const polar = (r, a, y) => [r * Math.sin(a * Math.PI / 180), y, r * Math.cos(a * Math.PI / 180)];
  const faceTo = (from, to) => Math.atan2(to.x - from[0], to.z - from[2]) * 180 / Math.PI;

  // ==========================================================
  // CORE (always there): the placer cube, the host prompt and the remote board
  // ==========================================================
  const PARK = -500;
  const placer = el("m-group", { y: 0 }, rootGroup);
  el("m-cube", { y: 1.0, width: 2, height: 2, depth: 2, color: "#3a2a14", collide: "true" }, placer);
  model("sp_logo_block.glb", { y: 2.6, collide: "false" }, placer);
  const hostPrompt = el("m-prompt", { id: "sp-host", message: "Host code + command", placeholder: "code + command", x: 0, y: PARK, z: 0 }, rootGroup);
  const remoteBoard = el("m-group", { id: "sp-remote", y: PARK, "visible-to": "-1" }, rootGroup);
  const ONLINE = new Set(), REMOTES = new Set(), NAMES = new Map();
  const ack = { n: 0, l: [] };
  let WORLD = null, GAME = null, builtAt = 0;
  function hostMsg(t) {
    t = String(t); ack.n++; ack.l.push({ n: ack.n, t }); if (ack.l.length > 12) ack.l.shift();
    remoteBoard.setAttribute("data-ack", JSON.stringify({ n: ack.n, t, l: ack.l }));
    paintRemote();
  }
  function paintRemote() {
    if (!REMOTES.size) return;
    const tn = now();
    const game = Object.assign({ now: tn, built: !!GAME, builtAt, lite: !!LITE, online: ONLINE.size, ev: ack.l.length ? ack.l[ack.l.length - 1].t : "" }, GAME ? GAME.game(tn) : { ph: "idle" });
    remoteBoard.setAttribute("data-game", JSON.stringify(game));
    remoteBoard.setAttribute("data-players", JSON.stringify(GAME ? GAME.players(tn) : []));
  }
  _setI(paintRemote, 1000);

  // ---- ZONES: one per floor + "out" (outside the tower). Sounds are never zoned (Otherside won't play m-audio under visible-to).
  const ZONES = {}, ZSET = {};
  const BANDS = [["f1", 2.0, D.L.f2], ["f2", D.L.f2, D.L.f3], ["f3", D.L.f3, D.L.f4], ["f4", D.L.f4, D.L.roof]];
  const inside = (x, z, m) => Math.abs(x) < D.L.X1 + m && Math.abs(z) < D.L.Z1 + m;
  function zKey(x, y, z) {
    if (!inside(x, z, 0)) return "out";
    for (const [k, lo, hi] of BANDS) if (y >= lo && y < hi) return k;
    return "out";
  }
  function zKeysFor(p) {
    const ks = []; let deep = false;
    for (const [k, lo, hi] of BANDS) {
      if (inside(p.x, p.z, 3) && p.y > lo - 2.5 && p.y < hi + 2.5) ks.push(k);
      if (inside(p.x, p.z, -6) && p.y > lo + 0.5 && p.y < hi - 0.5) deep = true;
    }
    if (!deep) ks.push("out");
    return ks;
  }
  function zoneGroup(k, world) { if (!ZONES[k]) { ZONES[k] = el("m-group", { "visible-to": "-1" }, world || WORLD); ZSET[k] = new Set(); } return ZONES[k]; }
  function zoneUp(world) {
    // (v40, owner: lift landing gate stayed shut / call button dead) with zoning OFF nothing is moved into the per-floor visible-to groups
    // any more: everything stays in the world as before v24. Things inside those groups (the landing gates, the call buttons) misbehaved
    // in Otherside while the parts kept outside them (the cab's own gate) worked.
    if (!ZONING) return 0;
    const tg = (n) => String(n.tagName).toUpperCase();
    const VIS = ["visible", "visible-to", "hidden-from"], T0_ = ["x", "y", "z", "rx", "ry", "rz"], T1 = ["sx", "sy", "sz"];
    const plain = (n) => tg(n) === "M-GROUP" && !VIS.some((k) => n.hasAttribute(k)) &&
      T0_.every((k) => !n.hasAttribute(k) || +n.getAttribute(k) === 0) && T1.every((k) => !n.hasAttribute(k) || +n.getAttribute(k) === 1);
    const nm = (n, k, d) => { const v = n.getAttribute(k); return v === null || v === "" || isNaN(+v) ? d : +v; };
    const pos = (n, stop) => { let p = { x: 0, y: 0, z: 0 }; for (let e = n; e && e !== stop; e = e.parentNode) {
      const a = nm(e, "ry", 0) * Math.PI / 180, x = p.x * nm(e, "sx", 1), y = p.y * nm(e, "sy", 1), z = p.z * nm(e, "sz", 1);
      p = { x: x * Math.cos(a) + z * Math.sin(a) + nm(e, "x", 0), y: y + nm(e, "y", 0), z: -x * Math.sin(a) + z * Math.cos(a) + nm(e, "z", 0) }; } return p; };
    const LEAF = /^M-(MODEL|CUBE|CYLINDER|SPHERE|PLANE|LABEL|IMAGE|AUDIO)$/;
    const zs = new Set(Object.values(ZONES));
    let moved = 0;
    const visit = (box) => Array.from(box.children).forEach((c) => {
      if (zs.has(c)) return;
      const asked = c.getAttribute && c.getAttribute("data-zone");
      if (asked && c.getAttribute("collide") !== "true") { const g = zoneGroup(asked, world); zs.add(g); g.appendChild(c); moved++; return; }
      const all = [c].concat(Array.from(c.querySelectorAll("*")));
      const busy = all.some((n) => /^M-(LABEL|AUDIO|ATTR-ANIM|ATTR-LERP)$/.test(tg(n)));
      const fixed = all.some((n) => n.getAttribute("collide") === "true" || /^M-(POSITION-PROBE|PROMPT|AUDIO)$/.test(tg(n)) || VIS.some((k) => n.hasAttribute(k)) || n._global);
      const keys = new Set(all.filter((n) => LEAF.test(tg(n))).map((n) => { const p = pos(n, world); return zKey(p.x, p.y, p.z); }));
      const key1 = keys.size === 1 ? [...keys][0] : null;
      // (v24) animated things zone by floor as before, and now every STILL indoor model too (furniture, trees, lanterns...): players only
      // download and draw the floor they're on. Outdoor still models stay for everyone.
      if (key1 && !fixed) { const g = zoneGroup(key1, world); zs.add(g); g.appendChild(c); moved++; }          // outdoor dressing too: players deep inside don't draw it
      else if (plain(c) && (busy || keys.size > 1)) visit(c);
    });
    visit(world);
    return moved;
  }
  const SEEN = new Set();
  // (v25, owner: "why isn't it just loaded all the time?") floor zoning is OFF: every player gets every floor all the time.
  // In Otherside the position probe didn't report players, so v24 left the inside empty. Set ZONING = true to try it again.
  const ZONING = false;
  function zoneSee(id, p) { if (!WORLD) return; if (!ZONING) { zoneAll(id); return; } SEEN.add(id); zoneMark(id, new Set(zKeysFor(p))); }
  function zoneAll(id) { if (WORLD && id !== undefined && !REMOTES.has(id)) { SEEN.delete(id); zoneMark(id, new Set(Object.keys(ZONES))); } }
  // (v24) someone whose position isn't known yet sees the outside only; their floor appears the moment the position probe reports them
  function zoneOut(id) { if (!ZONING) { zoneAll(id); return; } if (WORLD && id !== undefined && !REMOTES.has(id)) { SEEN.delete(id); zoneMark(id, new Set(["out"])); } }
  function zoneMark(id, want) {
    for (const k in ZONES) {
      const S = ZSET[k], on = !!(want && want.has(k));
      if (on === S.has(id)) continue;
      on ? S.add(id) : S.delete(id);
      ZONES[k].setAttribute("visible-to", S.size ? Array.from(S).join(" ") : "-1");
    }
  }
  const zoneDrop = (id) => { SEEN.delete(id); zoneMark(id, null); };
  _setWin("disconnected", (e) => zoneDrop(e.detail && e.detail.connectionId));

  // ---- LITE + REFRESH (as in the castle)
  let LITE = null;
  const DECOR = /sp_(chandelier|lantern_[abc]|fx_|wisp|moonbeam|m_vines|m_ivy)|bio_|mw_motes|fireflies|mist\.glb|glowplant|reeds|floatlantern|lilypads|moss_c|shelfshroom|jarlantern|cypress|m_hanglantern|m_cattails/;
  function liteOn() {
    if (LITE) return "LITE MODE IS ALREADY ON";
    const tg = (n) => String(n.tagName).toUpperCase();
    const out = Array.from(WORLD.querySelectorAll("m-model, m-image, m-sphere")).filter((m) => DECOR.test(m.getAttribute("src") || "") || m.hasAttribute("data-lite"))
      .concat(Array.from(WORLD.querySelectorAll("m-attr-anim[data-lite-anim]")));          // (v41) the floating cards just stop moving
    LITE = { removed: out.map((n) => ({ n, parent: n.parentNode, next: n.nextSibling })), shadows: [] };
    LITE.removed.forEach((r) => r.n.remove());
    return "LITE MODE ON - " + LITE.removed.length + " DECORATIVE PIECES REMOVED. PROGRESS KEPT.";
  }
  function liteOff() {
    if (!LITE) return "LITE MODE IS ALREADY OFF";
    LITE.removed.slice().reverse().forEach((r) => { if (r.next && r.next.parentNode === r.parent) r.parent.insertBefore(r.n, r.next); else r.parent.appendChild(r.n); });
    const n = LITE.removed.length; LITE = null;
    return "LITE MODE OFF - " + n + " PIECES ARE BACK";
  }
  function refreshAll() {
    const groups = Object.values(ZONES);
    groups.forEach((g) => { const parent = g.parentNode, next = g.nextSibling; g.remove(); if (next && next.parentNode === parent) parent.insertBefore(g, next); else parent.appendChild(g); });
    let seen = 0;
    ONLINE.forEach((id) => { const p = GAME && GAME._P.get(id); if (p && p.pos) { zoneSee(id, p.pos); seen++; } else zoneOut(id); });
    try { GAME && GAME.refresh(); } catch (e) {}
    return "REFRESHED - " + groups.length + " AREAS RE-SENT (" + seen + " PLAYERS PLACED BY POSITION). PROGRESS KEPT.";
  }
  function build() {
    if (GAME) return "ALREADY BUILT";
    WORLD = el("m-group", { z: -FRONT }, rootGroup);
    ROOT = WORLD;
    placer.setAttribute("y", PARK);
    try { GAME = buildWorld(); }
    catch (e) { hostMsg("BUILD ERROR: " + (e && e.message)); }
    try { zoneUp(WORLD); } catch (e) { hostMsg("ZONE ERROR: " + (e && e.message)); }
    ONLINE.forEach((id) => { const p = GAME && GAME._P && GAME._P.get(id); if (p && p.pos) zoneSee(id, p.pos); else zoneOut(id); });
    builtAt = now();
    return "LIVE BUILD ON - THE SPIRE IS UP";
  }
  function unbuild() {
    if (!WORLD) return "ALREADY FOLDED";
    LITE = null;
    TIMERS.forEach((h) => _clrT(h)); TIMERS.clear();
    INTERVALS.forEach((h) => _clrI(h)); INTERVALS.clear();
    LISTENERS.forEach(([ev, f]) => window.removeEventListener(ev, f)); LISTENERS.length = 0;
    WORLD.remove(); WORLD = null; GAME = null; ROOT = rootGroup;
    for (const k in ZONES) { delete ZONES[k]; delete ZSET[k]; }
    placer.setAttribute("y", 0);
    return "LIVE BUILD OFF - BACK TO THE PLACER CUBE";
  }
  hostPrompt.addEventListener("prompt", (e) => {
    const raw = String((e && e.detail && e.detail.value) || "").replace(/\s+/g, " ").trim();
    if (raw.indexOf(HOST_CODE) !== 0) { hostMsg("WRONG CODE"); return; }
    const rest = raw.slice(HOST_CODE.length).trim();
    const parts = rest.split(" ").filter(Boolean);
    const cmd = (parts[0] || "").toLowerCase();
    const id = e.detail.connectionId;
    if (cmd === "remote") {
      if (id === undefined) { hostMsg("REMOTE: NO CONNECTION ID"); return; }
      REMOTES.add(id); ONLINE.delete(id); remoteBoard.setAttribute("visible-to", Array.from(REMOTES).join(" "));
      hostMsg("UNLOCKED"); paintRemote(); return;
    }
    if (cmd === "build") { hostMsg(build()); return; }
    if (cmd === "unbuild") { hostMsg(unbuild()); return; }
    if (!GAME) { hostMsg("NOT BUILT YET - PRESS LIVE BUILD FIRST"); return; }
    if (cmd === "lite") { const a = (parts[1] || "").toLowerCase(); hostMsg(a === "off" ? liteOff() : a === "on" ? liteOn() : LITE ? liteOff() : liteOn()); return; }
    if (cmd === "refresh") { hostMsg(refreshAll()); return; }
    let reply = null;
    try { reply = GAME.command(cmd, rest, parts); } catch (err) { reply = "ERROR: " + (err && err.message); }
    hostMsg(reply || "UNKNOWN: " + cmd);
  });
  window.addEventListener("connected", (e) => { if (e.detail && !REMOTES.has(e.detail.connectionId)) { ONLINE.add(e.detail.connectionId); zoneOut(e.detail.connectionId); } });
  window.addEventListener("disconnected", (e) => {
    const c = e.detail.connectionId;
    ONLINE.delete(c);
    if (REMOTES.delete(c)) remoteBoard.setAttribute("visible-to", REMOTES.size ? Array.from(REMOTES).join(" ") : "-1");
  });
  if (AUTO_BUILD_MS > 0) _setT(() => { if (!GAME) hostMsg(build()); }, AUTO_BUILD_MS);

  // ==========================================================
  // THE WORLD
  // ==========================================================
  function buildWorld() {
    const L = D.L;
    const P = new Map();                       // connectionId -> player
    const pl = (id) => { if (!P.has(id)) P.set(id, { id, name: NAMES.get(id) || "", pos: null, lock: 0, fin: false, fintime: 0 }); return P.get(id); };
    const nameOf = (p) => (p.name ? p.name : "Player #" + p.id);
    const everyone = () => Array.from(ONLINE);
    const hideFrom = (n, a) => { if (!a.length) { n.removeAttribute("visible-to"); return; } const skip = new Set(a.map(String)); const keep = everyone().filter((id) => !skip.has(String(id))); n.setAttribute("visible-to", keep.length ? keep.join(" ") : "-1"); };
    const showTo = (n, a) => n.setAttribute("visible-to", a.length ? a.join(" ") : "-1");
    const priv = el("m-group", {});            // per-player pieces (each carries its own visible-to)
    priv._global = true;

    // ---------------------------------------------------- the tower, floors and lift shafts (static)
    const STATIC = [["sp_shell", 1], ["sp_boardwalk", 0], ["sp_neon", 0], ["sp_f1_lounge", 1, "f1"], ["sp_f2_hall", 1, "f2"], ["sp_f2_vault", 1, "f2"]];
    STATIC.forEach(([f, sh, zn]) => { const m = model(f + ".glb", Object.assign({ collide: "false", "cast-shadows": sh ? "true" : "false" }, zn ? { "data-zone": zn } : {})); if (!zn) m._global = true; });      // the building itself: always seen by everyone      // (v24) lounge / hall only for players on that floor
    D.lifts.forEach((Lf) => { model(Lf.shaft_model + ".glb", { x: Lf.x, z: Lf.z, collide: "false" })._global = true; });      // shared shaft models, four places
    // the swamp round the hall: the Mudwater Coliseum's own decorations (water, giant mangroves, acorn houses, cypress, reeds, lanterns...)
    const MW = "https://raw.githubusercontent.com/dinopawnz/mudwater/main/";
    // (v24) staged: the swamp dressing and the furniture arrive 2.5 s after the building, then get sorted onto their floors
    later(2500, () => {
      D.deco.forEach(([f, x, y, z, ry, s]) => el("m-model", { src: MW + f + ".glb", x, y, z, ry, sx: s, sy: s, sz: s, collide: "false", "cast-shadows": "false" }));
        try { zoneUp(WORLD); } catch (e) {}
      if (LITE) { const keep = LITE; LITE = null; liteOn(); LITE.removed = keep.removed.concat(LITE.removed); }
    });
    // the invisible floors, walls, stair ramp and rails. They must NOT carry visible="false" (Otherside then never loads them and nothing
    // is solid) - their material is already fully see-through, so they're loaded normally and stay invisible.
    ["sp_shell_col", "sp_f1_col", "sp_f2_col", "sp_f2_vaultcol", "sp_lift_col"].forEach((f) => model(f + ".glb", { collide: "true" }));
    // backup floors made the castle's way (invisible boxes) under the boardwalk, the steps and the porch / lounge, so the way in is
    // solid even if a collision model fails to load
    {
      const z0 = L.walk_z0, z1 = L.walk_z1, y0 = L.porch, y1 = L.walk_y, hw = L.walk_w / 2;
      const ln = Math.hypot(z1 - z0, y0 - y1), ang = Math.atan2(y0 - y1, z1 - z0) * 180 / Math.PI;
      pad({ x: 0, y: (y0 + y1) / 2 - 0.15, z: (z0 + z1) / 2, width: 2 * hw + 0.2, height: 0.3, depth: ln, rx: ang });
      const pb = L.porch_box;
      pad({ x: 0, y: L.porch - 0.15, z: (pb.zb + pb.zf) / 2, width: 2 * pb.x, height: 0.3, depth: pb.zf - pb.zb });
    }
    // the lounge's big lantern rings (timber hoops of iron lanterns, as in the owner's concept), swaying a touch

            const d = Math.sqrt(d2), nx = dx / d, nz = dz / d, rel = (a.vx - c.vx) * nx + (a.vz - c.vz) * nz;

      function poolShoot(T, pow, e) {
        const id = e && e.detail && e.detail.connectionId, tn = now();
        if (T.busy || (T.last.has(id) && tn - T.last.get(id) < 1200)) return; T.last.set(id, tn);
        if (!T.balls[0].on) return;

        sfx("pool_cue.mp3", T.g.getAttribute("x") * 1, FY + Number(T.g.getAttribute("y")), Number(T.g.getAttribute("z")), 0.9);
        later(LEAD + 60, () => T.aimG.setAttribute("visible", "false"));
        S.B.forEach((b, i) => {

            const ease = last ? "easeOutQuad" : "linear";
            later(LEAD + t0 * 1000, () => { tween(ball.el, "x", x0, x1, (t1 - t0) * 1000, ease); tween(ball.el, "z", z0, z1, (t1 - t0) * 1000, ease); });
          }

        });
        S.drops.forEach(([t, n]) => later(LEAD + t * 1000 + 40, () => { const el_ = T.balls[n].el; tween(el_, "y", FY, FY - 0.16, 220, "easeInQuad"); later(260, () => el_.setAttribute("visible", "false")); }));
        let lastS = -1, cnt = 0;
        const wx = Number(T.g.getAttribute("x")), wz = Number(T.g.getAttribute("z")), wy = Number(T.g.getAttribute("y")) + FY;
        S.snd.forEach(([t, f, v]) => { if (cnt > 14 || t - lastS < 0.06 || v < 0.08) return; lastS = t; cnt++; later(LEAD + t * 1000, () => sfx(f + ".mp3", wx, wy, wz, 0.4 + 0.6 * v)); });

    // ---------------------------------------------------- THE POND: frogs croak now and then (throat puffs, a little bounce) and hop round

    // the two tall green banners down the front of the building
    (D.frontBanners || []).forEach(([x, y, z]) => model("sp_frontbanner.glb", { x, y, z, collide: "false" }));

    // ---------------------------------------------------- THE LIVING SWAMP (Pandora by night): glowing veins on the floors and the stair that
    // breathe in slow waves, glowing vines on the walls, spores drifting up. Footsteps bloom with light; the walls shimmer as you pass.
    const BIO = D.bio, bioSrc = (f) => BASE + f + VER;
    BIO.floor.forEach(([x, y, z, w, h, ry, del, per, gold]) => {
      const g = el("m-group", { x, y, z, ry });
      // the lounge (gold) gets thin warm amber veins with a gentle breath; the Hall of Fakes keeps its teal
      const m = el("m-image", { src: bioSrc(gold ? "bio_veins_amber.png" : "bio_veins.png"), rx: -90, width: w, height: h, emissive: gold ? 0.75 : 1.3, opacity: 0.95, collide: "false", "cast-shadows": "false" }, g);
      // (v41, fps) a steady glow: 152 fewer animations
    });
    BIO.wall.forEach(([x, y, z, w, h, ry, del, per, gold]) => {
      const m = el("m-image", { src: bioSrc(gold ? "bio_wall_amber.png" : "bio_wall.png"), x, y, z, ry, width: w, height: h, emissive: gold ? 0.5 : 0.8, opacity: 0.95, collide: "false", "cast-shadows": "false" });

    BIO.spores.filter((_, i) => i % 4 === 0).forEach(([x, y, z, rad, dur, del, rise]) => {          // (v41, fps) a quarter of the spores
      const m = el("m-sphere", { x, y, z, radius: rad, color: "#b9ffe6", emissive: 4, collide: "false", "cast-shadows": "false", "data-lite": "1" });

    // where you're standing: the highest floor or stair surface under you (works whether the probe reports feet or head)
    const bandRect = (r) => { const [x0, z0, , x1, z1] = r, [xi, xo, zi, zo] = BIO.band; return r[6] === "z" ? [Math.min(x0, x1), Math.max(x0, x1), Math.sign(r[7]) > 0 ? zi : -zo, Math.sign(r[7]) > 0 ? zo : -zi] : [Math.sign(r[7]) > 0 ? xi : -xo, Math.sign(r[7]) > 0 ? xo : -xi, Math.min(z0, z1), Math.max(z0, z1)]; };

    function peekLine(n) { const ts = Object.keys(n.lines).filter((k) => /^t\d+$/.test(k)); return ts[n.i % ts.length]; }   // moves on only when the line is actually said
    function headPos(n) {

    // NPC_MODE (host remote): "on" = click / greet / game announcements, "host" = clicks + greetings do nothing (game announcements

    let NPC_MODE = "on";
    function npcStop(n) {

    // source: "click" | "greet" | "game" | "host". One line at a time: while a character talks, clicks and greetings are ignored;
    // a game announcement or a host line cuts in (a host line is never cut off by anything but another host line).
    function npcTalk(n, line, id, everyoneHears, source) {
      source = source || "game";

      if (source !== "host") {

      const by = Math.min(tall + 0.75, cap && cap.y !== undefined ? cap.y : 99);
      const fw = cap && cap.fwd ? cap.fwd : 0.0, a = ry * Math.PI / 180;    // nudge forward, out from under shelves and racks
      const bub = lift ? el("m-group", Object.assign({ x: 0, y: by, z: -(D.cabApo - 0.14), ry: 0 }, vis), lift)   // flat on the back wall of the cab, out of the way (owner, v23)

      const audio = VOICES ? el("m-audio", { src: BASE + "vo_" + n.key + "_" + line + ".mp3" + VER, x: hp[0], y: hp[1] + 1.6, z: hp[2], loop: "false", volume: 1.0, "start-time": Math.round(now()) }) : null;
      n.m.setAttribute("anim", BASE + "npc_" + n.key + "_talk.glb" + VER);

    }
    function startFinals() {
      if (H.ph === "finals") return "THE FINALS ARE ALREADY ON";
      if (!H.fin.length) return "NO FINALISTS YET";
      H.ph = "finals"; setRound(""); H.finT0 = now(); H.vmap = shuffled(VT.length); H.vremoved.clear();
      H.fin.forEach((id) => { pl(id).lock = 0; });
      VAULTM.forEach((m, s) => { if (!m.parentNode) fz.appendChild(m); m.setAttribute("sx", 1); m.setAttribute("sy", 1); m.setAttribute("sz", 1); m.setAttribute("src", BASE + "portraits/pv_" + String(H.vmap[s]).padStart(3, "0") + ".glb" + VER); });
      frostOff(); setBanner("findflag"); setCounter(); appraiser("finals");
      sfx("finals.mp3", 0, D.yv + 3, 0, 1.0);
      return "THE FINALS HAVE BEGUN - " + H.fin.length + " FINALISTS IN THE GLASS ROOM";
    }
    function thin() {
      const finals = H.ph === "finals";
      if (H.ph !== "hunt" && !finals) return "NOTHING TO THIN - OPEN THE HALL OR START THE FINALS FIRST";
      const list = finals ? VAULTM : HALLM, gone = finals ? H.vremoved : H.removed, real = finals ? vRealSlot() : realSlot();
      const fakes = list.map((_, s) => s).filter((s) => s !== real && !gone.has(s));
      const keep = 9, cut = Math.min(fakes.length - keep, Math.ceil((fakes.length - keep) / 2));
      if (cut <= 0) return "ONLY 10 LEFT - CAN'T THIN ANY MORE";
      for (let i = fakes.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fakes[i], fakes[j]] = [fakes[j], fakes[i]]; }
      fakes.slice(0, cut).forEach((s, i) => {
        gone.add(s); const m = list[s];
        later(Math.random() * 2500, () => { ["sx", "sy", "sz"].forEach((k) => tween(m, k, 1, 0.01, 700, "easeInBack")); later(780, () => m.remove()); });
      });
      later(3300, setCounter); appraiser("thin");
      return "THE FORGERS FLED - " + cut + " FAKES TAKEN DOWN, " + (list.length - gone.size) + " PORTRAITS LEFT";
    }
    function hallReset() {
      H.ph = "idle"; H.round = 0; H.nextAt = 0; H.fin = []; H.winner = null; H.removed.clear(); H.vremoved.clear(); setRound("");
      P.forEach((p) => { p.fin = false; p.lock = 0; });
      HALLM.forEach((m) => { if (!m.parentNode) fz.appendChild(m); ["sx", "sy", "sz"].forEach((k) => m.setAttribute(k, 1)); });
      VAULTM.forEach((m) => { if (!m.parentNode) fz.appendChild(m); ["sx", "sy", "sz"].forEach((k) => m.setAttribute(k, 1)); });
      Array.from(fz.children).filter((c) => c.tagName && c.tagName.toUpperCase() === "M-GROUP" && c !== banner && c !== counter && c !== rlabel).forEach((c) => c.remove());
      if (!refFlag.parentNode) fz.appendChild(refFlag); frostOn();
      doorFix(); setBanner("notyet"); setCounter(); boards();
      return "HALL OF FAKES RESET";
    }

    // ---------------------------------------------------- leaderboards (names are the one place text is allowed)
    const LB = el("m-group", {});
    function boards() {
      Array.from(LB.children).forEach((c) => c.remove());
      const lines = H.fin.map((id, i) => (i + 1) + ". " + nameOf(pl(id)) + (H.winner === id ? "  - CHAMPION" : ""));
      if (!lines.length) return;
      D.finalBoards.forEach(([x, y, z, ry]) => {
        const g = el("m-group", { x, y, z, ry }, LB);
        word("finalists", 0.5, { y: 0.55 }, g);
        el("m-label", { content: lines.join("\n"), y: -0.9, width: 3.4, height: 2.3, "font-size": 22, alignment: "center", color: "#20140a", "font-color": "#ffe6a8", emissive: 0.35, collide: "false" }, g);
      });
    }

    // ---------------------------------------------------- where everyone is (zones, greetings)
    const probe = el("m-position-probe", { range: 600, interval: 400 });
    const INSIDE = new Set();
    const onPos = (e) => {
      const id = e.detail && e.detail.connectionId; if (id === undefined) return;
      const er = e.detail.elementRelative && e.detail.elementRelative.position;
      const dr = (e.detail.documentRelative && e.detail.documentRelative.position) || e.detail.position;
      const ok = (v) => v && typeof v.x === "number" && !isNaN(v.x);
      const pos = ok(er) ? er : ok(dr) ? { x: dr.x, y: dr.y, z: dr.z + FRONT } : null;
      if (!pos) return;
      const p = pl(id); p.pos = { x: pos.x, y: pos.y, z: pos.z };
      if (inside(pos.x, pos.z, 6) && pos.y > -5 && pos.y < 60) INSIDE.add(id); else INSIDE.delete(id);
      zoneSee(id, p.pos);
      greetCheck(p);
      bioStep(p);
    };
    probe.addEventListener("positionenter", onPos); probe.addEventListener("positionmove", onPos);
    probe.addEventListener("positionleave", (e) => { INSIDE.delete(e.detail && e.detail.connectionId); zoneOut(e.detail && e.detail.connectionId); });
    onWin("disconnected", (e) => INSIDE.delete(e.detail && e.detail.connectionId));
    onWin("connected", () => doorFix());

    // ==================================================== host commands + what the remote shows
    const zoneOf = (p) => (p.pos ? zKey(p.pos.x, p.pos.y, p.pos.z) : "?");
    return {
      _P: P,
      refresh() { doorFix(); setBanner(H.ph === "hunt" ? "findfounder" : H.ph === "between" ? "shuffling" : H.ph === "allfound" ? "allfound" : H.ph === "finals" ? "findflag" : H.ph === "done" ? "winner" : "notyet");
                  setRound(H.ph === "hunt" ? "round" + H.round : H.ph === "between" ? "round" + (H.round + 1) : ""); if (H.ph !== "between") setCounter(); boards(); },
      game(tn) {
        const finals = H.ph === "finals" || H.ph === "done";
        return { esc: ES.on && ES.info ? ES.info() : null, ph: H.ph, left: finals ? VT.length - H.vremoved.size : HL.length - H.removed.size, fin: H.fin.length, finMax: FINALISTS,
                 finalists: H.fin.map((id) => nameOf(pl(id))), ready: H.ph === "allfound", round: H.round, rounds: FINALISTS, auto: H.auto, nextIn: H.ph === "between" && H.nextAt ? Math.max(0, Math.ceil((H.nextAt - tn) / 1000)) : -1, inVault: H.fin.filter((id) => { const p = pl(id); return p.pos && Math.abs(p.pos.x) < D.room[0] && Math.abs(p.pos.z) < D.room[1] && Math.abs(p.pos.y - D.yv) < 3; }).length, winner: H.winner !== null ? nameOf(pl(H.winner)) : "",
                 huntSecs: H.t0 ? Math.round((tn - H.t0) / 1000) : 0, inside: INSIDE.size, npcMode: NPC_MODE,
                 talking: Object.values(NPCS).filter((n) => n.talking).map((n) => n.key), liftMusic: Object.values(LIFTS).some((s) => s.music.parentNode), instruments: BAND.on, music: MUSIC.on, song: MUSIC.title, musicVol: MUSIC.pct,
                 lifts: Object.fromEntries(Object.entries(LIFTS).map(([k, s]) => [k, s.status()])) };
      },
      players(tn) {
        return Array.from(ONLINE).map((id) => { const p = pl(id); return [id, nameOf(p), zoneOf(p), p.fin ? 1 : 0, Math.max(0, Math.ceil((p.lock - tn) / 1000)), H.winner === id ? 1 : 0]; });
      },
      command(cmd, rest, parts) {
        const a1 = (parts[1] || "").toLowerCase();
        if (cmd === "celebrate") return celebrate();
        if (cmd === "royale") {                                       // royale open | start | stop | clear | (status)
          if (!RY.on) return "NO MUD ROYALE IN THIS BUILD";
          if (a1 === "open" || a1 === "reset") return RY.open();
          if (a1 === "start") return RY.start();
          if (a1 === "stop" || a1 === "end") return RY.end();
          if (a1 === "clear") return RY.clear();
          if (a1 === "demo") return RY.demo();
          return RY.status();
        }
        if (cmd === "escape") {                                       // escape open | start | end | reset | clear | hint <team> | skip <team> | raffle
          if (!ES.on) return "NO MUDWATER ESCAPE IN THIS BUILD";
          const a2 = (parts[2] || "").toLowerCase();
          if (a1 === "open" || a1 === "reset") return ES.open();
          if (a1 === "start") return ES.start();
          if (a1 === "stop" || a1 === "end") return ES.end();
          if (a1 === "clear") return ES.clear();
          if (a1 === "raffle") return ES.raffle();
          if (a1 === "hint" || a1 === "skip") { const k = ES.teamArg(a2); if (k < 0) return "WHICH TEAM? (RED GOLD GREEN BLUE PURPLE ORANGE)"; return a1 === "hint" ? ES.hint(k) : ES.skip(k); }
          return ES.status();
        }
        if (cmd === "art") {                                          // art clear | art lock | art unlock
          if (!ART.on) return "NO ART WALL IN THIS BUILD";
          if (a1 === "clear") { ART.clear(); return "ART WALL WIPED CLEAN"; }
          if (a1 === "lock") { ART.locked = true; return "ART WALL LOCKED - NOBODY CAN PAINT OR SIGN"; }
          if (a1 === "unlock") { ART.locked = false; return "ART WALL OPEN FOR PAINTING"; }
          if (a1 === "grid") { ART.toGrid(); return "ART WALL SWITCHED TO BIG SQUARES (FALLBACK) - REBUILD TO GO BACK TO DOTS"; }
          return "ART WALL: " + (ART.dots ? ART.dots.size : 0) + " DOTS + " + ART.cells.size + " SQUARES PAINTED, " + ART.names.length + " NAMES" + (ART.locked ? " (LOCKED)" : "") + (ART.grid ? " [GRID MODE]" : "") + " | clicks with a spot " + ART.okClicks + ", without " + ART.noPos;
        }
        if (cmd === "pool") { POOL.forEach((T) => { T.busy = false; POOL.rack(T); }); return "BOTH POOL TABLES RACKED"; }
        if (cmd === "music" && (a1 === "vol" || a1 === "volume" || a1 === "up" || a1 === "down" || a1 === "louder" || a1 === "softer")) {
          const v = parseFloat(parts[2]); const p = a1 === "up" || a1 === "louder" ? MUSIC.pct + 10 : a1 === "down" || a1 === "softer" ? MUSIC.pct - 10 : isNaN(v) ? MUSIC.pct : v;
          return "MUSIC VOLUME " + musicVol(p) + "%";
        }
        if (cmd === "music") {
          if (a1 === "next" || a1 === "skip") { musicSkip(); return "NOW PLAYING: " + MUSIC.title.toUpperCase(); }
          musicSet(a1 === "on" ? true : a1 === "off" ? false : !MUSIC.on); return MUSIC.on ? "MUSIC ON - " + MUSIC.title.toUpperCase() : "MUSIC OFF";
        }
        if (cmd === "instruments") { BAND.on = a1 === "on" ? true : a1 === "off" ? false : !BAND.on; return BAND.on ? "INSTRUMENTS ON - ANYONE ON THE STAGE CAN PLAY" : "INSTRUMENTS OFF - NOBODY CAN PLAY THEM"; }
        if (cmd === "hall") {
          if (a1 === "open" || a1 === "start") return hallOpen();
          if (a1 === "thin") return thin();
          if (a1 === "next") return nextRound();
          if (a1 === "auto") { const v = (parts[2] || "").toLowerCase(); H.auto = v === "on" ? true : v === "off" ? false : !H.auto;
            if (H.ph === "between") { if (H.auto && !H.nextAt) armNext(); if (!H.auto) { H.nextAt = 0; H.tok++; setCounter(); } }
            return "NEXT ROUND: " + (H.auto ? "STARTS BY ITSELF AFTER " + ROUND_GAP_MS / 1000 + " SECONDS" : "WAITS FOR YOU (PRESS NEXT ROUND)"); }
          if (a1 === "finals") return startFinals();
          if (a1 === "reset") return hallReset();
          return "HALL: open / next / auto on|off / thin / finals / reset";
        }
        if (cmd === "lift") {                                         // lift A lounge | lift B 3
          const s = LIFTS[(parts[1] || "").toUpperCase()]; if (!s) return "LIFT A or LIFT B";
          const want = (parts[2] || "").toLowerCase(); let k = s.Lf.keys.indexOf(want);
          if (k < 0 && /^\d$/.test(want)) k = +want; if (k < 0 || k >= s.Lf.keys.length) return "LIFT " + s.id + " STOPS: " + s.Lf.keys.join(" / ");
          s.request(k); return "LIFT " + s.id + " CALLED TO " + s.Lf.keys[k].toUpperCase();
        }
        if (cmd === "liftjam") {                                      // (v33, tests) pretend a lift lost a step: it must heal itself
          const s = LIFTS[(parts[1] || "").toUpperCase()]; if (!s) return "LIFTJAM A or B"; s.busy = true; s.deadline = now() - 1; return "LIFT " + s.id + " JAMMED (TEST)";
        }
        if (cmd === "liftstat") return "LIFTS " + JSON.stringify(Object.fromEntries(Object.values(LIFTS).map((s) => [s.id, s.status()])));
        if (cmd === "liftmusic") {                                    // liftmusic on|off
          const on = a1 === "on" ? true : a1 === "off" ? false : !Object.values(LIFTS).some((s) => s.music.parentNode);
          Object.values(LIFTS).forEach((s) => { if (on && !s.music.parentNode) s.musicHome.appendChild(s.music); if (!on && s.music.parentNode) s.music.remove(); });
          return on ? "ELEVATOR MUSIC ON" : "ELEVATOR MUSIC OFF";
        }
        if (cmd === "npc") {                                          // npc mode on|host|off   |   npc say <who> <line>   |   npc hush
          if (a1 === "mode") {
            const m = (parts[2] || "").toLowerCase(); if (!["on", "host", "off"].includes(m)) return "NPC MODE on / host / off";
            NPC_MODE = m; if (m === "off") Object.values(NPCS).forEach((n) => { if (!n.cur || n.cur.source !== "host") npcStop(n); });
            return m === "on" ? "CHARACTERS: ALL ON - CLICK TO TALK, GREETINGS AND ANNOUNCEMENTS" : m === "host" ? "CHARACTERS: HOST ONLY - CLICKS AND GREETINGS OFF, ONLY YOUR BUTTONS (AND GAME ANNOUNCEMENTS)" : "CHARACTERS: ALL OFF - NOBODY TALKS BY THEMSELVES (YOUR BUTTONS STILL WORK)";
          }
          if (a1 === "hush") { Object.values(NPCS).forEach(npcStop); return "EVERY CHARACTER STOPPED TALKING"; }
          if (a1 === "say") {
            const n = NPCS[(parts[2] || "").toLowerCase()], line = parts[3] || ""; if (!n) return "NPC SAY <who> <line> - WHO: " + Object.keys(NPCS).join(" / ");
            if (!n.lines[line]) return "NO LINE " + line.toUpperCase() + " FOR " + n.key.toUpperCase();
            npcTalk(n, line, undefined, true, "host"); return n.key.toUpperCase() + " SAYS: " + line.toUpperCase();
          }
          return "NPC: mode on|host|off, say <who> <line>, hush";
        }
        if (cmd === "name") {                                         // name <id> <text>
          const id = +parts[1]; const t = parts.slice(2).join(" ").slice(0, 18); if (!ONLINE.has(id) || !t) return "NAME <player id> <name>";
          pl(id).name = t; NAMES.set(id, t); boards(); return "PLAYER " + id + " IS NOW " + t.toUpperCase();
        }
        if (cmd === "finalist") {                                     // host can add someone to the finals by hand
          const id = +parts[1]; if (!ONLINE.has(id)) return "FINALIST <player id>";
          const p = pl(id); if (!p.fin) { p.fin = true; H.fin.push(id); doorFix(); boards(); } return nameOf(p).toUpperCase() + " IS A FINALIST";
        }
        return null;
      },
    };
  }
})();
</script>
