  [["MP3", "chime.mp3"], ["OGG", "chime.ogg"], ["OPUS", "chime.opus"]].forEach(([nm, f], k) => {
    const x = 15.2 + k * 1.8, y = 1.6;
    sign("PLAY\n" + nm, x, y, C + 0.3, 1.6, 0.9, { bg: "#2a1a0c", fg: "#ffe6a8" });
    const hb = el("m-cube", { x, y, z: C + 0.45, width: 1.6, height: 0.9, depth: 0.2, color: "#ffffff", opacity: 0, collide: "false", "cast-shadows": "false" });
    hb.addEventListener("click", () => {
      const a = el("m-audio", { src: R + f, x, y, z: C + 0.5, loop: "false", volume: 1, "start-time": now() });
      setTimeout(() => a.remove(), 6000);
    });
  });

  // ---------------------------------------------------------------- left: does Otherside count every copy, or every file?
  const CX = -31, CZ = -14;
  const MODES = [
    ["OFF", "Nothing here.\nWrite down the triangle counter now."],
    ["20 COPIES - SAME LINK", "If the counter went up ~58,600: Otherside counts EVERY COPY.\nIf it went up ~2,900: it counts each FILE once."],
    ["20 COPIES - 20 DIFFERENT LINKS", "Same chair, 20 different links.\nCompare with the setting before."],
    ["1 INSTANCED FILE (20 CHAIRS)", "One file that draws 20 chairs.\nDoes it count 2,900 or 58,600?"],
    ["1 MERGED FILE (20 CHAIRS)", "One file, all 20 chairs baked in.\nShould count 58,600 - but only ONE model to draw."],
  ];
  let mode = 0; const grid = el("m-group", { x: CX, y: 0, z: CZ - 8 });
  const head = sign("", CX, 4.4, CZ, 7, 0.8, { fg: "#ffd27a" }), body = sign("", CX, 3.3, CZ, 7, 1.2, { bg: "#120c22" });
  sign("COUNTING TEST - CLICK HERE TO CHANGE", CX, 2.2, CZ, 7, 0.7, { bg: "#2a1a0c", fg: "#ffe6a8" });
  const btn = el("m-cube", { x: CX, y: 3.2, z: CZ + 0.15, width: 7, height: 3.2, depth: 0.2, color: "#ffffff", opacity: 0, collide: "false", "cast-shadows": "false" });
  const spots = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) spots.push([(c - 2) * 1.5, (r - 1.5) * 1.5]);
  function gridModel(src, attrs) { return el("m-model", Object.assign({ src, collide: "false", "cast-shadows": "false" }, attrs), grid); }
  function paint() {
    const [t, b] = MODES[mode], h = "SETTING " + mode + ": " + t;
    head.setAttribute("content", h); head.setAttribute("font-size", String(fit(6.8, 0.7, h)));
    body.setAttribute("content", b); body.setAttribute("font-size", String(fit(6.8, 1.1, b)));
    Array.from(grid.children).forEach((c) => c.remove());
    if (mode === 1) spots.forEach(([x, z]) => gridModel(R + "chair.glb", { x, y: 0.95, z }));
    if (mode === 2) spots.forEach(([x, z], i) => gridModel(R + "chair.glb?copy=" + i, { x, y: 0.95, z }));
    if (mode === 3) gridModel(R + "chair_instanced.glb", { y: 0.95 });
    if (mode === 4) gridModel(R + "chair_merged.glb", { y: 0.95 });
  }
  let last = 0;
  btn.addEventListener("click", () => { const t = Date.now(); if (t - last < 1500) return; last = t; mode = (mode + 1) % MODES.length; paint(); });
  paint();
})();
</script>
